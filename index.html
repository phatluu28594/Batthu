<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batthu - Ghost & Idle Update v3.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        #map { height: 100%; width: 100%; border-radius: 1rem; z-index: 10; }
        .leaflet-control-attribution { display: none !important; }
        @keyframes petBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .pet-animate { animation: petBounce 2s ease-in-out infinite; }
        @keyframes floatText { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }
        .damage-popup { animation: floatText 0.7s ease-out forwards; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- MÀN HÌNH NHẬP THÔNG TIN CÁ NHÂN LẦN ĐẦU -->
    <div id="player-setup-modal" class="hidden absolute inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-amber-500/50 w-full max-w-sm rounded-2xl p-5 text-zinc-100 shadow-2xl">
            <h3 class="font-bold text-lg text-yellow-300 mb-3 text-center">🤠 Hồ Sơ Nhà Thám Hiểm</h3>
            <p class="text-xs text-zinc-300 mb-4 text-center">Hãy nhập thông tin của bạn để bắt đầu hành trình săn thú!</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Tên nhân vật:</label>
                    <input type="text" id="setup-name" placeholder="Nhập tên của bạn..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Tuổi:</label>
                    <input type="number" id="setup-age" placeholder="Ví dụ: 20" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Giới tính:</label>
                    <select id="setup-gender" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                        <option value="Nam">Nam 👦</option>
                        <option value="Nữ">Nữ 👧</option>
                        <option value="Khác">Khác 🌟</option>
                    </select>
                </div>
            </div>

            <button onclick="savePlayerProfile()" class="w-full mt-5 bg-amber-600 hover:bg-amber-500 py-3 rounded-xl font-bold text-xs shadow-lg text-white cursor-pointer">
                💾 Xác Nhận & Vào Game
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH BẢN ĐỒ GPS & TIỆN ÍCH -->
    <div id="map-screen" class="absolute inset-0 z-20 flex flex-col justify-between bg-zinc-950 p-3">
        <div class="flex justify-between items-center z-30 pt-1">
            <div class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-2">
                <span id="weather-icon" class="text-base">☀️</span>
                <span id="weather-status" class="text-xs font-medium">Trời quang</span>
            </div>
            <div class="flex gap-1 overflow-x-auto py-1">
                <button onclick="openBountyMenu()" class="bg-orange-600/90 px-2.5 py-1 rounded-full border border-orange-400 text-[11px] font-bold shadow cursor-pointer">🎯 Truy nã</button>
                <button onclick="openIdleMenu()" class="bg-indigo-600/90 px-2.5 py-1 rounded-full border border-indigo-400 text-[11px] font-bold shadow cursor-pointer">⏳ Thám hiểm</button>
                <button onclick="openMarketMenu()" class="bg-amber-600/90 px-2.5 py-1 rounded-full border border-amber-400 text-[11px] font-bold shadow cursor-pointer">🛒 Chợ</button>
                <button onclick="openArenaMenu()" class="bg-red-600/90 px-2.5 py-1 rounded-full border border-red-400 text-[11px] font-bold shadow cursor-pointer">⚔️ PvP</button>
                <button onclick="openFarmMenu()" class="bg-emerald-600/90 px-2.5 py-1 rounded-full border border-emerald-400 text-[11px] font-bold shadow cursor-pointer">🏡 Trại</button>
                <button onclick="openEggsMenu()" class="bg-black/80 px-2.5 py-1 rounded-full border border-white/20 text-[11px] font-bold cursor-pointer">🥚(<span id="egg-steps-count">0</span>)</button>
                <button onclick="openTeamMenu()" class="bg-black/80 px-2.5 py-1 rounded-full border border-white/20 text-[11px] font-bold cursor-pointer">🎒(<span id="team-count">0</span>/3)</button>
                <button onclick="openPokedexMenu()" class="bg-black/80 px-2.5 py-1 rounded-full border border-white/20 text-[11px] font-bold cursor-pointer">📖</button>
            </div>
        </div>

        <div class="absolute inset-0 pt-16 pb-24 px-3">
            <div id="map" class="shadow-2xl border border-zinc-800"></div>
            <button onclick="recenterMap()" class="absolute bottom-28 right-6 z-30 bg-blue-600 hover:bg-blue-500 text-white p-3.5 rounded-full shadow-2xl border border-blue-400 active:scale-95 transition-transform flex items-center justify-center text-xl cursor-pointer" title="Về vị trí của tôi">
                📍
            </button>
        </div>

        <div class="flex flex-col items-center z-30 pb-2">
            <div id="stamina-info" class="text-xs font-bold text-amber-300 bg-black/80 px-4 py-1.5 rounded-full border border-white/20 mb-2 shadow-lg flex items-center gap-2">
                ⚡ Năng lượng: <span id="stamina-count">15</span>/15 (<span id="stamina-timer">10:00</span>)
            </div>
            <button onclick="spawnMultipleMonsters()" class="w-full max-w-sm bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2.5 rounded-2xl border border-zinc-700 shadow-xl transition-all text-xs cursor-pointer">
                🔄 Quét lại khu vực (Thú, Boss & Bóng Ma)
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH MINIGAME CANVAS BẮT THÚ -->
    <div id="ar-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-900">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        </div>
        <canvas id="gameCanvas" class="absolute inset-0 z-10 touch-none"></canvas>
        <div class="flex justify-between items-center z-20 p-4 pointer-events-auto">
            <button onclick="exitARScreen()" class="bg-black/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">
                ⬅️ Quay lại bản đồ
            </button>
            <div id="ar-mon-info" class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-yellow-300">
                Mục tiêu: Đang tải...
            </div>
        </div>
        <div class="flex flex-col items-center z-20 pb-8 pointer-events-none">
            <div id="throw-feedback" class="text-sm font-bold bg-black/80 px-4 py-2 rounded-full border border-white/20 opacity-0 transition-opacity shadow-lg">Bắt hụt rồi!</div>
            <div id="throw-attempt-count" class="text-[11px] text-yellow-400 mt-1 bg-black/60 px-3 py-0.5 rounded-full border border-white/10 font-bold">Lượt quăng: 0/3</div>
            <div class="text-[11px] text-zinc-300 mt-1 bg-black/60 px-3 py-1 rounded-full border border-white/10">🤠 Vuốt ngón tay hướng lên trên để quăng vòng dây thừng!</div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẤU TRƯỜNG PVP REALTIME -->
    <div id="battle-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-950 p-4">
        <div class="flex justify-between items-center z-20">
            <div id="battle-title-tag" class="bg-red-600/90 px-4 py-1.5 rounded-full font-bold text-xs border border-red-400">⚔️ ĐẤU TRƯỜNG V3.4</div>
            <button onclick="exitBattleScreen()" class="bg-black/80 px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">Rút lui</button>
        </div>
        <div class="relative flex-1 my-4 bg-gradient-to-b from-amber-950/80 via-zinc-900 to-zinc-950 rounded-2xl border-2 border-amber-500/60 overflow-hidden flex flex-col items-center justify-center shadow-2xl">
            <canvas id="battleCanvas" class="absolute inset-0 w-full h-full"></canvas>
            <div id="damage-popup-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            <div id="battle-log" class="absolute bottom-4 bg-black/90 px-5 py-2.5 rounded-xl text-xs text-yellow-300 font-bold border border-yellow-500/50 text-center max-w-sm shadow-xl">
                Đang chuẩn bị giao tranh...
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY CHUNG -->
    <div id="modal-container" class="hidden absolute inset-0 z-40 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
    <script>
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let farm = JSON.parse(localStorage.getItem('ar_farm') || '[]');
        let pokedex = JSON.parse(localStorage.getItem('ar_pokedex') || '[]');
        let eggSteps = parseInt(localStorage.getItem('ar_egg_steps') || '0');
        let playerCoins = parseInt(localStorage.getItem('ar_coins') || '500');

        let stamina = parseInt(localStorage.getItem('ar_stamina') || '15');
        let lastStaminaTime = parseInt(localStorage.getItem('ar_stamina_time') || Date.now());

        let inventory = JSON.parse(localStorage.getItem('ar_inventory') || JSON.stringify({ food: 5, toy: 5, trainer: 3, meat: 0, stoneKim: 0, stoneMoc: 0, stoneThuy: 0, stoneHoa: 0, stoneTho: 0 }));
        
        // --- HỆ THỐNG IDLE THÁM HIỂM ---
        let idleExpedition = JSON.parse(localStorage.getItem('ar_idle_exp') || 'null');

        function openIdleMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let now = Date.now();
            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">⏳ Gửi Linh Thú Thám Hiểm</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div>`;

            if (!idleExpedition) {
                html += `<p class="text-xs text-zinc-300 mb-3">Chọn linh thú từ đội hình gửi đi khai khoáng nhận Vàng & Vật phẩm khi offline!</p>`;
                if (team.length === 0) {
                    html += `<div class="text-center text-xs text-red-400 py-4">Đội hình trống, không có thú để cử đi!</div>`;
                } else {
                    html += `<div class="space-y-2 max-h-60 overflow-y-auto">`;
                    team.forEach((pet, idx) => {
                        html += `
                        <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between border border-zinc-700">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">${pet.emoji}</span>
                                <div>
                                    <div class="font-bold text-xs">${pet.name} (Lv.${pet.level || 1})</div>
                                    <div class="text-[10px] text-zinc-400">HP: ${pet.hp}/${pet.maxHp}</div>
                                </div>
                            </div>
                            <button onclick="startIdle(${idx})" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded font-bold text-xs cursor-pointer">Cử đi (4 Tiếng)</button>
                        </div>`;
                    });
                    html += `</div>`;
                }
            } else {
                let timeLeft = idleExpedition.endTime - now;
                let isFinished = timeLeft <= 0;
                let minLeft = Math.max(0, Math.ceil(timeLeft / 60000));

                html += `
                <div class="bg-zinc-800 p-5 rounded-2xl border border-indigo-500/50 text-center space-y-3">
                    <div class="text-6xl animate-bounce">${idleExpedition.pet.emoji}</div>
                    <div class="font-bold text-sm text-yellow-300">${idleExpedition.pet.name} đang thám hiểm vùng đất linh khí!</div>
                    <div class="text-xs text-zinc-300">${isFinished ? '🎉 Đã hoàn thành chuyến đi!' : `⏱️ Thời gian còn lại: khoảng ${minLeft} phút`}</div>
                    <button onclick="claimIdle()" ${isFinished ? '' : 'disabled'} class="w-full py-3 rounded-xl font-bold text-xs ${isFinished ? 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer' : 'bg-zinc-700 text-zinc-400 opacity-50 cursor-not-allowed'}">
                        ${isFinished ? '🎁 THU HOẠCH PHẦN THƯỞNG' : '🔒 Đang thám hiểm...'}
                    </button>
                </div>`;
            }
            content.innerHTML = html;
        }

        function startIdle(index) {
            let pet = team.splice(index, 1)[0];
            localStorage.setItem('ar_team', JSON.stringify(team));
            updateTeamCount();

            idleExpedition = {
                pet: pet,
                endTime: Date.now() + (4 * 60 * 60 * 1000) // 4 tiếng thực tế (hoặc test nhanh bạn có thể giảm xuống)
            };
            localStorage.setItem('ar_idle_exp', JSON.stringify(idleExpedition));
            alert(`🚀 Đã cử ${pet.name} lên đường thám hiểm!`);
            openIdleMenu();
        }

        function claimIdle() {
            if (!idleExpedition) return;
            let pet = idleExpedition.pet;
            let rewardCoins = 300 + Math.floor(Math.random() * 200);
            let rewardFood = 2;
            
            playerCoins += rewardCoins;
            inventory.food += rewardFood;
            pet.level += 5; // Tăng cấp khi thám hiểm về

            if (team.length < 3) {
                team.push(pet);
            } else {
                farm.push(pet);
            }

            localStorage.setItem('ar_coins', playerCoins);
            saveInventory();
            localStorage.setItem('ar_team', JSON.stringify(team));
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            updateTeamCount();

            idleExpedition = null;
            localStorage.removeItem('ar_idle_exp');

            alert(`🎉 Thu hoạch thành công: +${rewardCoins} Vàng, +2 Thức ăn & Thú tăng +5 Cấp độ!`);
            closeModal();
        }

        // --- HỆ THỐNG SĂN TIỀN THƯỞNG TRUY NÃ ---
        let bounties = [
            { id: 1, name: 'Sư Tử Ma Quái', emoji: '🦁', cp: 350, reward: 500, hp: 200, atk: 110, element: 'Hỏa', completed: false },
            { id: 2, name: 'Hắc Hổ Đột Biến', emoji: '🐯', cp: 420, reward: 700, hp: 250, atk: 130, element: 'Kim', completed: false }
        ];

        function openBountyMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🎯 Bảng Truy Nã Mục Tiêu</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div>`;
            html += `<div class="space-y-3">`;
            bounties.forEach((b, idx) => {
                html += `
                <div class="bg-zinc-800 p-3 rounded-xl border border-orange-500/50 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="text-4xl">${b.emoji}</span>
                        <div>
                            <div class="font-bold text-xs text-orange-400">${b.name} [Hệ ${b.element}]</div>
                            <div class="text-[10px] text-zinc-300">CP: ${b.cp} | Thưởng: ${b.reward} 🪙</div>
                        </div>
                    </div>
                    <button onclick="attackBounty(${idx})" ${b.completed ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl font-bold text-xs ${b.completed ? 'bg-zinc-700 text-zinc-400 opacity-50' : 'bg-orange-600 hover:bg-orange-500 text-white cursor-pointer'}">
                        ${b.completed ? 'Đã tiêu diệt' : 'Truy nã ngay'}
                    </button>
                </div>`;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        let currentBountyIndex = null;
        function attackBounty(idx) {
            currentBountyIndex = idx;
            let b = bounties[idx];
            closeModal();
            startCanvasBattle(null, false, { name: b.name, emoji: b.emoji, hp: b.hp, maxHp: b.hp, atk: b.atk, level: 50, element: b.element, critRate: 20, dodgeRate: 15, accuracy: 25, attackSpeed: 1.3 }, 'bounty');
        }

        const lobbyMusic = new Audio('lobbymusic.mp3'); 
        const battleMusic = new Audio('arena.mp3'); 

        lobbyMusic.loop = true;
        battleMusic.loop = true;
        lobbyMusic.volume = 0.4;
        battleMusic.volume = 0.5;

        let isMusicPlaying = false;

        document.addEventListener('click', () => {
            if (!isMusicPlaying) {
                isMusicPlaying = true;
                lobbyMusic.play().catch(e => {});
            }
        }, { once: true });

        function switchGameMusic(scene) {
            if (!isMusicPlaying) return;
            if (scene === 'battle') {
                lobbyMusic.pause();
                battleMusic.currentTime = 0;
                battleMusic.play().catch(e => {});
            } else if (scene === 'map') {
                battleMusic.pause();
                lobbyMusic.play().catch(e => {});
            }
        }

        function checkPlayerProfile() {
            let profile = JSON.parse(localStorage.getItem('ar_player_profile') || 'null');
            const setupModal = document.getElementById('player-setup-modal');
            if (!profile && setupModal) {
                setupModal.classList.remove('hidden');
            }
        }

        function savePlayerProfile() {
            let name = document.getElementById('setup-name').value.trim();
            let age = document.getElementById('setup-age').value.trim();
            let gender = document.getElementById('setup-gender').value;

            if (!name) { alert('Vui lòng nhập tên nhân vật của bạn!'); return; }
            if (!age || age <= 0) { alert('Vui lòng nhập số tuổi hợp lệ!'); return; }

            localStorage.setItem('ar_player_profile', JSON.stringify({ name, age, gender }));
            document.getElementById('player-setup-modal').classList.add('hidden');
            alert(`Chào mừng nhà thám hiểm ${name} đã tham gia game!`);
            setTimeout(() => { if (map) map.invalidateSize(); }, 200);
        }

        function sanitizePetsData(petList) {
            return petList.map(p => ({
                ...p,
                maxHp: p.maxHp || p.hp || 80,
                hp: (p.hp !== undefined && p.hp > 0) ? p.hp : (p.maxHp || 80),
                level: p.level || 1,
                critRate: p.critRate !== undefined ? p.critRate : Math.floor(10 + Math.random() * 20),
                dodgeRate: p.dodgeRate !== undefined ? p.dodgeRate : Math.floor(5 + Math.random() * 15),
                accuracy: p.accuracy !== undefined ? p.accuracy : Math.floor(10 + Math.random() * 20),
                attackSpeed: p.attackSpeed !== undefined ? p.attackSpeed : parseFloat((1.2 + Math.random() * 0.5).toFixed(1)),
                hunger: p.hunger !== undefined ? p.hunger : 80,
                happiness: p.happiness !== undefined ? p.happiness : 80
            }));
        }
        team = sanitizePetsData(team);
        farm = sanitizePetsData(farm);

        const elements = [
            { name: 'Kim', icon: '⚔️', color: 'text-yellow-300' },
            { name: 'Mộc', icon: '🌿', color: 'text-emerald-400' },
            { name: 'Thủy', icon: '💧', color: 'text-blue-400' },
            { name: 'Hỏa', icon: '🔥', color: 'text-red-500' },
            { name: 'Thổ', icon: '🪨', color: 'text-amber-600' }
        ];

        function checkElementAdvantage(attackerElem, defenderElem) {
            if (!attackerElem || !defenderElem) return false;
            let rules = { 'Kim': 'Mộc', 'Mộc': 'Thổ', 'Thổ': 'Thủy', 'Thủy': 'Hỏa', 'Hỏa': 'Kim' };
            return rules[attackerElem] === defenderElem;
        }

        const categories = {
            'Gia cầm': [
                { id: 101, name: 'Gà Ta', emoji: '🐔', cp: 120, hp: 60, maxHp: 60, atk: 70, level: 1, rarePrice: 100, attackType: 'melee' },
                { id: 102, name: 'Vịt Cỏ', emoji: '🦆', cp: 110, hp: 55, maxHp: 55, atk: 65, level: 1, rarePrice: 90, attackType: 'magic' },
                { id: 103, name: 'Ngỗng Trắng', emoji: '🦢', cp: 140, hp: 80, maxHp: 80, atk: 85, level: 1, rarePrice: 130, attackType: 'charge' },
                { id: 104, name: 'Ngan Đen', emoji: '🦃', cp: 130, hp: 75, maxHp: 75, atk: 80, level: 1, rarePrice: 120, attackType: 'melee' }
            ],
            'Gia súc': [
                { id: 201, name: 'Chó Vàng', emoji: '🐕', cp: 145, hp: 80, maxHp: 80, atk: 90, level: 1, rarePrice: 150, attackType: 'melee' },
                { id: 202, name: 'Mèo Mướp', emoji: '🐈', cp: 135, hp: 70, maxHp: 70, atk: 95, level: 1, rarePrice: 140, attackType: 'magic' },
                { id: 203, name: 'Heo Ủn Ỉn', emoji: '🐖', cp: 150, hp: 100, maxHp: 100, atk: 75, level: 1, rarePrice: 160, attackType: 'charge' },
                { id: 204, name: 'Bò Sữa', emoji: '🐂', cp: 180, hp: 120, maxHp: 120, atk: 110, level: 1, rarePrice: 200, attackType: 'melee' }
            ],
            'Tự nhiên': [
                { id: 301, name: 'Chuột Nước', emoji: '🐹', cp: 110, hp: 60, maxHp: 60, atk: 65, level: 1, rarePrice: 110, attackType: 'magic' },
                { id: 302, name: 'Chim Lửa', emoji: '🐦', cp: 185, hp: 50, maxHp: 50, atk: 140, level: 1, rarePrice: 250, attackType: 'magic' },
                { id: 303, name: 'Cáo Đỏ', emoji: '🦊', cp: 160, hp: 65, maxHp: 65, atk: 115, level: 1, rarePrice: 180, attackType: 'charge' },
                { id: 304, name: 'Sói Xám', emoji: '🐺', cp: 175, hp: 90, maxHp: 90, atk: 125, level: 1, rarePrice: 220, attackType: 'melee' }
            ],
            'Sách đỏ': [

        function initStaminaSystem() {
            setInterval(() => {
                let now = Date.now();
                let diffSec = Math.floor((now - lastStaminaTime) / 1000);
                let rechargeInterval = 10 * 60;

                if (stamina < 15) {
                    let addedStamina = Math.floor(diffSec / rechargeInterval);
                    if (addedStamina > 0) {
                        stamina = Math.min(15, stamina + addedStamina);
                        lastStaminaTime = now - (diffSec % rechargeInterval) * 1000;
                        localStorage.setItem('ar_stamina', stamina);
                        localStorage.setItem('ar_stamina_time', lastStaminaTime);
                    }
                } else {
                    lastStaminaTime = now;
                    localStorage.setItem('ar_stamina_time', lastStaminaTime);
                }

                let nextRechargeTime = rechargeInterval - (Math.floor((now - lastStaminaTime) / 1000) % rechargeInterval);
                let m = Math.floor(nextRechargeTime / 60);
                let s = nextRechargeTime % 60;
                document.getElementById('stamina-count').innerText = stamina;
                document.getElementById('stamina-timer').innerText = stamina >= 15 ? 'MAX' : `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        function initFarmCanvasAnimation() {
            farmCanvas = document.getElementById('farmCanvas');
            if (!farmCanvas) return;
            farmCtx = farmCanvas.getContext('2d');
            farmCanvas.width = farmCanvas.clientWidth;
            farmCanvas.height = farmCanvas.clientHeight;

            farmPetsState = farm.map((pet) => ({
                ...pet,
                x: Math.random() * (farmCanvas.width - 60) + 30,
                y: Math.random() * (farmCanvas.height - 60) + 30,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.2,
                wobble: Math.random() * Math.PI
            }));

            if (farmAnimInterval) clearInterval(farmAnimInterval);
            farmAnimInterval = setInterval(() => {
                if (!farmCtx || !farmCanvas) return;
                farmCtx.clearRect(0, 0, farmCanvas.width, farmCanvas.height);
                farmCtx.fillStyle = '#064e3b';
                farmCtx.fillRect(0, 0, farmCanvas.width, farmCanvas.height);

                farmPetsState.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.wobble += 0.1;
                    if (p.x < 30 || p.x > farmCanvas.width - 30) p.vx *= -1;
                    if (p.y < 30 || p.y > farmCanvas.height - 30) p.vy *= -1;

                    let bounceY = p.y + Math.sin(p.wobble) * 4;
                    farmCtx.font = "40px sans-serif";
                    farmCtx.textAlign = "center";
                    farmCtx.textBaseline = "middle";
                    farmCtx.fillText(p.emoji, p.x, bounceY);
                    farmCtx.font = "10px sans-serif";
                    farmCtx.fillStyle = "#fde047";
                    farmCtx.fillText(p.name, p.x, bounceY + 26);
                });
            }, 50);
        }

                        <div class="flex justify-between text-[10px] mb-0.5"><span>HP</span><span>${pet.hp}/${pet.maxHp}</span></div>
                        <div class="w-full bg-zinc-900 rounded-full h-1.5 overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${(pet.hp/pet.maxHp)*100}%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] mb-0.5"><span>Độ no</span><span>${pet.hunger}%</span></div>
                        <div class="w-full bg-zinc-900 rounded-full h-1.5 overflow-hidden"><div class="bg-amber-500 h-full" style="width: ${pet.hunger}%"></div></div>
                    </div>

                        <div class="flex justify-between text-[10px] mb-0.5"><span>Hạnh phúc</span><span>${pet.happiness}%</span></div>
                        <div class="w-full bg-zinc-900 rounded-full h-1.5 overflow-hidden"><div class="bg-pink-500 h-full" style="width: ${pet.happiness}%"></div></div>
                    </div>
                </div>

            <div class="space-y-2 mb-3">
                <button onclick="evolvePet(${index}, '${stoneKey}')" class="w-full bg-purple-600 hover:bg-purple-500 p-2.5 rounded-xl font-bold text-xs shadow flex items-center justify-between px-4 cursor-pointer">
                    <span>🌟 Tiến Hóa Thú Bằng ${stoneName} (Cần Lv.200)</span>
                    <span class="bg-black/40 px-2 py-0.5 rounded">Kho: ${stoneCount}</span>
                </button>
            </div>

            <div class="grid grid-cols-3 gap-2 text-center">
                <button onclick="petAction(${index}, 'feed')" class="bg-emerald-600 p-2.5 rounded-xl font-bold text-xs cursor-pointer">🍖 Cho ăn (${inventory.food})</button>
                <button onclick="petAction(${index}, 'play')" class="bg-amber-600 p-2.5 rounded-xl font-bold text-xs cursor-pointer">🎾 Chơi (${inventory.toy})</button>
                <button onclick="petAction(${index}, 'train')" class="bg-indigo-600 p-2.5 rounded-xl font-bold text-xs cursor-pointer">🏋️ Tập (${inventory.trainer})</button>
            </div>`;
        }

        function evolvePet(index, stoneKey) {
            let pet = team[index];
            if ((pet.level || 1) < 200) {
                alert(`⚠️ Thú cưng chưa đủ cấp độ! Yêu cầu phải đạt tối thiểu Level 200 (Hiện tại: Lv.${pet.level || 1}). Hãy dùng Dụng cụ tập để luyện cấp!`);
                return;
            }
            if ((inventory[stoneKey] || 0) <= 0) {
                alert(`Bạn không có viên đá phù hợp hệ này! Hãy mua tại Chợ Đen.`);
                return;
            }
            inventory[stoneKey]--;
            saveInventory();
            pet.buffEffect = 'Cấp Tiến Hóa Siêu Việt';
            pet.atk += 50;
            pet.maxHp += 100;
            pet.hp = pet.maxHp;
            localStorage.setItem('ar_team', JSON.stringify(team));
            alert(`🌟 Chúc mừng ${pet.name} đã tiến hóa thành công! Chỉ số tăng cực mạnh!`);
            openPetDetail(index);
        }

        function petAction(index, action) {
            let pet = team[index];
            if (action === 'feed') {
                if (inventory.food <= 0) { alert('Hết Thức ăn!'); return; }
                inventory.food--;
                pet.hunger = Math.min(100, pet.hunger + 25);
                pet.hp = Math.min(pet.maxHp, pet.hp + 20);
            } else if (action === 'play') {
                if (inventory.toy <= 0) { alert('Hết Đồ chơi!'); return; }
                inventory.toy--;
                pet.happiness = Math.min(100, pet.happiness + 30);
            } else if (action === 'train') {
                if (inventory.trainer <= 0) { alert('Hết Dụng cụ tập!'); return; }
                inventory.trainer--;
                pet.level++;
                pet.atk += 12;
                pet.maxHp += 20;
                pet.hp = pet.maxHp;
            }
            saveInventory();
            localStorage.setItem('ar_team', JSON.stringify(team));
            openPetDetail(index);
        }

        function removePet(index) {
            let pet = team.splice(index, 1)[0];
            farm.push(pet);
            localStorage.setItem('ar_team', JSON.stringify(team));
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            updateTeamCount();
            openTeamMenu();
        }

        let capturedTempMonster = null;

        function promptCatchChoice(monster) {
            capturedTempMonster = {
                ...monster,
                maxHp: monster.maxHp || monster.hp || 80,
                hp: monster.maxHp || monster.hp || 80,
                level: 1,
                hunger: 80,
                happiness: 80,
                critRate: Math.floor(1 + Math.random() * 34),
                dodgeRate: Math.floor(1 + Math.random() * 34),
                accuracy: Math.floor(1 + Math.random() * 34),
                attackSpeed: parseFloat((1.0 + Math.random() * 1.0).toFixed(1)),
                buffEffect: null
            };

            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let elemObj = elements.find(e => e.name === monster.element) || elements[0];
            content.innerHTML = `
            <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">🎉 Bắt Thành Công!</h3></div>
            <div class="flex flex-col items-center bg-zinc-800 p-4 rounded-2xl border border-zinc-700 mb-4 text-center">
                <span class="text-7xl mb-2">${monster.emoji}</span>
                <div class="text-lg font-bold text-yellow-300">${monster.name} <span class="${elemObj.color} text-sm">(${elemObj.icon}${monster.element})</span></div>
                <div class="text-xs text-zinc-400 mt-1">CP: ${monster.cp} | Chí mạng: ${capturedTempMonster.critRate}% | Né: ${capturedTempMonster.dodgeRate}%</div>
            </div>
            <div class="space-y-2">
                <button onclick="handleCatchDecision('team')" class="w-full bg-emerald-600 py-3 rounded-xl font-bold text-xs cursor-pointer">🎒 Đưa vào Đội hình (hoặc Trang Trại)</button>
                <button onclick="handleCatchDecision('meat')" class="w-full bg-amber-600 py-3 rounded-xl font-bold text-xs cursor-pointer">🥩 Giết lấy thịt (+Thức ăn & Vàng)</button>
                <button onclick="handleCatchDecision('sell')" class="w-full bg-red-600 py-3 rounded-xl font-bold text-xs cursor-pointer">💰 Bán ngay (${monster.rarePrice} Vàng)</button>
            </div>`;
        }

        function handleCatchDecision(action) {
            if (action === 'team') {
                if (team.length < 3) {
                    team.push(capturedTempMonster);
                    localStorage.setItem('ar_team', JSON.stringify(team));
                    alert(`Đã đưa ${capturedTempMonster.name} vào đội hình chiến đấu!`);
                } else {
                    farm.push(capturedTempMonster);
                    localStorage.setItem('ar_farm', JSON.stringify(farm));
                    alert(`Đội hình chính đã đầy (3/3), ${capturedTempMonster.name} đã được đưa vào Trang Trại!`);
                }
                updateTeamCount();
            } else if (action === 'meat') {
                inventory.food += 2;
                playerCoins += 30;
                saveInventory();
                localStorage.setItem('ar_coins', playerCoins);
                alert(`Nhận +2 Thức ăn & +30 Vàng!`);
            } else if (action === 'sell') {
                playerCoins += capturedTempMonster.rarePrice;
                localStorage.setItem('ar_coins', playerCoins);
                alert(`Bán thành công +${capturedTempMonster.rarePrice} Vàng!`);
            }

            if (!pokedex.includes(capturedTempMonster.id)) {
                pokedex.push(capturedTempMonster.id);
                localStorage.setItem('ar_pokedex', JSON.stringify(pokedex));
            }

            closeModal();
            spawnMultipleMonsters();
        }

        function openArenaMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">⚔️ Sảnh Đấu Trường</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div>
            <p class="text-xs text-zinc-300 mb-4">Thời tiết hiện tại: <strong>${currentWeather.name} (${currentWeather.effect})</strong></p>
            <p class="text-[11px] text-zinc-400 mb-3">💡 Mẹo: Bấm trực tiếp vào các biểu tượng Bóng ma Người chơi trên bản đồ để thách đấu realtime!</p>
            <button onclick="startCanvasBattle(null)" class="w-full bg-zinc-700 py-3 rounded-xl font-bold text-xs cursor-pointer">🤖 Đấu Tập Nhanh (Với Bot)</button>
            `;
        }

        let battleCanvas, battleCtx, battleInterval;
        let myBattlePet, enemyBattlePet;
        let myHp, enemyHp, myMaxHp, enemyMaxHp;
        let battleState = 'fighting';
        let battleModeTitle = '⚔️ ĐẤU TRƯỜNG';
        let animActionTick = 0;
        let activeBattleType = 'normal'; // 'normal', 'boss', 'ghost', 'bounty'

        function startCanvasBattle(opponentObj = null, isWorldBoss = false, customEnemy = null, type = 'normal') {
            switchGameMusic('battle');
            checkPetSurvival();
            if (team.length === 0) { alert('Đội hình trống! Không có thú để chiến đấu.'); closeModal(); return; }
            if (team[0].happiness < 30) { alert(`⚠️ ${team[0].name} đang bất mãn và từ chối chiến đấu!`); closeModal(); return; }

            closeModal();
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');

            myBattlePet = team[0];
            activeBattleType = type;

            if (isWorldBoss) {
                enemyBattlePet = { name: 'Rồng Khổng Lồ (Boss)', emoji: '🐲', hp: 300, maxHp: 300, atk: 120, level: 10, element: 'Hỏa', critRate: 25, dodgeRate: 20, accuracy: 30, attackSpeed: 1.5 };
                battleModeTitle = '🔥 ĐẠI CHIẾN BOSS THẾ GIỚI 🔥';
            } else if (customEnemy) {
                enemyBattlePet = { ...customEnemy };
                battleModeTitle = type === 'bounty' ? '🎯 SĂN TIỀN THƯỞNG TRUY NÃ' : `👻 THÁCH ĐẤU BÓNG MA [${customEnemy.name.toUpperCase()}]`;
            } else if (opponentObj && opponentObj.pet) {
                enemyBattlePet = { ...opponentObj.pet };
                battleModeTitle = `⚔️ THÁCH ĐẤU [${opponentObj.name.toUpperCase()}]`;
            } else {
                let enemyBase = allMonsters[Math.floor(Math.random() * allMonsters.length)];
                let enemyElem = elements[Math.floor(Math.random() * elements.length)].name;
                enemyBattlePet = { ...enemyBase, level: myBattlePet.level, element: enemyElem, critRate: 15, dodgeRate: 12, accuracy: 20, attackSpeed: 1.2, buffEffect: null };
                battleModeTitle = `⚔️ ĐẤU TRƯỜNG LUYỆN TẬP`;
            }

            document.getElementById('battle-title-tag').innerText = battleModeTitle;

            myMaxHp = myBattlePet.maxHp;
            myHp = myBattlePet.hp;
            enemyMaxHp = enemyBattlePet.maxHp;
            enemyHp = enemyBattlePet.maxHp;
            battleState = 'fighting';
            animActionTick = 0;

            battleCanvas = document.getElementById('battleCanvas');
            battleCtx = battleCanvas.getContext('2d');
            battleCanvas.width = battleCanvas.clientWidth;
            battleCanvas.height = battleCanvas.clientHeight;

            runBattleLoop();
        }

        function exitBattleScreen() {
            switchGameMusic('map');
            clearInterval(battleInterval);
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if (map) map.invalidateSize();
        }

        function showDamagePopup(text, isCrit, x, y) {
            const container = document.getElementById('damage-popup-container');
            if(!container) return;
            const el = document.createElement('div');
            el.className = `absolute text-sm font-black damage-popup ${isCrit ? 'text-yellow-300 text-lg scale-125' : 'text-red-400'}`;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerText = text;
            container.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function runBattleLoop() {
            let animStep = 0;
            battleInterval = setInterval(() => {
                if (!battleCtx || !battleCanvas) return;
                battleCtx.clearRect(0, 0, battleCanvas.width, battleCanvas.height);
                animStep++;
                animActionTick++;

                let grad = battleCtx.createRadialGradient(battleCanvas.width/2, battleCanvas.height/2, 10, battleCanvas.width/2, battleCanvas.height/2, 280);
                grad.addColorStop(0, '#9a3412');
                grad.addColorStop(0.6, '#451a03');
                grad.addColorStop(1, '#09090b');
                battleCtx.fillStyle = grad;
                battleCtx.fillRect(0, 0, battleCanvas.width, battleCanvas.height);

                let myX = 85 + Math.sin(animStep * 0.15) * 15;
                let enemyX = battleCanvas.width - 125 - Math.sin(animStep * 0.15) * 15;
                let centerY = battleCanvas.height / 2 - 15;

                let myElemObj = elements.find(e => e.name === myBattlePet.element) || elements[0];
                let enemyElemObj = elements.find(e => e.name === enemyBattlePet.element) || elements[0];

                battleCtx.font = "80px sans-serif";
                battleCtx.textAlign = "center";
                battleCtx.fillText(myBattlePet.emoji, myX, centerY);

                battleCtx.fillStyle = "#18181b";
                battleCtx.fillRect(25, centerY + 55, 130, 14);
                battleCtx.fillStyle = "#10b981";
                battleCtx.fillRect(25, centerY + 55, 130 * Math.max(0, myHp / myMaxHp), 14);
                battleCtx.font = "10px sans-serif";
                battleCtx.fillStyle = "#fff";
                battleCtx.fillText(`${myBattlePet.name} (${myElemObj.icon}${myBattlePet.element})`, 90, centerY + 50);

                battleCtx.font = "80px sans-serif";
                battleCtx.fillText(enemyBattlePet.emoji, enemyX, centerY);

                battleCtx.fillStyle = "#18181b";
                battleCtx.fillRect(battleCanvas.width - 155, centerY + 55, 130, 14);
                battleCtx.fillStyle = "#ef4444";
                battleCtx.fillRect(battleCanvas.width - 155, centerY + 55, 130 * Math.max(0, enemyHp / enemyMaxHp), 14);
                battleCtx.font = "10px sans-serif";
                battleCtx.fillStyle = "#fff";
                battleCtx.fillText(`${enemyBattlePet.name} (${enemyElemObj.icon}${enemyBattlePet.element})`, battleCanvas.width - 90, centerY + 50);

                let tickInterval = 25;

                if (battleState === 'fighting' && animActionTick % tickInterval === 0) {
                    let totalDodge = Math.max(0, enemyBattlePet.dodgeRate + currentWeather.weatherDodge - myBattlePet.accuracy);
                    if (Math.random() * 100 > totalDodge) {
                        let isCrit = Math.random() * 100 < myBattlePet.critRate;
                        let myHasAdvantage = checkElementAdvantage(myBattlePet.element, enemyBattlePet.element);
                        let weatherBuff = (currentWeather.name === 'Nắng gắt' && myBattlePet.element === 'Hỏa') ? 1.2 : currentWeather.buffAtk;
                        let dmgMultiplier = isCrit ? 1.5 : 1.0;
                        let myBaseDmg = Math.floor(myBattlePet.atk * 0.4 * dmgMultiplier * weatherBuff);
                        if (myHasAdvantage) myBaseDmg = Math.floor(myBaseDmg * 1.35);

                        enemyHp -= myBaseDmg;
                        showDamagePopup(`-${myBaseDmg}`, isCrit, battleCanvas.width - 130, centerY - 20);
                    } else {
                        showDamagePopup(`Né!`, false, battleCanvas.width - 130, centerY - 20);
                    }

                    if (enemyHp > 0) {
                        let enemyDmg = Math.floor(enemyBattlePet.atk * 0.35);
                        myHp -= enemyDmg;
                        showDamagePopup(`-${enemyDmg}`, false, 90, centerY - 20);
                    }

                    if (enemyHp <= 0 || myHp <= 0) {
                        battleState = enemyHp > 0 ? 'lost' : 'won';
                    }
                }

                if (battleState === 'won' || battleState === 'lost') {
                    clearInterval(battleInterval);
                    let hpLostPercent = Math.max(0, (myMaxHp - Math.max(0, myHp)) / myMaxHp);
                    myBattlePet.hp = Math.max(0, myHp);
                    
                    let rewardCoins = battleState === 'won' ? 400 : 0;
                    if (activeBattleType === 'bounty' && battleState === 'won' && currentBountyIndex !== null) {
                        rewardCoins = bounties[currentBountyIndex].reward;
                        bounties[currentBountyIndex].completed = true;
                    }

                    if (battleState === 'won') {
                        playerCoins += rewardCoins;
                        localStorage.setItem('ar_coins', playerCoins);
                        team[0] = myBattlePet;
                        localStorage.setItem('ar_team', JSON.stringify(team));
                    }
                    showBattleResultModal(battleState === 'won', rewardCoins, hpLostPercent, myBattlePet.name);
                }
            }, 80);
        }

        function showBattleResultModal(isWon, coinsEarned, hpLostPct, petName) {
            switchGameMusic('map');
            exitBattleScreen();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `
            <div class="flex flex-col items-center text-center py-2">
                <div class="text-6xl mb-2">${isWon ? '🏆' : '💀'}</div>
                <h3 class="font-bold text-xl ${isWon ? 'text-yellow-400' : 'text-red-500'} mb-1">${isWon ? 'CHIẾN THẮNG VANG DỘI!' : 'THẤT BẠI THẢM HẢI!'}</h3>
                <div class="w-full bg-zinc-800 p-4 rounded-2xl border border-zinc-700 text-left space-y-2 mb-4">
                    <div class="flex justify-between text-xs"><span>Phần thưởng Vàng:</span><strong class="text-yellow-400">+${coinsEarned} 🪙</strong></div>
                    <div class="flex justify-between text-xs"><span>Tổn thất HP thú:</span><strong class="text-red-400">-${Math.floor(hpLostPct * 100)}% HP</strong></div>
                </div>
                <button onclick="closeModal(); spawnMultipleMonsters();" class="w-full bg-amber-600 py-3 rounded-xl font-bold text-xs shadow-lg cursor-pointer">Tiếp Tục Khám Phá Bản Đồ</button>
            </div>`;
        }

        let map, userMarker;
        let activeMarkers = [];
        let ghostMarkers = [];
        let userLat = 10.0452, userLng = 105.7469; 

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            const userIcon = L.divIcon({
                className: 'custom-user-icon',
                html: '<div style="font-size: 28px; filter: drop-shadow(0 0 8px rgba(59,130,246,0.8));">📍</div>',
                iconSize: [30, 30], iconAnchor: [15, 15]
            });

            userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);
            spawnMultipleMonsters();
            spawnGhostPlayers();

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    if (userMarker) userMarker.setLatLng([userLat, userLng]);
                }, (error) => {}, { enableHighAccuracy: true });
            }

            setTimeout(() => { if(map) map.invalidateSize(); }, 300);
        }

        function recenterMap() { 
            if (map) {
                map.setView([userLat, userLng], 17); 
                map.invalidateSize();
            }
        }

        // --- HỆ THỐNG BÓNG MA NGƯỜI CHƠI (GHOST REPLAYS) ---
        let ghostPlayers = [
            { id: 'g1', name: 'Ghost_Viper', avatar: '👻', pet: { name: 'Xà Vương', emoji: '🐍', cp: 180, hp: 95, maxHp: 95, atk: 110, level: 65, element: 'Mộc', critRate: 20, dodgeRate: 25, accuracy: 25, attackSpeed: 1.4 } },
            { id: 'g2', name: 'Ghost_Shadow', avatar: '👤', pet: { name: 'Dơi Bóng Tối', emoji: '🦇', cp: 165, hp: 75, maxHp: 75, atk: 115, level: 50, element: 'Thủy', critRate: 18, dodgeRate: 30, accuracy: 20, attackSpeed: 1.5 } }
        ];

        function spawnGhostPlayers() {
            if (!map) return;
            ghostMarkers.forEach(m => map.removeLayer(m));
            ghostMarkers = [];

            ghostPlayers.forEach((ghost) => {
                let gLat = userLat + (Math.random() - 0.5) * 0.0025;
                let gLng = userLng + (Math.random() - 0.5) * 0.0025;

                const ghostIcon = L.divIcon({
                    className: 'custom-ghost-icon',
                    html: `<div style="font-size: 30px; animation: bounce 2s infinite; filter: drop-shadow(0 0 8px rgba(129,140,248,0.9));">${ghost.avatar}</div>`,
                    iconSize: [32, 32], iconAnchor: [16, 16]
                });

                const marker = L.marker([gLat, gLng], { icon: ghostIcon }).addTo(map);
                marker.on('click', () => { openGhostModal(ghost); });
                ghostMarkers.push(marker);
            });
        }

        function spawnMultipleMonsters() {
            if (!map) return;
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            // Boss Thế Giới
            const bossData = {
                name: 'Rồng Khổng Lồ', emoji: '🐲', cp: 500, element: 'Hỏa', isBoss: true,
                lat: userLat + (Math.random() - 0.5) * 0.003,
                lng: userLng + (Math.random() - 0.5) * 0.003
            };
            const bossIcon = L.divIcon({
                className: 'custom-boss-icon',
                html: `<div style="font-size: 40px; animation: bounce 1s infinite; filter: drop-shadow(0 0 12px rgba(239,68,68,1));">🐲</div>`,
                iconSize: [40, 40], iconAnchor: [20, 20]
            });
            const bossMarker = L.marker([bossData.lat, bossData.lng], { icon: bossIcon }).addTo(map);
            bossMarker.on('click', () => {
                if (confirm('🔥 Phát hiện BOSS THẾ GIỚI! Bạn có muốn nghênh chiến?')) {
                    startCanvasBattle(null, true, null, 'boss');
                }
            });
            activeMarkers.push(bossMarker);

            // Thú hoang dã
            for (let i = 0; i < 6; i++) {
                const baseTemplate = allMonsters[Math.floor(Math.random() * allMonsters.length)];
                const randomElem = elements[Math.floor(Math.random() * elements.length)];
                const monsterData = { 
                    ...baseTemplate, 
                    element: randomElem.name,
                    cp: Math.floor(baseTemplate.cp * (0.9 + Math.random() * 0.3)),
                    critRate: Math.floor(1 + Math.random() * 34),
                    dodgeRate: Math.floor(1 + Math.random() * 34),
                    accuracy: Math.floor(1 + Math.random() * 34),
                    attackSpeed: parseFloat((1.0 + Math.random() * 1.0).toFixed(1)),
                    lat: userLat + (Math.random() - 0.5) * 0.0025,
                    lng: userLng + (Math.random() - 0.5) * 0.0025
                };

                const monsterIcon = L.divIcon({
                    className: 'custom-monster-icon',
                    html: `<div style="font-size: 32px; animation: bounce 1.5s infinite; filter: drop-shadow(0 0 8px rgba(234,179,8,0.9));">${monsterData.emoji}</div>`,
                    iconSize: [35, 35], iconAnchor: [17, 17]
                });

                const marker = L.marker([monsterData.lat, monsterData.lng], { icon: monsterIcon }).addTo(map);
                marker.on('click', () => {
                    if (stamina <= 0) { alert('⚡ Hết Năng Lượng!'); return; }
                    currentWildMonster = monsterData;
                    catchAttempts = 0;
                    document.getElementById('throw-attempt-count').innerText = `Lượt quăng: 0/3`;
                    enterARScreen();
                });
                activeMarkers.push(marker);
            }

            spawnGhostPlayers();
        }

        let canvas, ctx;
        let isARActive = false;
        let rope = { x: 0, y: 0, vx: 0, vy: 0, radius: 30, flying: false };
        let monsterPos = { x: 0, y: 0, vx: 2 };
        let touchStart = { x: 0, y: 0 }, touchEnd = { x: 0, y: 0 };

        async function enterARScreen() {
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('ar-screen').classList.remove('hidden');
            isARActive = true;

            let elemObj = elements.find(e => e.name === currentWildMonster.element) || elements[0];
            document.getElementById('ar-mon-info').innerText = `${currentWildMonster.emoji} ${currentWildMonster.name} (${elemObj.icon}${currentWildMonster.element}) - CP ${currentWildMonster.cp}`;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false });
                document.getElementById('camera-feed').srcObject = stream;
            } catch (e) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    document.getElementById('camera-feed').srcObject = stream;
                } catch (err) {}
            }
            initCanvasGame();
        }

        function exitARScreen() {
            isARActive = false;
            const videoEl = document.getElementById('camera-feed');
            if (videoEl.srcObject) videoEl.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('ar-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if(map) map.invalidateSize();
        }

        function initCanvasGame() {
            canvas = document.getElementById('gameCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            monsterPos.x = canvas.width / 2;
            monsterPos.y = canvas.height * 0.35;
            resetRope();

            canvas.onpointerdown = (e) => {
                if (rope.flying) return;
                touchStart.x = e.clientX; touchStart.y = e.clientY;
            };

            canvas.onpointerup = (e) => {
                if (rope.flying) return;
                touchEnd.x = e.clientX; touchEnd.y = e.clientY;
                let dx = touchEnd.x - touchStart.x;
                let dy = touchEnd.y - touchStart.y;

                if (dy < -30) {
                    if (stamina > 0) {
                        stamina--;
                        localStorage.setItem('ar_stamina', stamina);
                        document.getElementById('stamina-count').innerText = stamina;
                    }
                    rope.vx = dx * 0.12;
                    rope.vy = dy * 0.15;
                    rope.flying = true;
                }
            };
            requestAnimationFrame(updateCanvasGame);
        }

        function resetRope() {
            rope.x = canvas.width / 2; rope.y = canvas.height * 0.85;
            rope.vx = 0; rope.vy = 0; rope.flying = false;
        }

        function updateCanvasGame() {
            if (!isARActive || !ctx || !canvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            monsterPos.x += monsterPos.vx;
            if (monsterPos.x < 60 || monsterPos.x > canvas.width - 60) monsterPos.vx *= -1;

            ctx.font = "80px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(currentWildMonster.emoji, monsterPos.x, monsterPos.y);

            if (rope.flying) {
                rope.x += rope.vx; rope.y += rope.vy; rope.vy += 0.25;
                ctx.beginPath(); ctx.moveTo(canvas.width / 2, canvas.height * 0.85); ctx.lineTo(rope.x, rope.y);
                ctx.strokeStyle = "#d4a373"; ctx.lineWidth = 4; ctx.stroke();

                let dist = Math.hypot(rope.x - monsterPos.x, rope.y - monsterPos.y);
                if (dist < 65) { rope.flying = false; handleCatchResult(); }
                if (rope.y < 0 || rope.x < 0 || rope.x > canvas.width) { rope.flying = false; handleMissAttempt("Quăng hụt!"); resetRope(); }
            }

            ctx.font = "40px sans-serif";
            ctx.fillText("🪢", rope.x, rope.y);
            requestAnimationFrame(updateCanvasGame);
        }

        function handleCatchResult() {
            let isFailed = Math.random() < 0.50;
            if (isFailed) { handleMissAttempt(`${currentWildMonster.name} giãy giụa thoát!`); resetRope(); }
            else {
                const feedback = document.getElementById('throw-feedback');
                feedback.innerText = `🎉 Bắt thành công ${currentWildMonster.name}!`;
                feedback.style.opacity = '1';
                setTimeout(() => { feedback.style.opacity = '0'; exitARScreen(); promptCatchChoice(currentWildMonster); }, 1000);
            }
        }

        function handleMissAttempt(reasonMsg) {
            catchAttempts++;
            document.getElementById('throw-attempt-count').innerText = `Lượt quăng: ${catchAttempts}/3`;
            const feedback = document.getElementById('throw-feedback');

            if (catchAttempts >= 3) {
                feedback.innerText = `😜 ${currentWildMonster.name} đã chạy mất!`;
                feedback.style.opacity = '1';
                setTimeout(() => { feedback.style.opacity = '0'; exitARScreen(); spawnMultipleMonsters(); }, 2500);
            } else {
                feedback.innerText = `💥 ${reasonMsg}`;
                feedback.style.opacity = '1';
                setTimeout(() => { feedback.style.opacity = '0'; }, 2000);
            }
        }

        function updateTeamCount() { document.getElementById('team-count').innerText = team.length; }

        function openPokedexMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">📖 Sổ Tay Phân Loại</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div>`;
            html += `<div class="space-y-4">`;
            for (let [catName, list] of Object.entries(categories)) {
                html += `<div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700"><div class="text-yellow-400 font-bold text-sm mb-2">📁 ${catName}</div><div class="grid grid-cols-4 gap-2">`;
                list.forEach(m => {
                    const caught = pokedex.includes(m.id);
                    html += `<div class="bg-zinc-900 p-2 rounded-lg flex flex-col items-center border ${caught ? 'border-emerald-500/60' : 'border-zinc-800 opacity-40'}"><span class="text-3xl mb-1">${caught ? m.emoji : '❓'}</span><div class="text-[10px] text-center font-bold truncate w-full">${m.name}</div></div>`;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
            content.innerHTML = html;
        }

        window.onload = () => {
            checkPlayerProfile();
            initWeather();
            initMap();
            initStaminaSystem();
            updateTeamCount();
        };
    </script>
</body>
</html>
