<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bắt Thú GPS - Web Game</title>
    
    <!-- Thư viện bản đồ Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Giao diện tùy chỉnh của game -->
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; background: #111; color: #fff; }
        
        /* Bản đồ hiển thị toàn màn hình */
        #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Thanh điều hướng / Menu nổi phía trên */
        .hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .hud-top > * { pointer-events: auto; }
        .hud-card { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; font-size: 14px; border: 1px solid #444; }

        /* Thanh Menu công cụ phía dưới */
        .hud-bottom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 30px; border: 1px solid #555;
        }
        .hud-btn {
            background: #ff9800; border: none; padding: 10px 15px; color: white; font-weight: bold;
            border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .hud-btn:active { transform: scale(0.95); background: #f57c00; }

        /* Màn hình phụ (Ẩn/Hiện bằng JS) */
        .game-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; padding: 20px; overflow-y: auto;
        }
        .close-screen-btn {
            background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 5px; float: right; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Khung hiển thị Bản đồ GPS -->
    <div id="map"></div>

    <!-- Giao diện hiển thị thông tin nhanh (HUD) -->
    <div class="hud-top">
        <div class="hud-card" id="playerStatus">Đang định vị GPS...</div>
        <div class="hud-card" id="staminaDisplay">Thể lực: 100/100</div>
    </div>

    <!-- Thanh menu chuyển đổi các tính năng -->
    <div class="hud-bottom">
        <button class="hud-btn" onclick="openScreen('teamScreen')">Đội Hình</button>
        <button class="hud-btn" onclick="openScreen('farmScreen')">Trang Trại</button>
        <button class="hud-btn" onclick="openScreen('marketScreen')">Chợ</button>
        <button class="hud-btn" onclick="openScreen('eggScreen')">Trứng</button>
        <button class="hud-btn" onclick="openScreen('arenaScreen')">Đấu Trường</button>
    </div>

    <!-- CÁC MÀN HÌNH TÍNH NĂNG PHỤ -->
    <div id="teamScreen" class="game-screen">
        <button class="close-screen-btn" onclick="closeScreen('teamScreen')">Đóng</button>
        <h2>Đội Hình Thú Cưng</h2>
        <div id="teamContainer"></div>
    </div>

    <div id="farmScreen" class="game-screen">
        <button class="close-screen-btn" onclick="closeScreen('farmScreen')">Đóng</button>
        <h2>Trang Trại Nuôi Thú</h2>
        <div id="farmContainer"></div>
    </div>

    <div id="marketScreen" class="game-screen">
        <button class="close-screen-btn" onclick="closeScreen('marketScreen')">Đóng</button>
        <h2>Chợ Trao Đổi</h2>
        <div id="marketContainer"></div>
    </div>

    <div id="eggScreen" class="game-screen">
        <button class="close-screen-btn" onclick="closeScreen('eggScreen')">Đóng</button>
        <h2>Ấp Trứng & Bước Chân</h2>
        <div id="eggContainer"></div>
    </div>

    <div id="arenaScreen" class="game-screen">
        <button class="close-screen-btn" onclick="closeScreen('arenaScreen')">Đóng</button>
        <h2>Đấu Trường 1v1</h2>
        <div id="arenaContainer"></div>
    </div>

    <!-- Màn hình Minigame AR Bắt Thú -->
    <div id="arCatchScreen" class="game-screen" style="text-align: center;">
        <button class="close-screen-btn" onclick="closeScreen('arCatchScreen')">Chạy Trốn</button>
        <h2>Bắt Linh Thú</h2>
        <canvas id="arCanvas" width="360" height="500" style="background:#555; border-radius:10px; margin-top:15px;"></canvas>
    </div>


    <!-- ================= NHÚNG CÁC FILE JAVASCRIPT ================= -->
    <!-- 1. Thư viện Leaflet Bản đồ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 2. File cấu hình chung -->
    <script src="js/config.js"></script>

    <!-- 3. Các module tính năng (Thứ tự gọi linh hoạt theo hệ thống) -->
    <script src="js/stamina.js"></script>
    <script src="js/eggs.js"></script>
    <script src="js/team.js"></script>
    <script src="js/farm.js"></script>
    <script src="js/market.js"></script>
    <script src="js/arena.js"></script>
    <script src="js/ar_catch.js"></script>

    <!-- 4. File điều phối bản đồ và logic trung tâm (Chạy cuối cùng để kết nối tất cả) -->
    <script src="js/map.js"></script>

    <!-- Đăng ký Service Worker để hỗ trợ chạy PWA ngoại tuyến -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker đã đăng ký thành công!"))
            .catch((err) => console.log("Đăng ký Service Worker thất bại:", err));
        }

        // Hàm tiện ích chuyển đổi qua lại giữa các màn hình giao diện phụ
        function openScreen(screenId) {
            document.getElementById(screenId).style.display = 'block';
        }
        function closeScreen(screenId) {
            document.getElementById(screenId).style.display = 'none';
        }
    </script>
</body>
</html>
