<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Monster - Full Complete Edition v3.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        #map { height: 100%; width: 100%; border-radius: 1rem; z-index: 10; }
        .leaflet-control-attribution { display: none !important; }
        @keyframes petBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .pet-animate { animation: petBounce 2s ease-in-out infinite; }
        @keyframes floatText { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }
        .damage-popup { animation: floatText 0.7s ease-out forwards; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- MÀN HÌNH NHẬP THÔNG TIN CÁ NHÂN LẦN ĐẦU -->
    <div id="player-setup-modal" class="hidden absolute inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-amber-500/50 w-full max-w-sm rounded-2xl p-5 text-zinc-100 shadow-2xl">
            <h3 class="font-bold text-lg text-yellow-300 mb-3 text-center">🤠 Hồ Sơ Nhà Thám Hiểm</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Chọn Avatar:</label>
                    <div class="flex justify-around py-1 bg-zinc-800 rounded-xl border border-zinc-700">
                        <label class="cursor-pointer text-2xl"><input type="radio" name="setup-avatar" value="🤠" checked class="accent-amber-500"> 🤠</label>
                        <label class="cursor-pointer text-2xl"><input type="radio" name="setup-avatar" value="🧑‍🎤" class="accent-amber-500"> 🧑‍🎤</label>
                        <label class="cursor-pointer text-2xl"><input type="radio" name="setup-avatar" value="🥷" class="accent-amber-500"> 🥷</label>
                        <label class="cursor-pointer text-2xl"><input type="radio" name="setup-avatar" value="🧙‍♂️" class="accent-amber-500"> 🧙‍♂️</label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Tên nhân vật:</label>
                    <input type="text" id="setup-name" placeholder="Nhập tên của bạn..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Tuổi:</label>
                    <input type="number" id="setup-age" placeholder="Ví dụ: 20" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>
            <button onclick="savePlayerProfile()" class="w-full mt-5 bg-amber-600 hover:bg-amber-500 py-3 rounded-xl font-bold text-xs shadow-lg text-white cursor-pointer">
                💾 Xác Nhận & Vào Game
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH BẢN ĐỒ GPS & TIỆN ÍCH -->
    <div id="map-screen" class="absolute inset-0 z-20 flex flex-col justify-between bg-zinc-950 p-2">
        <div class="flex flex-col gap-1.5 z-30 pt-1">
            <div class="flex justify-between items-center bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-white/20">
                <div onclick="openPlayerProfileModal()" class="flex items-center gap-2 cursor-pointer">
                    <div id="header-avatar" class="text-2xl bg-zinc-800 p-1 rounded-xl border border-amber-500/50">🤠</div>
                    <div>
                        <div class="flex items-center gap-1">
                            <span id="header-name" class="font-bold text-xs text-yellow-300">Nhà Thám Hiểm</span>
                            <span class="bg-amber-600 text-[9px] px-1 rounded font-bold text-white">Lv.<span id="header-level">1</span></span>
                        </div>
                        <div id="header-title" class="text-[9px] text-amber-200 font-medium">🌟 Tân Thủ Tập Sự</div>
                        <div class="w-24 bg-zinc-900 rounded-full h-1 mt-0.5 overflow-hidden border border-zinc-700">
                            <div id="header-exp-bar" class="bg-emerald-500 h-full transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="bg-zinc-900/90 px-2 py-0.5 rounded-full border border-white/10 flex items-center gap-1 text-[11px]">
                    <span id="weather-icon">☀️</span>
                    <span id="weather-status" class="font-medium">Trời quang</span>
                </div>
            </div>

            <!-- THANH MENU ĐIỀU HƯỚNG CUỘN NGANG -->
            <div class="flex gap-1 overflow-x-auto py-1 px-1">
                <button onclick="openMarketMenu()" class="bg-amber-600/90 px-3 py-1 rounded-full border border-amber-400 text-[11px] font-bold shadow shrink-0 cursor-pointer">🛒 Chợ</button>
                <button onclick="openArenaMenu()" class="bg-red-600/90 px-3 py-1 rounded-full border border-red-400 text-[11px] font-bold shadow shrink-0 cursor-pointer">⚔️ PvP</button>
                <button onclick="openFarmMenu()" class="bg-emerald-600/90 px-3 py-1 rounded-full border border-emerald-400 text-[11px] font-bold shadow shrink-0 cursor-pointer">🏡 Trại</button>
                <button onclick="openTeamMenu()" class="bg-zinc-800 px-3 py-1 rounded-full border border-zinc-600 text-[11px] font-bold shrink-0 cursor-pointer">🎒 Đội(<span id="team-count">0</span>/3)</button>
                <button onclick="openEggsMenu()" class="bg-zinc-800 px-3 py-1 rounded-full border border-zinc-600 text-[11px] font-bold shrink-0 cursor-pointer">🥚 Trứng</button>
                <button onclick="openPokedexMenu()" class="bg-zinc-800 px-3 py-1 rounded-full border border-zinc-600 text-[11px] font-bold shrink-0 cursor-pointer">📖 Sổ tay</button>
            </div>
        </div>

        <div class="absolute inset-0 pt-24 pb-20 px-2">
            <div id="map" class="shadow-2xl border border-zinc-800"></div>
            <button onclick="forceGetGPSLocation()" class="absolute bottom-24 right-5 z-30 bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-full shadow-2xl border border-blue-400 active:scale-95 transition-transform flex items-center justify-center text-lg cursor-pointer" title="Cập nhật vị trí GPS thực tế">
                🛰️
            </button>
        </div>

        <div class="flex flex-col items-center z-30 pb-2">
            <button onclick="spawnMultipleMonsters()" class="w-full max-w-sm bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2.5 rounded-2xl border border-zinc-700 shadow-xl transition-all text-xs cursor-pointer">
                🔄 Quét tìm thú (10s/lần)
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH AR CATCH TƯƠNG TÁC -->
    <div id="ar-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-900">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        </div>
        <canvas id="gameCanvas" class="absolute inset-0 z-10 touch-none"></canvas>
        <div class="flex justify-between items-center z-20 p-4 pointer-events-auto">
            <button onclick="exitARScreen()" class="bg-black/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">
                ⬅️ Quay lại bản đồ
            </button>
            <div id="ar-mon-info" class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-yellow-300">
                Mục tiêu: Đang tải...
            </div>
        </div>
        <div class="flex flex-col items-center z-20 pb-8 pointer-events-none">
            <div class="text-sm font-bold bg-black/80 px-4 py-2 rounded-full border border-white/20 shadow-lg text-amber-300">Vuốt hoặc chạm màn hình để quăng vòng bắt thú!</div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẤU TRƯỜNG PVP -->
    <div id="battle-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-950 p-4">
        <div class="flex justify-between items-center z-20">
            <div class="bg-red-600/90 px-4 py-1.5 rounded-full font-bold text-xs border border-red-400">⚔️ ĐẤU TRƯỜNG PVP</div>
            <button onclick="exitBattleScreen()" class="bg-black/80 px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">Rút lui</button>
        </div>
        <div class="relative flex-1 my-4 bg-gradient-to-b from-amber-950/80 via-zinc-900 to-zinc-950 rounded-2xl border-2 border-amber-500/60 overflow-hidden flex flex-col items-center justify-center shadow-2xl">
            <canvas id="battleCanvas" class="absolute inset-0 w-full h-full"></canvas>
            <div id="battle-log" class="absolute bottom-4 bg-black/90 px-5 py-2.5 rounded-xl text-xs text-yellow-300 font-bold border border-yellow-500/50 text-center max-w-sm shadow-xl">
                Đang giao tranh kịch tính...
            </div>
        </div>
    </div>

    <!-- MODAL CHUNG -->
    <div id="modal-container" class="hidden absolute inset-0 z-40 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let farm = JSON.parse(localStorage.getItem('ar_farm') || '[]');
        let pokedex = JSON.parse(localStorage.getItem('ar_pokedex') || '[]');
        let eggSteps = parseInt(localStorage.getItem('ar_egg_steps') || '0');
        let playerCoins = parseInt(localStorage.getItem('ar_coins') || '500');
        
        let inventory = JSON.parse(localStorage.getItem('ar_inventory') || JSON.stringify({ 
            food: 5, toy: 5, trainer: 3, 
            stoneKim: 1, stoneMoc: 1, stoneThuy: 1, stoneHoa: 1, stoneTho: 1 
        }));
        
        let playerProfile = JSON.parse(localStorage.getItem('ar_player_profile') || JSON.stringify({
            name: 'Nhà Thám Hiểm', age: 20, gender: 'Nam', avatar: '🤠', level: 1, exp: 0, maxExp: 100, title: '🌟 Tân Thủ Tập Sự'
        }));

        function savePlayerProfileData() {
            localStorage.setItem('ar_player_profile', JSON.stringify(playerProfile));
            updateHeaderProfileUI();
        }

        function updateHeaderProfileUI() {
            document.getElementById('header-name').innerText = playerProfile.name;
            document.getElementById('header-avatar').innerText = playerProfile.avatar;
            document.getElementById('header-level').innerText = playerProfile.level;
            document.getElementById('header-title').innerText = playerProfile.title;
            let expPercent = Math.min(100, (playerProfile.exp / playerProfile.maxExp) * 100);
            document.getElementById('header-exp-bar').style.width = expPercent + '%';
        }

        function checkPlayerProfile() {
            if (!localStorage.getItem('ar_player_profile')) {
                document.getElementById('player-setup-modal').classList.remove('hidden');
            } else {
                updateHeaderProfileUI();
            }
        }

        function savePlayerProfile() {
            let name = document.getElementById('setup-name').value.trim();
            let age = document.getElementById('setup-age').value.trim();
            if (!name) { alert('Vui lòng nhập tên nhân vật!'); return; }
            playerProfile.name = name;
            playerProfile.age = age;
            savePlayerProfileData();
            document.getElementById('player-setup-modal').classList.add('hidden');
        }

        function openPlayerProfileModal() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-yellow-300">👤 Hồ Sơ Nhân Vật</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div>
            <div class="bg-zinc-800 p-4 rounded-2xl text-center">
                <div class="text-5xl mb-2">${playerProfile.avatar}</div>
                <div class="text-base font-bold">${playerProfile.name} (Lv.${playerProfile.level})</div>
                <div class="text-xs text-amber-300 mt-1">${playerProfile.title}</div>
                <div class="text-xs text-zinc-300 mt-3">Vàng: ${playerCoins} 🪙 | Tổng thú: ${team.length + farm.length} con</div>
            </div>`;
        }

        function closeModal() {
            if (window.farmAnimInterval) clearInterval(window.farmAnimInterval);
            document.getElementById('modal-container').classList.add('hidden');
        }

        function updateTeamCount() { document.getElementById('team-count').innerText = team.length; }

        const elements = [
            { name: 'Kim', icon: '⚔️', color: 'text-yellow-300' },
            { name: 'Mộc', icon: '🌿', color: 'text-emerald-400' },
            { name: 'Thủy', icon: '💧', color: 'text-blue-400' },
            { name: 'Hỏa', icon: '🔥', color: 'text-red-500' },
            { name: 'Thổ', icon: '🪨', color: 'text-amber-600' }
        ];

        const allMonsters = [
            { id: 101, name: 'Gà Ta', emoji: '🐔', rarity: 'Trắng', color: 'text-zinc-300', cp: 120, hp: 60, maxHp: 60, atk: 70, rarePrice: 100 },
            { id: 102, name: 'Vịt Cỏ', emoji: '🦆', rarity: 'Trắng', color: 'text-zinc-300', cp: 110, hp: 55, maxHp: 55, atk: 65, rarePrice: 90 },
            { id: 201, name: 'Ngỗng Trắng', emoji: '🦢', rarity: 'Xanh', color: 'text-blue-400', cp: 140, hp: 80, maxHp: 80, atk: 85, rarePrice: 130 },
            { id: 202, name: 'Bò Sữa Chiến', emoji: '🐂', rarity: 'Xanh', color: 'text-blue-400', cp: 180, hp: 120, maxHp: 120, atk: 110, rarePrice: 200 },
            { id: 301, name: 'Chim Lửa Thần', emoji: '🐦', rarity: 'Vàng', color: 'text-yellow-400', cp: 210, hp: 85, maxHp: 85, atk: 155, rarePrice: 350 },
            { id: 401, name: 'Rồng Nước Thiêng', emoji: '🐉', rarity: 'Đỏ', color: 'text-red-500', cp: 290, hp: 160, maxHp: 160, atk: 190, rarePrice: 700 },
            { id: 501, name: 'Cửu Trảo Kim Long', emoji: '🐉', rarity: 'Tím', color: 'text-purple-400', cp: 380, hp: 220, maxHp: 220, atk: 250, rarePrice: 1500 }
        ];

        const categories = {
            '⚪ Thường (Trắng)': allMonsters.filter(m => m.rarity === 'Trắng'),
            '🟢 Hiếm (Xanh)': allMonsters.filter(m => m.rarity === 'Xanh'),
            '🟡 Cực Hiếm (Vàng)': allMonsters.filter(m => m.rarity === 'Vàng'),
            '🔴 Huyền Thoại (Đỏ)': allMonsters.filter(m => m.rarity === 'Đỏ'),
            '🟣 Thần Thoại (Tím)': allMonsters.filter(m => m.rarity === 'Tím')
        };

        function saveInventory() { localStorage.setItem('ar_inventory', JSON.stringify(inventory)); }

        // --- 🛒 CHỢ ĐN ĐẦY ĐỦ ---
        function openMarketMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-amber-400">🛒 Chợ Đen & Dụng Cụ</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div>
            <div class="text-xs text-yellow-400 font-bold mb-3">💰 Vàng hiện có: ${playerCoins} 🪙</div>
            <div class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div><div class="font-bold text-xs">🍖 Thức Ăn (50🪙)</div><div class="text-[10px] text-zinc-400">Kho: ${inventory.food}</div></div>
                    <button onclick="buyItem('food', 50)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div><div class="font-bold text-xs">🎾 Đồ Chơi (50🪙)</div><div class="text-[10px] text-zinc-400">Kho: ${inventory.toy}</div></div>
                    <button onclick="buyItem('toy', 50)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div><div class="font-bold text-xs">🏋️ Dụng Cụ Tập (100🪙)</div><div class="text-[10px] text-zinc-400">Kho: ${inventory.trainer}</div></div>
                    <button onclick="buyItem('trainer', 100)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-amber-500/40">
                    <div><div class="font-bold text-xs text-yellow-300">💎 Đá Kim (200🪙)</div><div class="text-[10px] text-zinc-400">Kho: ${inventory.stoneKim}</div></div>
                    <button onclick="buyItem('stoneKim', 200)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-emerald-500/40">
                    <div><div class="font-bold text-xs text-emerald-300">🌿 Đá Mộc (200🪙)</div><div class="text-[10px] text-zinc-400">Kho: ${inventory.stoneMoc}</div></div>
                    <button onclick="buyItem('stoneMoc', 200)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
            </div>`;
        }

        function buyItem(type, price) {
            if (playerCoins < price) { alert('Bạn không đủ vàng!'); return; }
            playerCoins -= price;
            localStorage.setItem('ar_coins', playerCoins);
            inventory[type] = (inventory[type] || 0) + 1;
            saveInventory();
            alert('Mua thành công!');
            openMarketMenu();
        }

        // --- 🏡 TRANG TRẠI 3D CANVAS SINH ĐỘNG ---
        function openFarmMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-sm text-emerald-400">🏡 Trang Trại Linh Thú (${farm.length})</h3>
                <button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button>
            </div>
            <div class="relative w-full h-44 bg-gradient-to-b from-emerald-900 to-emerald-950 rounded-xl border border-emerald-600 overflow-hidden mb-3">
                <canvas id="farmCanvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>
            <div class="space-y-2 max-h-40 overflow-y-auto">`;

            if (farm.length === 0) {
                html += `<div class="text-zinc-400 text-xs text-center py-4">Trang trại trống!</div>`;
            } else {
                farm.forEach((pet, idx) => {
                    let elemObj = elements.find(e => e.name === pet.element) || elements[0];
                    html += `
                    <div class="bg-zinc-800 p-2 rounded-xl flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">${pet.emoji}</span>
                            <div>
                                <div class="font-bold">${pet.name} <span class="${elemObj.color}">(${elemObj.icon}${pet.element || 'Kim'})</span></div>
                                <div class="text-[10px] text-zinc-300">HP: ${pet.hp}/${pet.maxHp}</div>
                            </div>
                        </div>
                        <button onclick="moveToTeam(${idx})" class="bg-blue-600 px-2 py-1 rounded font-bold text-[10px] cursor-pointer">Đưa đội</button>
                    </div>`;
                });
            }
            html += `</div>`;
            content.innerHTML = html;
            setTimeout(initFarmCanvasAnimation, 100);
        }

        function initFarmCanvasAnimation() {
            let canvas = document.getElementById('farmCanvas');
            if (!canvas) return;
            let ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            let petsState = farm.map(p => ({
                ...p,
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.0,
                wobble: Math.random() * Math.PI
            }));

            if (window.farmAnimInterval) clearInterval(window.farmAnimInterval);
            window.farmAnimInterval = setInterval(() => {
                if (!ctx || !canvas) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#064e3b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                petsState.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.wobble += 0.1;
                    if (p.x < 20 || p.x > canvas.width - 20) p.vx *= -1;
                    if (p.y < 20 || p.y > canvas.height - 20) p.vy *= -1;
                    let bY = p.y + Math.sin(p.wobble) * 3;
                    ctx.font = "30px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(p.emoji, p.x, bY);
                });
            }, 50);
        }

        function moveToTeam(idx) {
            if (team.length >= 3) { alert('Đội hình tối đa 3 con!'); return; }
            team.push(farm.splice(idx, 1)[0]);
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            localStorage.setItem('ar_team', JSON.stringify(team));
            updateTeamCount();
            openFarmMenu();
        }

        // --- 🎒 ĐỘI HÌNH & THUỘC TÍNH CHI TIẾT ---
        function openTeamMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-blue-400">🎒 Đội Hình Chiến Đấu (${team.length}/3)</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div><div class="space-y-2.5 max-h-64 overflow-y-auto">`;
            
            if (team.length === 0) {
                html += `<div class="text-zinc-400 text-xs text-center py-6">Đội hình trống!</div>`;
            } else {
                team.forEach((pet, idx) => {
                    let elemObj = elements.find(e => e.name === pet.element) || elements[0];
                    html += `
                    <div onclick="openPetDetail(${idx})" class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-zinc-700 cursor-pointer text-xs">
                        <div class="flex items-center gap-2.5">
                            <span class="text-3xl pet-animate">${pet.emoji}</span>
                            <div>
                                <div class="font-bold">${pet.name} <span class="text-yellow-400">Lv.${pet.level || 1}</span> <span class="${elemObj.color}">(${elemObj.icon}${pet.element || 'Kim'})</span></div>
                                <div class="text-[10px] text-zinc-300">HP: ${pet.hp}/${pet.maxHp} | CP: ${pet.cp}</div>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); removeToFarm(${idx})" class="bg-amber-700 px-2 py-1 rounded font-bold text-[10px]">Về trại</button>
                    </div>`;
                });
            }
            content.innerHTML = html + `</div>`;
        }

        function openPetDetail(idx) {
            let pet = team[idx];
            let elemObj = elements.find(e => e.name === pet.element) || elements[0];
            const content = document.getElementById('modal-content');
            content.innerHTML = `
            <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-yellow-300">🐾 Thuộc Tính Thú Cưng</h3><button onclick="openTeamMenu()" class="text-zinc-400 font-bold cursor-pointer">‹ Quay lại</button></div>
            <div class="bg-zinc-800 p-4 rounded-2xl text-center">
                <div class="text-6xl mb-2 pet-animate">${pet.emoji}</div>
                <div class="text-sm font-bold">${pet.name} <span class="${elemObj.color}">(${elemObj.icon}${pet.element || 'Kim'})</span></div>
                <div class="text-xs text-amber-300 mt-1">Độ hiếm: ${pet.rarity} | CP: ${pet.cp}</div>
                <div class="mt-3 text-left text-xs bg-zinc-900 p-2.5 rounded-xl space-y-1">
                    <div>HP: ${pet.hp} / ${pet.maxHp}</div>
                    <div>Tấn công: ${pet.atk || 70}</div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-3">
                <button onclick="feedPet(${idx})" class="bg-emerald-600 py-2 rounded-xl font-bold text-xs">🍖 Cho ăn (${inventory.food})</button>
                <button onclick="playPet(${idx})" class="bg-amber-600 py-2 rounded-xl font-bold text-xs">🎾 Chơi (${inventory.toy})</button>
            </div>`;
        }

        function feedPet(idx) {
            if (inventory.food <= 0) { alert('Hết thức ăn!'); return; }
            inventory.food--; saveInventory();
            team[idx].hp = Math.min(team[idx].maxHp, team[idx].hp + 20);
            localStorage.setItem('ar_team', JSON.stringify(team));
            alert('Đã phục hồi HP cho thú!'); openPetDetail(idx);
        }

        function playPet(idx) {
            if (inventory.toy <= 0) { alert('Hết đồ chơi!'); return; }
            inventory.toy--; saveInventory();
            alert('Thú cưng rất vui vẻ!'); openPetDetail(idx);
        }

        function removeToFarm(idx) {
            farm.push(team.splice(idx, 1)[0]);
            localStorage.setItem('ar_team', JSON.stringify(team));
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            updateTeamCount(); openTeamMenu();
        }

        // --- 📖 SỔ TAY POKEDEX ---
        function openPokedexMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-yellow-300">📖 Sổ Tay Pokedex</h3><button onclick="closeModal()" class="text-zinc-400 font-bold cursor-pointer">✕</button></div><div class="space-y-3 max-h-64 overflow-y-auto">`;
            for (let [cat, list] of Object.entries(categories)) {
                html += `<div class="bg-zinc-800 p-2 rounded-xl"><div class="text-yellow-400 font-bold text-xs mb-1">${cat}</div><div class="grid grid-cols-4 gap-1.5">`;
                list.forEach(m => {
                    let caught = pokedex.includes(m.id);
                    html += `<div class="bg-zinc-900 p-1.5 rounded flex flex-col items-center border ${caught ? 'border-emerald-500' : 'border-zinc-800 opacity-40'}"><span class="text-2xl">${caught ? m.emoji : '❓'}</span><span class="text-[9px] truncate w-full text-center">${m.name}</span></div>`;
                });
                html += `</div></div>`;
            }
            content.innerHTML = html + `</div>`;
        }

        function openEggsMenu() { alert(`🥚 Đang ấp trứng. Tiến độ: ${eggSteps} bước.`); }
        function openArenaMenu() { alert('⚔️ Đấu trường PvP sẵn sàng giao tranh!'); }

        // --- 🎯 BẢN ĐỒ & AR CATCH ---
        let map, userMarker;
        let activeMarkers = [];
        let userLat = 10.0452, userLng = 105.7469; 
        let currentWildMonster = null;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            userMarker = L.marker([userLat, userLng], {
                icon: L.divIcon({ className: 'custom-user-icon', html: '<div style="font-size: 26px;">📍</div>', iconSize: [30, 30], iconAnchor: [15, 15] })
            }).addTo(map);

            forceGetGPSLocation();
            spawnMultipleMonsters();
        }

        function forceGetGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    map.setView([userLat, userLng], 17);
                    userMarker.setLatLng([userLat, userLng]);
                }, (err) => {}, { enableHighAccuracy: true });
            }
        }

        function spawnMultipleMonsters() {
            if (!map) return;
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            let foundCount = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < foundCount; i++) {
                let chosenRarity = rollMonsterRarity();
                let filtered = allMonsters.filter(m => m.rarity === chosenRarity);
                if (filtered.length === 0) filtered = allMonsters;

                let baseTemplate = filtered[Math.floor(Math.random() * filtered.length)];
                let randomElem = elements[Math.floor(Math.random() * elements.length)];
                
                let monsterData = { 
                    ...baseTemplate, 
                    element: randomElem.name,
                    lat: userLat + (Math.random() - 0.5) * 0.002,
                    lng: userLng + (Math.random() - 0.5) * 0.002
                };

                let marker = L.marker([monsterData.lat, monsterData.lng], {
                    icon: L.divIcon({ className: 'custom-monster-icon', html: `<div style="font-size: 28px;" class="pet-animate">${monsterData.emoji}</div>`, iconSize: [35, 35], iconAnchor: [17, 17] })
                }).addTo(map);

                marker.on('click', () => {
                    currentWildMonster = monsterData;
                    enterARScreen(monsterData);
                });
                activeMarkers.push(marker);
            }
            alert(`🔄 Quét radar tìm thấy ${foundCount} linh thú quanh đây!`);
        }

        function enterARScreen(monster) {
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('ar-screen').classList.remove('hidden');
            document.getElementById('ar-mon-info').innerText = `Mục tiêu: ${monster.name} (${monster.rarity})`;

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => { document.getElementById('camera-feed').srcObject = stream; })
                .catch(e => {});
            }

            document.getElementById('ar-screen').onclick = () => {
                let caught = Math.random() < 0.85;
                if (caught) {
                    alert(`🎯 Bắt thành công ${monster.name}!`);
                    handleCatchSuccess(monster);
                    exitARScreen();
                } else {
                    alert('❌ Quăng trượt rồi, thử lại!');
                }
            };
        }

        function exitARScreen() {
            let video = document.getElementById('camera-feed');
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            document.getElementById('ar-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if (map) map.invalidateSize();
        }

        function handleCatchSuccess(monster) {
            let newPet = { ...monster, level: 1, hp: monster.maxHp, hunger: 80, happiness: 80 };
            if (team.length < 3) {
                team.push(newPet);
                localStorage.setItem('ar_team', JSON.stringify(team));
                alert(`Đã đưa ${newPet.name} vào Đội hình chiến đấu!`);
            } else {
                farm.push(newPet);
                localStorage.setItem('ar_farm', JSON.stringify(farm));
                alert(`Đội hình đầy (3/3), ${newPet.name} vào Trang Trại!`);
            }
            if (!pokedex.includes(monster.id)) {
                pokedex.push(monster.id);
                localStorage.setItem('ar_pokedex', JSON.stringify(pokedex));
            }
            updateTeamCount();
        }

        window.onload = () => {
            checkPlayerProfile();
            initMap();
            updateTeamCount();
        };
    </script>
</body>
</html>
