<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Monster - Element & Team Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        #map { height: 100%; width: 100%; border-radius: 1rem; z-index: 10; }
        .leaflet-control-attribution { display: none !important; }
        @keyframes petBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .pet-animate { animation: petBounce 2s ease-in-out infinite; }
        @keyframes floatText { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }
        .damage-popup { animation: floatText 0.7s ease-out forwards; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- MÀN HÌNH BẢN ĐỒ GPS & TIỆN ÍCH -->
    <div id="map-screen" class="absolute inset-0 z-20 flex flex-col justify-between bg-zinc-950 p-3">
        <div class="flex justify-between items-center z-30 pt-1">
            <div class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-2">
                <span id="weather-icon" class="text-base">☀️</span>
                <span id="weather-status" class="text-xs font-medium">Trời quang</span>
            </div>
            <div class="flex gap-1 overflow-x-auto py-1">
                <button onclick="openMarketMenu()" class="bg-amber-600/90 px-2.5 py-1 rounded-full border border-amber-400 text-[11px] font-bold shadow">🛒 Chợ</button>
                <button onclick="openArenaMenu()" class="bg-red-600/90 px-2.5 py-1 rounded-full border border-red-400 text-[11px] font-bold shadow">⚔️ Đấu PvP</button>
                <button onclick="openFarmMenu()" class="bg-emerald-600/90 px-2.5 py-1 rounded-full border border-emerald-400 text-[11px] font-bold shadow">🏡 Trại</button>
                <button onclick="openEggsMenu()" class="bg-black/80 px-2.5 py-1 rounded-full border border-white/20 text-[11px] font-bold">🥚(<span id="egg-steps-count">0</span>)</button>
                <button onclick="openTeamMenu()" class="bg-black/80 px-2.5 py-1 rounded-full border border-white/20 text-[11px] font-bold">🎒(<span id="team-count">0</span>/3)</button>
            </div>
        </div>

        <div class="absolute inset-0 pt-16 pb-24 px-3">
            <div id="map" class="shadow-2xl border border-zinc-800"></div>
            <button onclick="recenterMap()" class="absolute bottom-28 right-6 z-30 bg-blue-600 text-white p-3.5 rounded-full shadow-2xl border border-blue-400 active:scale-95 transition-transform flex items-center justify-center text-xl">
                📍
            </button>
        </div>

        <div class="flex flex-col items-center z-30 pb-2">
            <div id="stamina-info" class="text-xs font-bold text-amber-300 bg-black/80 px-4 py-1.5 rounded-full border border-white/20 mb-2 shadow-lg flex items-center gap-2">
                ⚡ Năng lượng: <span id="stamina-count">15</span>/15 (<span id="stamina-timer">10:00</span>)
            </div>
            <button onclick="spawnMultipleMonsters()" class="w-full max-w-sm bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2.5 rounded-2xl border border-zinc-700 shadow-xl text-xs">
                🔄 Quét lại khu vực
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH MINIGAME BẮT THÚ AR -->
    <div id="ar-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-900">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        </div>
        <canvas id="gameCanvas" class="absolute inset-0 z-10 touch-none"></canvas>
        <div class="flex justify-between items-center z-20 p-4 pointer-events-auto">
            <button onclick="exitARScreen()" class="bg-black/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold">
                ⬅️ Quay lại bản đồ
            </button>
            <div id="ar-mon-info" class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-yellow-300">
                Mục tiêu: Đang tải...
            </div>
        </div>
        <div class="flex flex-col items-center z-20 pb-8 pointer-events-none">
            <div id="throw-feedback" class="text-sm font-bold bg-black/80 px-4 py-2 rounded-full border border-white/20 opacity-0 transition-opacity shadow-lg">Bắt hụt rồi!</div>
            <div id="throw-attempt-count" class="text-[11px] text-yellow-400 mt-1 bg-black/60 px-3 py-0.5 rounded-full border border-white/10 font-bold">Lượt quăng: 0/3</div>
            <div class="text-[11px] text-zinc-300 mt-1 bg-black/60 px-3 py-1 rounded-full border border-white/10">🤠 Vuốt ngón tay hướng lên trên để quăng vòng dây thừng!</div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẤU TRƯỜNG PVP -->
    <div id="battle-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-950 p-4">
        <div class="flex justify-between items-center z-20">
            <div id="battle-title-tag" class="bg-red-600/90 px-4 py-1.5 rounded-full font-bold text-xs border border-red-400">⚔️ PVP NGŨ HÀNH</div>
            <button onclick="exitBattleScreen()" class="bg-black/80 px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold">Rút lui</button>
        </div>
        <div class="relative flex-1 my-4 bg-gradient-to-b from-amber-950/80 via-zinc-900 to-zinc-950 rounded-2xl border-2 border-amber-500/60 overflow-hidden flex flex-col items-center justify-center shadow-2xl">
            <canvas id="battleCanvas" class="absolute inset-0 w-full h-full"></canvas>
            <div id="damage-popup-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            <div id="battle-log" class="absolute bottom-4 bg-black/90 px-5 py-2.5 rounded-xl text-xs text-yellow-300 font-bold border border-yellow-500/50 text-center max-w-sm shadow-xl">
                Đang chuẩn bị giao tranh...
            </div>
        </div>
    </div>

    <!-- MODAL CHUNG -->
    <div id="modal-container" class="hidden absolute inset-0 z-40 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Khởi tạo dữ liệu người chơi kèm các chỉ số Ngũ hành, HP, No, Hạnh phúc
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let farm = JSON.parse(localStorage.getItem('ar_farm') || '[]');
        let eggSteps = parseInt(localStorage.getItem('ar_egg_steps') || '0');
        let playerCoins = parseInt(localStorage.getItem('ar_coins') || '500');
        let stamina = parseInt(localStorage.getItem('ar_stamina') || '15');
        let inventory = JSON.parse(localStorage.getItem('ar_inventory') || JSON.stringify({ food: 5, toy: 5, trainer: 3 }));

        const elementsList = [
            { name: 'Kim', icon: '⚔️', color: 'text-yellow-300' },
            { name: 'Mộc', icon: '🌿', color: 'text-emerald-400' },
            { name: 'Thủy', icon: '💧', color: 'text-blue-400' },
            { name: 'Hỏa', icon: '🔥', color: 'text-red-500' },
            { name: 'Thổ', icon: '🪨', color: 'text-amber-600' }
        ];

        // Chuẩn hóa dữ liệu thú cưng có hệ ngũ hành
        function sanitizeTeam() {
            team = team.map(p => ({
                ...p,
                maxHp: p.maxHp || 100,
                hp: p.hp !== undefined ? p.hp : 100,
                atk: p.atk || 50,
                level: p.level || 1,
                hunger: p.hunger !== undefined ? p.hunger : 80,      // Độ no (0-100)
                happiness: p.happiness !== undefined ? p.happiness : 80, // Hạnh phúc (0-100)
                element: p.element || elementsList[Math.floor(Math.random() * elementsList.length)].name
            }));
        }
        sanitizeTeam();

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }
        function updateTeamCount() {
            document.getElementById('team-count').innerText = team.length;
            document.getElementById('egg-steps-count').innerText = eggSteps;
        }

        // --- CHỢ ---
        function openMarketMenu() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = `
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🛒 Chợ Đen</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>
                <div class="text-xs text-yellow-400 font-bold mb-3">💰 Vàng: ${playerCoins} 🪙</div>
                <div class="space-y-3">
                    <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between">
                        <span>🍖 Thức Ăn (50🪙) - Kho: ${inventory.food}</span>
                        <button onclick="buyItem('food', 50)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold">Mua</button>
                    </div>
                    <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between">
                        <span>🎾 Đồ Chơi (50🪙) - Kho: ${inventory.toy}</span>
                        <button onclick="buyItem('toy', 50)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold">Mua</button>
                    </div>
                    <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between">
                        <span>🏋️ Dụng Cụ Tập (100🪙) - Kho: ${inventory.trainer}</span>
                        <button onclick="buyItem('trainer', 100)" class="bg-amber-600 px-3 py-1.5 rounded text-xs font-bold">Mua</button>
                    </div>
                </div>`;
        }
        function buyItem(type, price) {
            if (playerCoins < price) { alert('Không đủ vàng!'); return; }
            playerCoins -= price;
            inventory[type]++;
            localStorage.setItem('ar_coins', playerCoins);
            localStorage.setItem('ar_inventory', JSON.stringify(inventory));
            alert('Mua thành công!');
            openMarketMenu();
        }

        // --- ĐỘI HÌNH & CHI TIẾT THÚ CƯNG ---
        function openTeamMenu() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🎒 Đội Hình Chiến Đấu (${team.length}/3)</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div><div class="space-y-2">`;
            if (team.length === 0) {
                html += `<div class="text-zinc-400 text-xs text-center py-4">Đội hình trống. Hãy vào Trang Trại đưa thú vào đội!</div>`;
            } else {
                team.forEach((p, i) => {
                    let elem = elementsList.find(e => e.name === p.element) || elementsList[0];
                    html += `
                    <div onclick="openPetDetail(${i})" class="bg-zinc-800 p-3 rounded-xl flex justify-between items-center cursor-pointer hover:bg-zinc-700 transition">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${p.emoji}</span>
                            <div>
                                <div class="font-bold text-xs">${p.name} <span class="text-yellow-400">Lv.${p.level}</span> <span class="${elem.color}">(${elem.icon} ${p.element})</span></div>
                                <div class="text-[10px] text-zinc-300">HP: ${p.hp}/${p.maxHp} | No: ${p.hunger}% | Vui: ${p.happiness}%</div>
                            </div>
                        </div>
                        <span class="text-xs text-amber-400 font-bold">Chi tiết ›</span>
                    </div>`;
                });
            }
            html += `</div>`;
            document.getElementById('modal-content').innerHTML = html;
        }

        // Bấm vào từng con thú để xem thuộc tính chi tiết và thực hiện chăm sóc/luyện tập
        function openPetDetail(index) {
            let p = team[index];
            let elem = elementsList.find(e => e.name === p.element) || elementsList[0];
            const content = document.getElementById('modal-content');

            content.innerHTML = `
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-lg">🐾 Thông Tin Thú Cưng</h3>
                <button onclick="openTeamMenu()" class="text-zinc-400 font-bold text-xs">‹ Quay lại</button>
            </div>
            <div class="flex flex-col items-center bg-zinc-800 p-4 rounded-2xl border border-zinc-700 mb-4 text-center">
                <div class="text-6xl mb-2 pet-animate">${p.emoji}</div>
                <div class="text-base font-bold text-yellow-300">${p.name} <span class="${elem.color} text-sm">(${elem.icon} Hệ ${p.element})</span></div>
                <div class="text-xs text-zinc-400 mt-1">Cấp độ: Lv.${p.level} | Sấn công (ATK): ${p.atk}</div>
                
                <div class="w-full space-y-2 mt-3 text-left">
                    <div>
                        <div class="flex justify-between text-[11px] mb-0.5"><span>Máu (HP)</span><span>${p.hp}/${p.maxHp}</span></div>
                        <div class="w-full bg-zinc-900 rounded-full h-2 overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${(p.hp/p.maxHp)*100}%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] mb-0.5"><span>Độ No</span><span>${p.hunger}%</span></div>
                        <div class="w-full bg-zinc-900 rounded-full h-2 overflow-hidden"><div class="bg-amber-500 h-full" style="width: ${p.hunger}%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] mb-0.5"><span>Hạnh Phúc</span><span>${p.happiness}%</span></div>
                        <div class="w-full bg-zinc-900 rounded-full h-2 overflow-hidden"><div class="bg-pink-500 h-full" style="width: ${p.happiness}%"></div></div>
                    </div>
                </div>
            </div>

            <div class="text-xs font-bold text-yellow-400 mb-2">🎮 Tương Tác & Huấn Luyện</div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <button onclick="petAction(${index}, 'feed')" class="bg-emerald-600 hover:bg-emerald-500 p-2.5 rounded-xl font-bold text-xs shadow">🍖 Cho Ăn<br><span class="text-[10px] text-zinc-200">Kho: ${inventory.food}</span></button>
                <button onclick="petAction(${index}, 'play')" class="bg-amber-600 hover:bg-amber-500 p-2.5 rounded-xl font-bold text-xs shadow">🎾 Cho Chơi<br><span class="text-[10px] text-zinc-200">Kho: ${inventory.toy}</span></button>
                <button onclick="petAction(${index}, 'train')" class="bg-indigo-600 hover:bg-indigo-500 p-2.5 rounded-xl font-bold text-xs shadow">🏋️ Luyện Tập<br><span class="text-[10px] text-zinc-200">Kho: ${inventory.trainer}</span></button>
            </div>`;
        }

        function petAction(index, action) {
            let p = team[index];
            if (action === 'feed') {
                if (inventory.food <= 0) { alert('Hết Thức Ăn! Hãy vào Chợ mua thêm.'); return; }
                inventory.food--;
                p.hunger = Math.min(100, p.hunger + 30);
                p.hp = Math.min(p.maxHp, p.hp + 20);
                alert(`${p.name} đã được ăn no và hồi phục HP!`);
            } else if (action === 'play') {
                if (inventory.toy <= 0) { alert('Hết Đồ Chơi! Hãy vào Chợ mua thêm.'); return; }
                inventory.toy--;
                p.happiness = Math.min(100, p.happiness + 35);
                alert(`${p.name} rất vui vẻ!`);
            } else if (action === 'train') {
                if (inventory.trainer <= 0) { alert('Hết Dụng Cụ Tập! Hãy vào Chợ mua thêm.'); return; }
                inventory.trainer--;
                p.level++;
                p.atk += 10;
                p.maxHp += 15;
                p.hp = p.maxHp;
                alert(`${p.name} đã hoàn thành buổi tập và tăng cấp lên Lv.${p.level}!`);
            }
            localStorage.setItem('ar_inventory', JSON.stringify(inventory));
            localStorage.setItem('ar_team', JSON.stringify(team));
            openPetDetail(index);
        }

        // --- TRẠI ---
        function openFarmMenu() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">🏡 Trang Trại (${farm.length})</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div><div class="space-y-2 max-h-48 overflow-y-auto">`;
            if (farm.length === 0) html += `<div class="text-zinc-400 text-xs text-center py-4">Trang trại trống.</div>`;
            else farm.forEach((p, i) => html += `<div class="bg-zinc-800 p-2.5 rounded-xl flex justify-between items-center"><span>${p.emoji} ${p.name}</span><button onclick="moveFarmToTeam(${i})" class="bg-blue-600 text-xs px-2 py-1 rounded">Đưa đội</button></div>`);
            html += `</div>`;
            document.getElementById('modal-content').innerHTML = html;
        }
        function moveFarmToTeam(i) {
            if (team.length >= 3) { alert('Đội hình đầy!'); return; }
            let p = farm.splice(i, 1)[0];
            p.element = p.element || elementsList[Math.floor(Math.random() * elementsList.length)].name;
            p.maxHp = p.maxHp || 100;
            p.hp = p.hp || 100;
            p.atk = p.atk || 50;
            p.hunger = p.hunger || 80;
            p.happiness = p.happiness || 80;
            team.push(p);
            localStorage.setItem('ar_team', JSON.stringify(team));
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            updateTeamCount();
            openFarmMenu();
        }

        // --- TRỨNG ---
        function openEggsMenu() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = `
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🥚 Ấp Trứng</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>
                <div class="text-center py-4"><div class="text-6xl mb-2">🥚</div><div class="text-xs text-yellow-300">Tiến độ: ${eggSteps}/50 bước</div></div>`;
        }

        // --- ĐẤU TRƯỜNG VỚI CƠ CHẾ KHẮC CHẾ NGŨ HÀNH (+30% SÁT THƯƠNG) ---
        function openArenaMenu() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = `
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">⚔️ Đấu Trường Ngũ Hành</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>
                <p class="text-xs text-zinc-300 mb-3">Quy luật khắc chế: Kim ➔ Mộc ➔ Thổ ➔ Thủy ➔ Hỏa ➔ Kim.<br><b>Hệ khắc chế sẽ gây thêm +30% sát thương!</b></p>
                <button onclick="startPvPBattle(); closeModal();" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold text-sm mb-2 shadow">🌐 Bắt Đầu Giao Tranh</button>
                <button onclick="closeModal();" class="w-full bg-zinc-700 py-3 rounded-xl font-bold text-xs">Đóng</button>`;
        }

        function checkElementAdvantage(attackerElem, defenderElem) {
            // Quy luật: Kim khắc Mộc, Mộc khắc Thổ, Thổ khắc Thủy, Thủy khắc Hỏa, Hỏa khắc Kim
            const rules = { 'Kim': 'Mộc', 'Mộc': 'Thổ', 'Thổ': 'Thủy', 'Thủy': 'Hỏa', 'Hỏa': 'Kim' };
            return rules[attackerElem] === defenderElem;
        }

        let battleInterval;
        function startPvPBattle() {
            if (team.length === 0) { alert('Đội hình trống! Hãy đưa thú vào đội để chiến đấu.'); return; }
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');

            let myPet = team[0];
            let enemyElem = elementsList[Math.floor(Math.random() * elementsList.length)].name;
            let enemyPet = { name: 'Thú Hoang Bản Lĩnh', emoji: '🐺', hp: 100, maxHp: 100, atk: 45, element: enemyElem };

            let myHp = myPet.hp;
            let enemyHp = enemyPet.hp;
            let canvas = document.getElementById('battleCanvas');
            let ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            let logEl = document.getElementById('battle-log');
            logEl.innerText = `Giao tranh giữa ${myPet.emoji} (${myPet.element}) và ${enemyPet.emoji} (${enemyPet.element}) bắt đầu!`;

            let step = 0;
            if (battleInterval) clearInterval(battleInterval);
            battleInterval = setInterval(() => {
                step++;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Vẽ giao diện chiến đấu đơn giản trên Canvas
                ctx.font = "70px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(myPet.emoji, 90, canvas.height / 2 - 10);
                ctx.fillText(enemyPet.emoji, canvas.width - 90, canvas.height / 2 - 10);

                if (step % 25 === 0) {
                    // Lượt đánh của mình
                    let isAdvantage = checkElementAdvantage(myPet.element, enemyPet.element);
                    let dmg = myPet.atk;
                    if (isAdvantage) {
                        dmg = Math.floor(dmg * 1.3); // +30% sát thương khắc hệ
                        logEl.innerText = `🔥 ${myPet.name} khắc hệ! Gây ${dmg} sát thương (+30%)!`;
                    } else {
                        logEl.innerText = `⚔️ ${myPet.name} tấn công gây ${dmg} sát thương!`;
                    }
                    enemyHp -= dmg;
                } else if (step % 25 === 12) {
                    // Lượt đánh của địch
                    let isEnemyAdvantage = checkElementAdvantage(enemyPet.element, myPet.element);
                    let enemyDmg = enemyPet.atk;
                    if (isEnemyAdvantage) {
                        enemyDmg = Math.floor(enemyDmg * 1.3); // +30% sát thương khắc hệ
                        logEl.innerText = `⚠️ Đối thủ khắc hệ! Gây ${enemyDmg} sát thương cho bạn (+30%)!`;
                    } else {
                        logEl.innerText = `🛡️ Đối thủ phản công gây ${enemyDmg} sát thương!`;
                    }
                    myHp -= enemyDmg;
                }

                if (enemyHp <= 0 || myHp <= 0) {
                    clearInterval(battleInterval);
                    let won = enemyHp <= 0;
                    if (won) playerCoins += 200;
                    localStorage.setItem('ar_coins', playerCoins);
                    logEl.innerText = won ? '🎉 BẠN ĐÃ CHIẾN THẮNG (+200 Vàng)!' : '😢 BẠN ĐÃ THẤT BẠI!';
                }
            }, 100);
        }

        // Bản đồ Leaflet
        let map;
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([10.0452, 105.7469], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            setTimeout(() => map.invalidateSize(), 300);
        }
        function recenterMap() {
            if (map) map.setView([10.0452, 105.7469], 17);
        }
        function spawnMultipleMonsters() {
            alert('Đã quét lại khu vực tìm thú!');
        }
        function exitARScreen() {
            document.getElementById('ar-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if (map) map.invalidateSize();
        }
        function exitBattleScreen() {
            if (battleInterval) clearInterval(battleInterval);
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if (map) map.invalidateSize();
        }

        window.onload = () => {
            updateTeamCount();
            initMap();
        };
    </script>
</body>
</html>
