<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Monster - Free Roaming 3D World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; user-select: none; perspective: 1000px; }
        
        @keyframes creature3D {
            0%, 100% { transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) scale(1); }
            50% { transform: translate3d(0, -12px, 15px) rotateX(5deg) rotateY(8deg) scale(1.04); }
        }
        .creature-3d {
            animation: creature3D 4s ease-in-out infinite;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, opacity 0.2s ease-out;
            will-change: transform, opacity;
        }

        @keyframes throwBall {
            0% { transform: translate(-50%, 150px) scale(0.4); opacity: 0; }
            50% { transform: translate(-50%, -20px) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50px) scale(1.2); opacity: 0; }
        }
        .anim-throw { animation: throwBall 0.5s ease-out forwards; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- QUẢN LÝ PHIÊN BẢN (AUTO UPDATE CACHE) -->
    <script>
        const APP_VERSION = '1.4'; // Tăng số này lên mỗi khi cập nhật code để tự động đồng bộ cache!

        async function checkForUpdates() {
            try {
                const response = await fetch(window.location.pathname + '?_=' + new Date().getTime());
                const text = await response.text();
                const match = text.match(/const APP_VERSION = '([^']+)'/);
                if (match && match[1] && match[1] !== APP_VERSION) {
                    window.location.reload(true);
                }
            } catch (e) {}
        }
        window.addEventListener('load', checkForUpdates);
    </script>

    <!-- CAMERA BACKGROUND -->
    <div id="camera-container" class="absolute inset-0 z-0 overflow-hidden bg-zinc-900">
        <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <div id="camera-fallback" class="absolute inset-0 flex items-center justify-center bg-gradient-to-b from-blue-900 to-indigo-950 text-center p-6">
            <div>
                <div class="text-6xl mb-4">🌍</div>
                <h2 class="text-xl font-bold mb-2">Đang bật Camera AR Không gian thực...</h2>
                <p class="text-sm text-zinc-300">Vui lòng cấp quyền camera và cảm biến chuyển động.</p>
            </div>
        </div>
    </div>

    <!-- MAIN UI OVERLAY -->
    <div id="game-ui" class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-none p-4">
        
        <!-- TOP BAR -->
        <div class="flex justify-between items-center pointer-events-auto">
            <div class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="radar-status" class="text-xs font-medium">🧭 Hãy xoay điện thoại tìm thú xung quanh...</span>
            </div>
            <div class="flex gap-2">
                <button onclick="openTeamMenu()" class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold flex items-center gap-1">
                    🎒 Đội hình (<span id="team-count">0</span>/3)
                </button>
                <button onclick="openPokedexMenu()" class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold">
                    📖 Sổ tay
                </button>
            </div>
        </div>

        <!-- FREE ROAMING 3D WORLD LAYER -->
        <div id="ar-scene" class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div id="active-monster" class="absolute pointer-events-auto cursor-pointer flex flex-col items-center creature-3d" onclick="tryCatchMonster()" style="left: 50%; top: 50%; opacity: 0;">
                <div class="bg-black/50 backdrop-blur-sm px-2.5 py-0.5 rounded-full text-[11px] text-yellow-300 font-bold mb-1 border border-yellow-500/40 shadow-lg">CP <span id="mon-cp">150</span></div>
                <div id="mon-avatar" class="text-8xl filter drop-shadow-[0_25px_25px_rgba(0,0,0,0.8)]">🐕</div>
                <div id="mon-name" class="text-xs font-bold mt-1 bg-black/60 px-3 py-0.5 rounded-full border border-white/20 shadow-lg">Inu-Spark</div>
            </div>
            <!-- Hiệu ứng bóng ném -->
            <div id="pokeball-anim" class="absolute text-5xl pointer-events-none hidden" style="left: 50%; top: 50%;">🔴</div>
        </div>

        <!-- THÔNG BÁO KẾT QUẢ NÉM BÓNG -->
        <div class="flex flex-col items-center pointer-events-none pb-10">
            <div id="throw-feedback" class="text-sm font-bold bg-black/70 px-4 py-1.5 rounded-full border border-white/20 opacity-0 transition-opacity shadow-lg">Ném hụt rồi! Thú đã vùng vẫy thoát ra!</div>
        </div>
    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal-container" class="hidden absolute inset-0 z-30 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script>
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let pokedex = JSON.parse(localStorage.getItem('ar_pokedex') || '[]');
        
        const categories = {
            'Gia cầm': [
                { id: 101, name: 'Gà Ta', emoji: '🐔', cp: 120, hp: 60, maxHp: 60, atk: 70, level: 1 },
                { id: 102, name: 'Vịt Cỏ', emoji: '🦆', cp: 110, hp: 55, maxHp: 55, atk: 65, level: 1 },
                { id: 103, name: 'Ngỗng Trắng', emoji: '🦢', cp: 140, hp: 80, maxHp: 80, atk: 85, level: 1 },
                { id: 104, name: 'Ngan Đen', emoji: '🦃', cp: 130, hp: 75, maxHp: 75, atk: 80, level: 1 }
            ],
            'Gia súc': [
                { id: 201, name: 'Chó Vàng', emoji: '🐕', cp: 145, hp: 80, maxHp: 80, atk: 90, level: 1 },
                { id: 202, name: 'Mèo Mướp', emoji: '🐈', cp: 135, hp: 70, maxHp: 70, atk: 95, level: 1 },
                { id: 203, name: 'Heo Ủn Ỉn', emoji: '🐖', cp: 150, hp: 100, maxHp: 100, atk: 75, level: 1 },
                { id: 204, name: 'Bò Sữa', emoji: '🐂', cp: 180, hp: 120, maxHp: 120, atk: 110, level: 1 }
            ],
            'Tự nhiên': [
                { id: 301, name: 'Chuột Nước', emoji: '🐹', cp: 110, hp: 60, maxHp: 60, atk: 65, level: 1 },
                { id: 302, name: 'Chim Lửa', emoji: '🐦', cp: 185, hp: 50, maxHp: 50, atk: 140, level: 1 },
                { id: 303, name: 'Cáo Đỏ', emoji: '🦊', cp: 160, hp: 65, maxHp: 65, atk: 115, level: 1 },
                { id: 304, name: 'Sói Xám', emoji: '🐺', cp: 175, hp: 90, maxHp: 90, atk: 125, level: 1 }
            ],
            'Sách đỏ': [
                { id: 401, name: 'Rồng Nước', emoji: '🐉', cp: 250, hp: 150, maxHp: 150, atk: 180, level: 1 },
                { id: 402, name: 'Phượng Hoàng', emoji: '🦅', cp: 270, hp: 140, maxHp: 140, atk: 195, level: 1 },
                { id: 403, name: 'Kỳ Lân', emoji: '🦄', cp: 260, hp: 160, maxHp: 160, atk: 175, level: 1 }
            ]
        };

        const allMonsters = Object.values(categories).flat();
        let currentWildMonster = null;

        // Tọa độ ngẫu nhiên cố định trong không gian phòng (0 - 360 độ)
        let worldTarget = { alpha: 0, beta: 0 };

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                document.getElementById('camera-feed').srcObject = stream;
                document.getElementById('camera-fallback').style.display = 'none';
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    document.getElementById('camera-feed').srcObject = stream;
                    document.getElementById('camera-fallback').style.display = 'none';
                } catch (e) {
                    console.log("Camera error");
                }
            }
        }

        // Lắng nghe cảm biến chuyển động để tính toán vị trí thực tế ảo trong không gian
        function initSensors() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    let currAlpha = event.alpha || 0; // Hướng xoay vòng tròn la bàn (0 - 360)
                    let currBeta = event.beta || 0;   // Góc ngẩng điện thoại lên/xuống

                    updateWorldMonsterPosition(currAlpha, currBeta);
                });
            }
        }

        function updateWorldMonsterPosition(currAlpha, currBeta) {
            const monsterEl = document.getElementById('active-monster');
            const radarStatus = document.getElementById('radar-status');
            if (!currentWildMonster) return;

            // Tính toán góc lệch giữa hướng camera hiện tại và vị trí con thú trong không gian
            let diffAlpha = currAlpha - worldTarget.alpha;
            let diffBeta = currBeta - worldTarget.beta;

            if (diffAlpha > 180) diffAlpha -= 360;
            if (diffAlpha < -180) diffAlpha += 360;

            // Chuyển đổi độ lệch góc thành vị trí pixel trên màn hình camera
            const screenX = -diffAlpha * 25; 
            const screenY = diffBeta * 20;

            // Kiểm tra xem góc nhìn của camera có đang chiếu tới con thú không (trong khoảng ±45 độ)
            if (Math.abs(diffAlpha) > 45 || Math.abs(diffBeta) > 45) {
                // Nếu quay đi hướng khác -> Con thú khuất hoàn toàn khỏi màn hình
                monsterEl.style.opacity = '0';
                monsterEl.style.pointerEvents = 'none';
                radarStatus.innerText = '🧭 Hãy xoay người vòng quanh để tìm thú trong phòng...';
            } else {
                // Khi lia camera quay lại đúng hướng -> Con thú hiện ra tự nhiên tại đúng vị trí không gian đó
                let opacityFactor = 1 - (Math.abs(diffAlpha) / 45);
                monsterEl.style.opacity = Math.max(0.2, opacityFactor);
                monsterEl.style.pointerEvents = 'auto';
                
                // Cập nhật vị trí dịch chuyển linh hoạt trên màn hình theo góc nhìn
                monsterEl.style.transform = `translate(calc(-50% + ${screenX}px), calc(-50% + ${screenY}px))`;

                if (Math.abs(diffAlpha) < 15 && Math.abs(diffBeta) < 15) {
                    radarStatus.innerText = '🎯 Đã tìm thấy mục tiêu! Chạm vào thú để bắt!';
                } else {
                    radarStatus.innerText = '👀 Thú đang ở gần hướng này, hãy lia máy lại gần...';
                }
            }
        }

        function respawnMonster() {
            const template = allMonsters[Math.floor(Math.random() * allMonsters.length)];
            currentWildMonster = { ...template, cp: Math.floor(template.cp * (0.9 + Math.random() * 0.3)) };
            
            // Random tọa độ không gian độc lập quanh người chơi (từ 0 đến 360 độ hướng quay)
            worldTarget.alpha = Math.random() * 360;
            worldTarget.beta = (Math.random() * 30) - 15; // Dao động góc nhìn cao/thấp quanh tầm mắt

            document.getElementById('mon-avatar').innerText = currentWildMonster.emoji;
            document.getElementById('mon-name').innerText = currentWildMonster.name;
            document.getElementById('mon-cp').innerText = currentWildMonster.cp;
            
            playSound('spawn');
        }

        // --- NÉM BÓNG VÀ TỶ LỆ THẤT BẠI ---
        function tryCatchMonster() {
            if (!currentWildMonster) return;
            playSound('throw');

            const ball = document.getElementById('pokeball-anim');
            ball.classList.remove('hidden');
            ball.classList.add('anim-throw');

            const feedback = document.getElementById('throw-feedback');

            setTimeout(() => {
                ball.classList.remove('anim-throw');
                ball.classList.add('hidden');

                // Tỷ lệ bắt hụt/thất bại: 30%
                const isFailed = Math.random() < 0.30;

                if (isFailed) {
                    playSound('miss');
                    feedback.innerText = `💥 Ném hụt rồi! ${currentWildMonster.name} đã vùng vẫy thoát ra!`;
                    feedback.classList.remove('text-emerald-400');
                    feedback.classList.add('text-red-400');
                    feedback.style.opacity = '1';

                    setTimeout(() => { feedback.style.opacity = '0'; }, 2000);
                } else {
                    playSound('catch');
                    feedback.innerText = `🎉 Bắt thành công ${currentWildMonster.name}!`;
                    feedback.classList.remove('text-red-400');
                    feedback.classList.add('text-emerald-400');
                    feedback.style.opacity = '1';

                    if (team.length < 3) {
                        team.push({ ...currentWildMonster, uniqueId: Date.now() });
                        localStorage.setItem('ar_team', JSON.stringify(team));
                        updateTeamCount();
                    } else {
                        alert(`Đội hình đã đầy (3/3). Thú tự động lưu vào kho.`);
                    }

                    if (!pokedex.includes(currentWildMonster.id)) {
                        pokedex.push(currentWildMonster.id);
                        localStorage.setItem('ar_pokedex', JSON.stringify(pokedex));
                    }

                    document.getElementById('active-monster').style.opacity = '0';
                    setTimeout(() => {
                        feedback.style.opacity = '0';
                        respawnMonster();
                    }, 1500);
                }
            }, 500);
        }

        function updateTeamCount() {
            document.getElementById('team-count').innerText = team.length;
        }

        // --- CÁC MENU SỔ TAY VÀ ĐỘI HÌNH ---
        function openPokedexMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">📖 Sổ Tay Phân Loại</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>`;
            html += `<div class="space-y-4">`;

            for (let [catName, list] of Object.entries(categories)) {
                html += `<div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">`;
                html += `<div class="text-yellow-400 font-bold text-sm mb-2">📁 Nhóm: ${catName}</div>`;
                html += `<div class="grid grid-cols-4 gap-2">`;
                
                list.forEach(m => {
                    const caught = pokedex.includes(m.id);
                    html += `
                    <div class="bg-zinc-900 p-2 rounded-lg flex flex-col items-center border ${caught ? 'border-emerald-500/60' : 'border-zinc-800 opacity-40'}">
                        <span class="text-3xl mb-1">${caught ? m.emoji : '❓'}</span>
                        <div class="text-[10px] text-center font-bold truncate w-full">${m.name}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
            content.innerHTML = html;
        }

        function openTeamMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🎒 Đội Hình Thú Cưng (${team.length}/3)</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>`;
            if (team.length === 0) {
                html += `<p class="text-zinc-400 text-sm text-center py-6">Chưa có thú nào trong đội hình. Hãy đi tìm và bắt thú xung quanh phòng!</p>`;
            } else {
                html += `<div class="space-y-3">`;
                team.forEach((pet, idx) => {
                    html += `
                    <div onclick="openPetDetail(${idx})" class="bg-zinc-800 hover:bg-zinc-750 cursor-pointer p-3 rounded-xl flex items-center justify-between border border-zinc-700 transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="text-4xl bg-zinc-900 p-2 rounded-xl">${pet.emoji}</span>
                            <div>
                                <div class="font-bold text-sm">${pet.name} <span class="text-xs text-yellow-400">Lv.${pet.level || 1}</span></div>
                                <div class="text-[11px] text-zinc-300">HP: ${pet.hp}/${pet.maxHp} | ATK: ${pet.atk}</div>
                                <div class="text-[10px] text-emerald-400 mt-0.5">Bấm để chăm sóc & chơi cùng 👉</div>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); removePet(${idx})" class="text-red-400 text-xs px-2 py-1 bg-red-950/40 rounded">Thả</button>
                    </div>`;
                });
                html += `</div>`;
            }
            content.innerHTML = html;
        }

        function openPetDetail(index) {
            let pet = team[index];
            const content = document.getElementById('modal-content');

            content.innerHTML = `
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">🐾 Chăm Sóc Thú Cưng</h3>
                <button onclick="openTeamMenu()" class="text-zinc-400 font-bold">‹ Quay lại</button>
            </div>
            <div class="flex flex-col items-center bg-zinc-800 p-5 rounded-2xl border border-zinc-700 mb-4 text-center">
                <div class="text-8xl mb-2 filter drop-shadow-md animate-bounce">${pet.emoji}</div>
                <div class="text-lg font-bold text-yellow-300">${pet.name}</div>
                <div class="text-xs text-zinc-400 mt-1">Cấp độ: Lv.${pet.level || 1} | CP: ${pet.cp}</div>
                <div class="w-full bg-zinc-900 rounded-full h-3 mt-3 overflow-hidden border border-zinc-700">
                    <div class="bg-emerald-500 h-full transition-all" style="width: ${(pet.hp / pet.maxHp) * 100}%"></div>
                </div>
                <div class="text-[11px] text-zinc-300 mt-1">HP: ${pet.hp}/${pet.maxHp}</div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button onclick="petAction(${index}, 'feed')" class="bg-emerald-600 hover:bg-emerald-500 p-3 rounded-xl flex flex-col items-center gap-1 font-bold text-xs shadow-lg active:scale-95 transition-all">
                    <span class="text-xl">🍖</span> Cho ăn
                </button>
                <button onclick="petAction(${index}, 'play')" class="bg-amber-600 hover:bg-amber-500 p-3 rounded-xl flex flex-col items-center gap-1 font-bold text-xs shadow-lg active:scale-95 transition-all">
                    <span class="text-xl">🎾</span> Chơi cùng
                </button>
                <button onclick="petAction(${index}, 'train')" class="bg-indigo-600 hover:bg-indigo-500 p-3 rounded-xl flex flex-col items-center gap-1 font-bold text-xs shadow-lg active:scale-95 transition-all">
                    <span class="text-xl">🏋️</span> Luyện tập
                </button>
            </div>`;
        }

        function petAction(index, action) {
            let pet = team[index];
            if (action === 'feed') {
                pet.hp = Math.min(pet.maxHp, pet.hp + 25);
                alert(`🍖 Bạn đã cho ${pet.name} ăn ngon lành! HP hồi phục.`);
            } else if (action === 'play') {
                pet.atk += 3;
                alert(`🎾 Bạn cùng chơi đùa với ${pet.name}. Thú cưng rất vui vẻ!`);
            } else if (action === 'train') {
                pet.level = (pet.level || 1) + 1;
                pet.atk += 10;
                pet.maxHp += 15;
                pet.hp = pet.maxHp;
                alert(`🏋️ Luyện tập thành công! ${pet.name} thăng cấp Lv.${pet.level}!`);
            }
            localStorage.setItem('ar_team', JSON.stringify(team));
            openPetDetail(index);
        }

        function removePet(index) {
            if (confirm('Bạn có chắc muốn thả con thú này về tự nhiên?')) {
                team.splice(index, 1);
                localStorage.setItem('ar_team', JSON.stringify(team));
                updateTeamCount();
                openTeamMenu();
            }
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'throw') {
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'catch') {
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                osc.frequency.setValueAtTime(800, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } else if (type === 'miss') {
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'spawn') {
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        }

        window.onload = () => {
            initCamera();
            initSensors();
            updateTeamCount();
            respawnMonster();
        };
    </script>
</body>
</html>
