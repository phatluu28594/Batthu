<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batthu - Full Feature Master v8.8 Fullscreen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #09090b; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        #map-screen { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: absolute; inset: 0; background: #09090b; }
        #map-container-wrap { flex: 1 1 auto; position: relative; width: 100%; height: 100%; min-height: 50vh; }
        #map { height: 100% !important; width: 100% !important; position: absolute !important; inset: 0; z-index: 10; background: #18181b; }
        
        /* VÙNG CHẠM TƯƠNG TÁC TÀNG HÌNH HOÀN TOÀN (KHÔNG HIỂN THỊ VIỀN HAY CHỮ) */
        .hotspot {
            position: absolute; cursor: pointer; border: none; background: transparent; z-index: 20;
        }
        .hotspot:active { background: rgba(255, 255, 255, 0.15); }

        .leaflet-control-attribution { display: none !important; }
        .leaflet-div-icon { background: transparent !important; border: none !important; }
        @keyframes floatText { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-45px) scale(1.2); opacity: 0; } }
        .damage-popup { animation: floatText 0.6s ease-out forwards; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- KHUNG YOUTUBE PLAYER ẨN -->
    <div id="youtube-audio-container" style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;">
        <div id="yt-player"></div>
    </div>

    <!-- MÀN HÌNH BẢN ĐỒ GPS & TIỆN ÍCH -->
    <div id="map-screen" class="absolute inset-0 z-20 flex flex-col justify-between bg-zinc-950 p-2">
        <div class="flex justify-between items-center z-30 pt-1 pb-1 shrink-0 gap-1">
            <div class="bg-black/80 backdrop-blur-md px-2 py-1 rounded-full border border-white/20 flex items-center gap-1 shrink-0">
                <span id="weather-icon" class="text-xs">☀️</span>
                <span id="weather-status" class="text-[10px] font-medium">Trời quang</span>
            </div>
            <div class="flex gap-1 overflow-x-auto py-1 shrink grow items-center no-scrollbar">
                <button onclick="openWorldBossMenu()" class="bg-amber-700/90 px-2 py-1 rounded-full border border-amber-400 text-[10px] font-bold shadow cursor-pointer animate-pulse whitespace-nowrap">👹 Boss</button>
                <button onclick="openHospitalMenu()" class="bg-cyan-700/90 px-2 py-1 rounded-full border border-cyan-400 text-[10px] font-bold shadow cursor-pointer whitespace-nowrap">🏥 Bệnh Viện</button>
                <button onclick="openQuestMenu()" class="bg-yellow-600/90 px-2 py-1 rounded-full border border-yellow-400 text-[10px] font-bold shadow cursor-pointer whitespace-nowrap">📜 NV</button>
                <button onclick="openTowerMenu()" class="bg-purple-600/90 px-2 py-1 rounded-full border border-purple-400 text-[10px] font-bold shadow cursor-pointer whitespace-nowrap">🗼 Tháp</button>
                <button onclick="openMarketMenu()" class="bg-amber-600/90 px-2 py-1 rounded-full border border-amber-400 text-[10px] font-bold shadow cursor-pointer whitespace-nowrap">🛒 Chợ</button>
                <button onclick="openArenaMenu()" class="bg-red-600/90 px-2 py-1 rounded-full border border-red-400 text-[10px] font-bold shadow cursor-pointer whitespace-nowrap">⚔️ PvP</button>
                <button onclick="openFarmMenu()" class="bg-emerald-600/90 px-2 py-1 rounded-full border border-emerald-400 text-[10px] font-bold shadow cursor-pointer whitespace-nowrap">🏡 Trại</button>
                <button onclick="openTeamMenu()" class="bg-black/80 px-2 py-1 rounded-full border border-white/20 text-[10px] font-bold cursor-pointer whitespace-nowrap">🎒(<span id="team-count">0</span>/3)</button>
            </div>
        </div>

        <div id="map-container-wrap" class="my-1 rounded-xl overflow-hidden border border-zinc-800 relative grow">
            <div id="map"></div>
            <button onclick="recenterMap()" class="absolute bottom-6 right-4 z-30 bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-full shadow-2xl border border-blue-400 active:scale-95 transition-transform flex items-center justify-center text-lg cursor-pointer" title="Về vị trí của tôi">
                📍
            </button>
        </div>

        <div class="flex flex-col items-center z-30 pb-1 shrink-0">
            <div id="stamina-info" class="text-[11px] font-bold text-amber-300 bg-black/80 px-3 py-1 rounded-full border border-white/20 mb-1 shadow-lg flex items-center gap-1.5">
                ⚡ Năng lượng: <span id="stamina-count">15</span>/15 (<span id="stamina-timer">10:00</span>) | 💰 <span id="coin-count">1500</span>🪙
            </div>
            <button onclick="spawnMultipleMonsters()" class="w-full max-w-xs bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded-xl border border-zinc-700 shadow-xl transition-all text-[11px] cursor-pointer">
                🔄 Quét lại khu vực (GPS & Thú)
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH TRANG TRẠI FULLSCREEN & VÙNG CHẠM ẨN -->
    <div id="fullscreen-farm-screen" class="hidden absolute inset-0 z-40 bg-zinc-950 flex flex-col">
        <!-- Nút thoát nhỏ nổi ở góc trên -->
        <button onclick="closeFullscreenFarm()" class="absolute top-3 right-3 z-30 bg-black/70 hover:bg-black text-white px-3 py-1.5 rounded-full font-bold text-xs cursor-pointer border border-white/20 shadow-xl">✕ Thoát</button>

        <div class="relative w-full h-full overflow-hidden">
            <img src="./farm-bg.png" alt="Trang Trai" class="absolute inset-0 w-full h-full object-cover z-0">
            
            <!-- Vùng chạm 1: Khu Luyện Tập -->
            <div onclick="showFarmSection('training')" class="hotspot" style="top: 5%; left: 10%; width: 80%; height: 28%;" title="Khu Luyện Tập"></div>
            <!-- Vùng chạm 2: Khu Hồi Sức -->
            <div onclick="showFarmSection('resting')" class="hotspot" style="top: 36%; left: 52%; width: 44%; height: 30%;" title="Khu Hồi Sức"></div>
            <!-- Vùng chạm 3: Kho Thú Trại -->
            <div onclick="showFarmSection('storage')" class="hotspot" style="top: 68%; left: 5%; width: 90%; height: 28%;" title="Kho Trại"></div>
        </div>
    </div>

    <!-- MÀN HÌNH BỆNH VIỆN FULLSCREEN & VÙNG CHẠM ẨN -->
    <div id="hospital-screen" class="hidden absolute inset-0 z-40 bg-zinc-950 flex flex-col">
        <!-- Nút đóng nhỏ nổi ở góc trên -->
        <button onclick="closeHospitalMenu()" class="absolute top-3 right-3 z-30 bg-black/70 hover:bg-black text-white px-3 py-1.5 rounded-full font-bold text-xs cursor-pointer border border-white/20 shadow-xl">✕ Đóng</button>

        <div class="relative w-full h-full overflow-hidden">
            <img src="./hospital-bg.png" alt="Bệnh Vien" class="absolute inset-0 w-full h-full object-cover z-0">

            <!-- Vùng chạm 1: Hồi Sức Tim -->
            <div onclick="openHospitalActionModal('heal')" class="hotspot" style="top: 23%; left: 5%; width: 45%; height: 35%;" title="Hồi Sức Tim"></div>
            <!-- Vùng chạm 2: Tiến Hóa Đá -->
            <div onclick="openHospitalActionModal('evolve')" class="hotspot" style="top: 23%; left: 52%; width: 43%; height: 35%;" title="Tiến Hóa Đá"></div>
            <!-- Vùng chạm 3: Sinh Sản Lai Thú -->
            <div onclick="openHospitalActionModal('breed')" class="hotspot" style="top: 61%; left: 10%; width: 80%; height: 35%;" title="Lai Giống F1"></div>
        </div>
    </div>

    <!-- MÀN HÌNH MINIGAME BẮT THÚ AR & DÂY VÀNG -->
    <div id="ar-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-900">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        </div>
        <canvas id="gameCanvas" class="absolute inset-0 z-10 touch-none"></canvas>
        <div class="flex justify-between items-center z-20 p-4 pointer-events-auto">
            <button onclick="exitARScreen()" class="bg-black/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">
                ⬅️ Quay lại bản đồ
            </button>
            <div id="ar-mon-info" class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-yellow-300">
                Mục tiêu: Đang tải...
            </div>
        </div>
        <div class="flex flex-col items-center z-20 pb-8 pointer-events-none">
            <div id="tug-of-war-ui" class="hidden flex flex-col items-center w-full max-w-xs bg-black/85 p-3 rounded-2xl border border-amber-500/50 pointer-events-auto mb-2 shadow-2xl">
                <div class="text-xs font-bold text-amber-300 mb-1 animate-pulse">🎣 GIẰNG CO KÉO THÚ! CHẠM LIÊN TỤC!</div>
                <div class="w-full bg-zinc-900 rounded-full h-3 overflow-hidden border border-zinc-700 mb-1 relative">
                    <div id="tug-progress-bar" class="bg-gradient-to-r from-red-500 via-yellow-500 to-emerald-400 h-full transition-all duration-75" style="width: 50%"></div>
                </div>
                <div class="text-[10px] text-zinc-300">Tap liên tay để kéo đầy thanh thừng!</div>
            </div>
            <div id="ar-instruction" class="text-[11px] text-zinc-300 mt-1 bg-black/60 px-3 py-1 rounded-full border border-white/10">🤠 Chạm vào màn hình để quăng vòng dây thừng!</div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẤU TRƯỜNG FULLSCREEN V8.8 -->
    <div id="battle-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-950">
        <!-- Header Thanh HP Đấu Trường -->
        <div class="absolute top-3 left-3 right-3 z-30 flex justify-between items-center bg-black/75 backdrop-blur-md p-2.5 rounded-xl border border-white/20 shadow-2xl">
            <div class="flex flex-col w-5/12">
                <div id="battle-team-names" class="text-[11px] font-bold text-emerald-400 truncate">Đội hình của bạn</div>
                <div class="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden mt-1 border border-zinc-700">
                    <div id="battle-team-hp-bar" class="bg-emerald-500 h-full transition-all duration-200" style="width: 100%"></div>
                </div>
                <div id="battle-team-hp-text" class="text-[9px] text-zinc-300 mt-0.5">HP: --/--</div>
            </div>
            <button onclick="exitBattleScreen()" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-lg border border-zinc-600 text-[10px] font-bold cursor-pointer">Rút lui</button>
            <div class="flex flex-col w-5/12 text-right">
                <div id="battle-enemy-name" class="text-[11px] font-bold text-red-400 truncate">Đối thủ</div>
                <div class="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden mt-1 border border-zinc-700">
                    <div id="battle-enemy-hp-bar" class="bg-red-500 h-full transition-all duration-200 ml-auto" style="width: 100%"></div>
                </div>
                <div id="battle-enemy-hp-text" class="text-[9px] text-zinc-300 mt-0.5">HP: --/--</div>
            </div>
        </div>

        <!-- Khung Canvas Fullscreen phủ trọn background đấu trường -->
        <div class="relative w-full h-full overflow-hidden flex flex-col items-center justify-center">
            <img src="./battle-bg.png" alt="Dau Truong" class="absolute inset-0 w-full h-full object-cover z-0">
            
            <canvas id="battleCanvas" class="absolute inset-0 w-full h-full z-10"></canvas>
            <div id="damage-popup-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
            
            <!-- Log thông báo chiến đấu nằm ở sát đáy -->
            <div id="battle-log" class="absolute bottom-6 z-20 bg-black/85 px-4 py-2 rounded-xl text-xs text-yellow-300 font-bold border border-yellow-500/50 text-center max-w-sm shadow-xl">
                Đang giao chiến...
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY CHUNG -->
    <div id="modal-container" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto relative"></div>
    </div>

    <!-- YOUTUBE IFRAME API SCRIPT -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let farm = JSON.parse(localStorage.getItem('ar_farm') || '[]');
        let playerCoins = parseInt(localStorage.getItem('ar_coins') || '1500');
        let towerFloor = parseInt(localStorage.getItem('ar_tower_floor') || '1');
        let bossLevel = parseInt(localStorage.getItem('ar_boss_level') || '1');
        let stamina = parseInt(localStorage.getItem('ar_stamina') || '15');
        let lastStaminaTime = parseInt(localStorage.getItem('ar_stamina_time') || Date.now());

        let trainingPoles = JSON.parse(localStorage.getItem('ar_training_poles') || '[null, null, null, null]');
        let restingPets = JSON.parse(localStorage.getItem('ar_resting_pets') || '[]');

        let inventory = JSON.parse(localStorage.getItem('ar_inventory') || JSON.stringify({
            food: 15, toy: 15, trainer: 10,
            stoneKim: 5, stoneMoc: 5, stoneThuy: 5, stoneHoa: 5, stoneTho: 5
        }));

        let dailyQuests = JSON.parse(localStorage.getItem('ar_quests') || JSON.stringify([
            { id: 1, title: 'Bắt 3 linh thú bất kỳ', target: 3, progress: 0, reward: 200, claimed: false },
            { id: 2, title: 'Thắng 2 trận đấu trường', target: 2, progress: 0, reward: 300, claimed: false },
            { id: 3, title: 'Cho linh thú ăn 2 lần', target: 2, progress: 0, reward: 150, claimed: false }
        ]));

        let ytPlayer = null;
        let isMusicReady = false;
        const LOBBY_YOUTUBE_ID = 'b-FHfiM8ILo';
        const BATTLE_YOUTUBE_ID = '9zMW4nO7CIo';

        function onYouTubeIframeAPIReady() {
            try {
                ytPlayer = new YT.Player('yt-player', {
                    height: '0', width: '0', videoId: LOBBY_YOUTUBE_ID,
                    playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': LOBBY_YOUTUBE_ID, 'controls': 0 },
                    events: { 'onReady': (e) => { isMusicReady = true; e.target.setVolume(50); e.target.playVideo(); } }
                });
            } catch(e){}
        }

        let isMusicPlaying = false;
        document.addEventListener('click', () => {
            if (!isMusicPlaying && isMusicReady && ytPlayer) { isMusicPlaying = true; ytPlayer.playVideo(); }
        }, { once: true });

        function switchGameMusic(scene) {
            if (!isMusicReady || !ytPlayer) return;
            if (scene === 'battle') ytPlayer.loadVideoById(BATTLE_YOUTUBE_ID);
            else if (scene === 'map') ytPlayer.loadVideoById(LOBBY_YOUTUBE_ID);
        }

        const possibleTraits = [
            { name: 'Khả năng Làm choáng', icon: '💫 Choáng', type: 'stun', chance: 20 },
            { name: 'Đòn đánh Trúng độc', icon: '🟢 Độc', type: 'poison', chance: 25 },
            { name: 'Thiêu đốt diện rộng', icon: '🔥 Cháy', type: 'burn', chance: 22 },
            { name: 'Làm chậm đối thủ', icon: '❄️ Chậm', type: 'slow', chance: 25 },
            { name: 'Hộ thân Buff Giáp', icon: '🛡️ Buff', type: 'shield', chance: 30 }
        ];

        const rarities = [
            { name: 'Thường', color: 'text-zinc-300', bg: 'border-zinc-600', badge: '⚪ Trang', rate: 50, statMultiplier: 1.0 },
            { name: 'Hiếm', color: 'text-emerald-400', bg: 'border-emerald-500', badge: '🟢 Xanh', rate: 25, statMultiplier: 1.3 },
            { name: 'Cực Hiếm', color: 'text-yellow-400', bg: 'border-yellow-500', badge: '🟡 Vàng', rate: 15, statMultiplier: 1.6 },
            { name: 'Huyền Thoại', color: 'text-red-500', bg: 'border-red-500', badge: '🔴 Đỏ', rate: 7, statMultiplier: 2.0 },
            { name: 'Thần Thánh', color: 'text-purple-400', bg: 'border-purple-500', badge: '🟣 Tím', rate: 3, statMultiplier: 2.5 }
        ];

        function getRandomRarity() {
            let roll = Math.random() * 100;
            let cumulative = 0;
            for (let r of rarities) {
                cumulative += r.rate;
                if (roll <= cumulative) return r;
            }
            return rarities[0];
        }

        function sanitizePetsData(petList) {
            return petList.map(p => {
                let rarity = p.rarity || getRandomRarity();
                let multi = rarity.statMultiplier || 1.0;
                return {
                    ...p,
                    maxHp: p.maxHp || p.hp || 150,
                    hp: (p.hp !== undefined && p.hp > 0) ? p.hp : (p.maxHp || 150),
                    level: p.level || 1,
                    atk: p.atk || 40,
                    hearts: p.hearts !== undefined ? p.hearts : 3,
                    gender: p.gender || (Math.random() < 0.5 ? 'Đực' : 'Cái'),
                    rarity: rarity,
                    critRate: (p.critRate && p.critRate > 0) ? p.critRate : Math.floor(15 + Math.random() * 20 * multi),
                    dodgeRate: (p.dodgeRate && p.dodgeRate > 0) ? p.dodgeRate : Math.floor(10 + Math.random() * 15 * multi),
                    accuracy: (p.accuracy && p.accuracy > 0) ? p.accuracy : Math.floor(80 + Math.random() * 15),
                    blockRate: (p.blockRate && p.blockRate > 0) ? p.blockRate : Math.floor(10 + Math.random() * 20 * multi),
                    slowResist: (p.slowResist && p.slowResist > 0) ? p.slowResist : Math.floor(10 + Math.random() * 15),
                    speed: (p.speed && p.speed > 0) ? p.speed : Math.floor(40 + Math.random() * 30 * multi),
                    trait: p.trait || possibleTraits[Math.floor(Math.random() * possibleTraits.length)],
                    hunger: p.hunger !== undefined ? p.hunger : 90,
                    happiness: p.happiness !== undefined ? p.happiness : 90
                };
            });
        }
        team = sanitizePetsData(team);
        farm = sanitizePetsData(farm);
        restingPets = sanitizePetsData(restingPets);
        trainingPoles = trainingPoles.map(p => p ? sanitizePetsData([p])[0] : null);

        const allMonsters = [
            { id: 101, name: 'Gà Ta', emoji: '🐔', hp: 100, maxHp: 100, atk: 35 },
            { id: 102, name: 'Vịt Cỏ', emoji: '🦆', hp: 90, maxHp: 90, atk: 30 },
            { id: 201, name: 'Chó Vàng', emoji: '🐕', hp: 120, maxHp: 120, atk: 45 },
            { id: 202, name: 'Mèo Mướp', emoji: '🐈', hp: 110, maxHp: 110, atk: 42 },
            { id: 203, name: 'Heo Ủn Ỉn', emoji: '🐖', hp: 140, maxHp: 140, atk: 38 },
            { id: 302, name: 'Chim Lửa', emoji: '🐦', hp: 100, maxHp: 100, atk: 55 },
            { id: 401, name: 'Rồng Nước', emoji: '🐉', hp: 180, maxHp: 180, atk: 65 }
        ];

        let currentWildMonster = null;

        function saveGameData() {
            localStorage.setItem('ar_team', JSON.stringify(team));
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            localStorage.setItem('ar_coins', playerCoins);
            localStorage.setItem('ar_training_poles', JSON.stringify(trainingPoles));
            localStorage.setItem('ar_resting_pets', JSON.stringify(restingPets));
            let coinEl = document.getElementById('coin-count');
            if (coinEl) coinEl.innerText = playerCoins;
        }

        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }

        function checkPetSurvival() {
            team = team.filter(p => p.hearts > 0);
            farm = farm.filter(p => p.hearts > 0);
            restingPets = restingPets.filter(p => p.hearts > 0);
            trainingPoles = trainingPoles.map(p => (p && p.hearts <= 0) ? null : p);
            saveGameData();
            updateTeamCount();
        }

        setInterval(() => {
            let updated = false;
            trainingPoles.forEach((pet, idx) => {
                if (pet) { pet.level += 0.05; pet.atk += 0.2; updated = true; }
            });
            restingPets.forEach(pet => {
                if (pet && pet.hp < pet.maxHp) { pet.hp = Math.min(pet.maxHp, pet.hp + 5); updated = true; }
            });
            if (updated) { saveGameData(); }
        }, 3000);

        // --- TRANG TRẠI FULLSCREEN TƯƠNG TÁC ---
        function openFarmMenu() {
            checkPetSurvival();
            document.getElementById('fullscreen-farm-screen').classList.remove('hidden');
        }

        function closeFullscreenFarm() {
            document.getElementById('fullscreen-farm-screen').classList.add('hidden');
        }

        function showFarmSection(sectionType) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            if (sectionType === 'training') {
                let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-amber-300">🪵 Khu Luyện Tập Cọc Gỗ</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div><div class="space-y-2.5 max-h-72 overflow-y-auto">`;
                trainingPoles.forEach((pet, idx) => {
                    if (pet) {
                        html += `<div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-amber-500/50"><div class="flex items-center gap-2"><span class="text-2xl">${pet.emoji}</span><div class="text-xs font-bold">${pet.name} (Lv.${Math.floor(pet.level)})</div></div><button onclick="removeFromTraining(${idx}); closeModal(); openFarmMenu();" class="bg-red-600 text-xs px-2.5 py-1 rounded font-bold cursor-pointer">Rút về</button></div>`;
                    } else {
                        html += `<div class="bg-zinc-800/60 p-2.5 rounded-xl flex items-center justify-between border border-dashed border-zinc-600"><div class="text-xs text-zinc-300">Cọc gỗ trống #${idx + 1}</div><button onclick="closeModal(); showSelectPetForPole(${idx});" class="bg-amber-600 text-xs px-2.5 py-1 rounded font-bold cursor-pointer">Cho tập</button></div>`;
                    }
                });
                html += `</div>`;
                content.innerHTML = html;
            } else if (sectionType === 'resting') {

        function showSelectPetForPole(poleIdx) {
            if (farm.length === 0) { alert('⚠️ Trại không có linh thú nào!'); return; }
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-amber-300">Chọn thú lên cọc gỗ #${poleIdx + 1}</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div><div class="space-y-2 max-h-60 overflow-y-auto">`;
            farm.forEach((pet, idx) => {
                html += `<div onclick="assignPetToPole(${poleIdx}, ${idx})" class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between cursor-pointer border border-zinc-700 hover:border-amber-500"><div class="flex items-center gap-2"><span class="text-2xl">${pet.emoji}</span><div class="text-xs font-bold">${pet.name} (Lv.${Math.floor(pet.level)})</div></div><span class="text-xs text-amber-400 font-bold">Chọn ›</span></div>`;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        function assignPetToPole(poleIdx, farmIdx) {
            let pet = farm.splice(farmIdx, 1)[0];
            trainingPoles[poleIdx] = pet;
            saveGameData();
            closeModal();
            openFarmMenu();
        }

        function removeFromTraining(poleIdx) {
            let pet = trainingPoles[poleIdx];
            if (pet) { farm.push(pet); trainingPoles[poleIdx] = null; saveGameData(); }
        }

        function sendPetToRest(farmIdx) {
            let pet = farm.splice(farmIdx, 1)[0];
            restingPets.push(pet);
            saveGameData();
        }

        function removeFromRest(restingIdx) {
            let pet = restingPets.splice(restingIdx, 1)[0];
            farm.push(pet);
            saveGameData();
        }

        function moveToTeamFromFarm(farmIdx) {
            if (team.length >= 3) { alert('Đội hình chính đã đầy (3/3)!'); return; }
            team.push(farm.splice(farmIdx, 1)[0]);
            saveGameData();
            updateTeamCount();
        }

        // --- BỆNH VIỆN FULLSCREEN TƯƠNG TÁC ---
        function openHospitalMenu() {
            checkPetSurvival();
            document.getElementById('hospital-screen').classList.remove('hidden');
        }

        function closeHospitalMenu() {
            document.getElementById('hospital-screen').classList.add('hidden');
        }

        function openHospitalActionModal(actionType) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            if (actionType === 'heal') {
                let allPets = [...team, ...farm, ...restingPets, ...trainingPoles.filter(p => p !== null)];
                let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-cyan-400">❤️ Phục Hồi Tim (1000🪙) - Vàng: ${playerCoins}🪙</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div><div class="space-y-2.5 max-h-72 overflow-y-auto">`;
                if (allPets.length === 0) html += `<div class="text-center text-xs text-zinc-400 py-6">Không có linh thú nào!</div>`;
                else {
                    allPets.forEach(pet => {
                        let missingHearts = 3 - pet.hearts;
                        let heartsStr = '❤️'.repeat(pet.hearts) + '🖤'.repeat(missingHearts);
                        let canHeal = pet.hearts < 3;
                        html += `<div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-cyan-500/50"><div class="flex items-center gap-2"><span class="text-2xl">${pet.emoji}</span><div><div class="text-xs font-bold">${pet.name}</div><div class="text-[10px]">${heartsStr}</div></div></div>${canHeal ? `<button onclick="healPetHearts('${pet.name}')" class="bg-cyan-600 text-xs px-2.5 py-1 rounded font-bold cursor-pointer">Chữa (1000🪙)</button>` : `<span class="text-xs text-emerald-400 font-bold">Full ❤️</span>`}</div>`;
                    });
                }
                html += `</div>`;
                content.innerHTML = html;
            } else if (actionType === 'breed') {
                content.innerHTML = `
                <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-pink-400">🧬 Sinh Sản Lai Giống F1 (300🪙)</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>
                <div class="text-xs text-zinc-300 mb-3 text-center">Yêu cầu: 2 thú cùng loài, khác giới tính (Đực & Cái).</div>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="openSelectHospitalParentSlot(1)" class="bg-zinc-800 p-3 rounded-xl border border-pink-500/50 text-xs font-bold text-pink-300">Chọn Thú 1</button>
                    <button onclick="openSelectHospitalParentSlot(2)" class="bg-zinc-800 p-3 rounded-xl border border-pink-500/50 text-xs font-bold text-pink-300">Chọn Thú 2</button>
                </div>`;
            } else if (actionType === 'evolve') {
                let allPetsPool = [...team, ...farm];
                let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-amber-300">💎 Tiến Hóa Đá Ngũ Hành</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div><div class="text-[10px] text-yellow-300 mb-2">Kho đá: Kim:${inventory.stoneKim} | Mộc:${inventory.stoneMoc} | Thủy:${inventory.stoneThuy} | Hỏa:${inventory.stoneHoa} | Thổ:${inventory.stoneTho}</div><div class="space-y-2 max-h-60 overflow-y-auto">`;
                if (allPetsPool.length === 0) html += `<div class="text-center text-xs text-zinc-400 py-6">Không có linh thú!</div>`;
                else {
                    allPetsPool.forEach((pet, idx) => {
                        html += `<div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-amber-500/50"><div class="flex items-center gap-2"><span class="text-2xl">${pet.emoji}</span><div class="text-xs font-bold">${pet.name} (Lv.${Math.floor(pet.level)})</div></div><button onclick="evolvePetWithStone(${idx}); closeModal(); openHospitalMenu();" class="bg-amber-600 text-xs px-2.5 py-1 rounded font-bold cursor-pointer">Tiến Hóa (1 Đá)</button></div>`;
                    });
                }
                html += `</div>`;
                content.innerHTML = html;
            }
        }

        function healPetHearts(petName) {
            if (playerCoins < 1000) { alert('⚠️ Không đủ 1000 Vàng!'); return; }
            playerCoins -= 1000;
            team.forEach(p => { if (p.name === petName) p.hearts = 3; });
            farm.forEach(p => { if (p.name === petName) p.hearts = 3; });
            restingPets.forEach(p => { if (p.name === petName) p.hearts = 3; });
            saveGameData();
            alert(`🏥 Chữa trị thành công cho ${petName}!`);
            closeModal(); openHospitalMenu();
        }

        let hospitalBreedingSlots = { parent1: null, parent2: null };
        function openSelectHospitalParentSlot(slotNum) {
            let allPetsPool = [...team, ...farm];
            if (allPetsPool.length === 0) { alert('Không có linh thú!'); return; }
            const content = document.getElementById('modal-content');
            let html = `<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm text-pink-400">Chọn Thú Bố/Mẹ (${slotNum})</h3><button onclick="openHospitalActionModal('breed')" class="text-zinc-400 font-bold">‹ Quay lại</button></div><div class="space-y-2 max-h-60 overflow-y-auto">`;
            allPetsPool.forEach((pet, idx) => {
                html += `<div onclick="selectHospitalParentSlot(${slotNum}, ${idx})" class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between cursor-pointer border border-zinc-700 hover:border-pink-500"><div class="flex items-center gap-2"><span class="text-2xl">${pet.emoji}</span><div class="text-xs font-bold">${pet.name} (${pet.gender})</div></div><span class="text-xs text-pink-400 font-bold">Chọn ›</span></div>`;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        function selectHospitalParentSlot(slotNum, idx) {
            let allPetsPool = [...team, ...farm];
            let pet = allPetsPool[idx];
            if (slotNum === 1) hospitalBreedingSlots.parent1 = pet;
            else {
                if (!hospitalBreedingSlots.parent1) { alert('Chọn thú 1 trước!'); return; }
                if (hospitalBreedingSlots.parent1.emoji !== pet.emoji) { alert('Phải cùng loài!'); return; }
                if (hospitalBreedingSlots.parent1.gender === pet.gender) { alert('Phải khác giới tính!'); return; }
                hospitalBreedingSlots.parent2 = pet;
            }
            openHospitalActionModal('breed');
        }

        function evolvePetWithStone(idx) {
            let allPetsPool = [...team, ...farm];
            let pet = allPetsPool[idx];
            let stoneKeys = ['stoneKim', 'stoneMoc', 'stoneThuy', 'stoneHoa', 'stoneTho'];
            let availableStone = stoneKeys.find(k => inventory[k] > 0);
            if (!availableStone) { alert('⚠️ Bạn hết Đá Ngũ Hành trong kho!'); return; }
            inventory[availableStone]--;
            localStorage.setItem('ar_inventory', JSON.stringify(inventory));
            pet.level += 2; pet.atk += 25; pet.maxHp += 50; pet.hp = pet.maxHp;
            saveGameData();
            alert(`💎 Tiến hóa thành công cho ${pet.name}!`);
        }

        function initStaminaSystem() {
            setInterval(() => {
                let now = Date.now();
                let diffSec = Math.floor((now - lastStaminaTime) / 1000);
                let coolDownTime = 600;
                let remainingSec = Math.max(0, coolDownTime - diffSec);
                if (stamina < 15 && diffSec >= coolDownTime) {
                    stamina = Math.min(15, stamina + 1);
                    lastStaminaTime = now;
                    localStorage.setItem('ar_stamina', stamina);
                    localStorage.setItem('ar_stamina_time', lastStaminaTime);
                }
                let minStr = String(Math.floor(remainingSec / 60)).padStart(2, '0');
                let secStr = String(remainingSec % 60).padStart(2, '0');
                let countEl = document.getElementById('stamina-count');
                let timerEl = document.getElementById('stamina-timer');
                if (countEl) countEl.innerText = stamina;
                if (timerEl) timerEl.innerText = stamina >= 15 ? 'MAX' : `${minStr}:${secStr}`;
            }, 1000);
            let coinEl = document.getElementById('coin-count');
            if (coinEl) coinEl.innerText = playerCoins;
        }

        function openWorldBossMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            let canFight = team.length === 3;
            content.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-amber-400">👹 Hắc Long Vương (Cấp ${bossLevel})</h3><button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button></div><div class="flex flex-col items-center bg-zinc-800 p-4 rounded-2xl border border-amber-500/40 mb-4 text-center"><div class="text-6xl mb-2">🐉🔥</div><div class="font-bold text-base text-yellow-300">Yêu cầu: Đội hình đủ 3 linh thú! (${team.length}/3)</div></div>${canFight ? `<button onclick="startBattle('boss')" class="w-full bg-amber-600 hover:bg-amber-500 py-3 rounded-xl font-bold text-xs cursor-pointer shadow-lg">⚔️ Xuất Trận Đánh Boss</button>` : `<div class="text-center text-xs text-red-400 font-bold bg-red-950/50 p-3 rounded-xl border border-red-500/50">⚠️ Đội hình chưa đủ 3 linh thú!</div>`}`;
        }

        function openQuestMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-yellow-300">📜 Nhiệm Vụ Hằng Ngày</h3><button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button></div><div class="space-y-3 max-h-80 overflow-y-auto">`;
            dailyQuests.forEach((q, idx) => {
                let isCompleted = q.progress >= q.target;
                let btnHtml = q.claimed ? `<span class="text-xs text-zinc-500 font-bold">Đã nhận</span>` : isCompleted ? `<button onclick="claimQuest(${idx})" class="bg-emerald-600 px-3 py-1 rounded text-xs font-bold cursor-pointer">Nhận Thưởng</button>` : `<span class="text-xs text-zinc-400">${q.progress}/${q.target}</span>`;
                html += `<div class="bg-zinc-800 p-3 rounded-xl border border-zinc-700 flex items-center justify-between"><div><div class="font-bold text-xs text-yellow-200">${q.title}</div><div class="text-[10px] text-zinc-400">Thưởng: ${q.reward}🪙</div></div><div>${btnHtml}</div></div>`;
            });
            html += `</div>`; content.innerHTML = html;
        }

        function claimQuest(idx) {
            let q = dailyQuests[idx];
            if (q.claimed || q.progress < q.target) return;
            q.claimed = true; playerCoins += q.reward; saveGameData();
            alert(`🎉 Nhận ${q.reward} Vàng!`); openQuestMenu();
        }

        function addQuestProgress(questId, amount = 1) {
            let q = dailyQuests.find(item => item.id === questId);
            if (q && !q.claimed) {
                q.progress = Math.min(q.target, q.progress + amount);
                localStorage.setItem('ar_quests', JSON.stringify(dailyQuests));
            }
        }

        function openMarketMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-amber-300">🛒 Chợ Đen & Vật Phẩm</h3><button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button></div><div class="text-xs text-yellow-400 font-bold mb-3">💰 Vàng: ${playerCoins} 🪙</div><div class="space-y-2.5 max-h-96 overflow-y-auto pr-1"><div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between"><div class="text-xs">⚡ Năng Lượng x5 (500🪙)</div><button onclick="buyShopItem('stamina', 500, 5)" class="bg-amber-600 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button></div><div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between"><div class="text-xs">🍖 Thức Ăn (50🪙) [Kho: ${inventory.food}]</div><button onclick="buyShopItem('food', 50, 1)" class="bg-amber-600 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button></div><div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between"><div class="text-xs">🎾 Đồ Chơi (50🪙) [Kho: ${inventory.toy}]</div><button onclick="buyShopItem('toy', 50, 1)" class="bg-amber-600 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button></div><div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between"><div class="text-xs">🏋️ Dụng Cụ Tập (100🪙) [Kho: ${inventory.trainer}]</div><button onclick="buyShopItem('trainer', 100, 1)" class="bg-amber-600 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button></div></div>`;
        }

        function buyShopItem(itemKey, price, qty) {
            if (playerCoins < price) { alert('Không đủ vàng!'); return; }
            playerCoins -= price; saveGameData();
            if (itemKey === 'stamina') { stamina = Math.min(15, stamina + qty); localStorage.setItem('ar_stamina', stamina); document.getElementById('stamina-count').innerText = stamina; }
            else { inventory[itemKey] = (inventory[itemKey] || 0) + qty; localStorage.setItem('ar_inventory', JSON.stringify(inventory)); }
            alert('🛒 Mua thành công!'); openMarketMenu();

        function openTeamMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');

            modal.classList.remove('hidden');
            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🎒 Đội Hình (${team.length}/3)</h3><button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button></div>`;

            let heartsStr = '❤️'.repeat(pet.hearts);
            const content = document.getElementById('modal-content');
            content.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🐾 Trang Cá Nhân</h3><button onclick="openTeamMenu()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">‹ Quay lại</button></div><div class="flex flex-col items-center bg-zinc-800 p-4 rounded-2xl border ${pet.rarity.bg} mb-4 text-center"><div class="text-6xl mb-2">${pet.emoji}</div><div class="text-base font-bold text-yellow-300">${pet.name} (${pet.gender}) - <span class="${pet.rarity.color}">${pet.rarity.badge}</span></div><div class="text-sm mt-1">Trái tim: ${heartsStr}</div><div class="w-full space-y-2 mt-3 text-left text-xs bg-zinc-900/80 p-3 rounded-xl border border-zinc-700"><div><div class="flex justify-between mb-1"><span>Máu (HP):</span><span class="font-bold text-emerald-400">${Math.floor(pet.hp)} / ${pet.maxHp}</span></div><div class="w-full bg-zinc-800 rounded-full h-2 overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${(pet.hp/pet.maxHp)*100}%"></div></div></div><div><div class="flex justify-between mb-1"><span>Độ no:</span><span class="font-bold text-yellow-400">${pet.hunger}%</span></div><div class="w-full bg-zinc-800 rounded-full h-2 overflow-hidden"><div class="bg-yellow-500 h-full" style="width: ${pet.hunger}%"></div></div></div></div><div class="w-full grid grid-cols-2 gap-2 mt-3 text-xs bg-zinc-900/80 p-3 rounded-xl border border-zinc-700 text-left"><div>⚔️ ATK: <span class="font-bold text-red-400">${Math.floor(pet.atk)}</span></div><div>💥 Chí mạng: <span class="font-bold text-blue-400">${pet.critRate ?? 20}%</span></div></div></div><div class="grid grid-cols-3 gap-2 text-center"><button onclick="petAction(${index}, 'feed')" class="bg-emerald-600 p-2 rounded font-bold text-xs cursor-pointer">🍖 Ăn (${inventory.food})</button><button onclick="petAction(${index}, 'play')" class="bg-amber-600 p-2 rounded font-bold text-xs cursor-pointer">🎾 Chơi (${inventory.toy})</button><button onclick="petAction(${index}, 'train')" class="bg-indigo-600 p-2 rounded font-bold text-xs cursor-pointer">🏋️ Tập (${inventory.trainer})</button></div>`;

        function petAction(index, action) {
            let pet = team[index];
            if (action === 'feed') {
                if (inventory.food <= 0) { alert('Hết thức ăn!'); return; }
                inventory.food--; pet.hunger = Math.min(100, pet.hunger + 30); pet.hp = Math.min(pet.maxHp, pet.hp + 25); addQuestProgress(3, 1);
            } else if (action === 'play') {
                if (inventory.toy <= 0) { alert('Hết đồ chơi!'); return; }
                inventory.toy--; pet.happiness = Math.min(100, pet.happiness + 35);
            } else if (action === 'train') {
                if (inventory.trainer <= 0) { alert('Hết dụng cụ!'); return; }
                inventory.trainer--; pet.level++; pet.atk += 10; pet.maxHp += 20; pet.hp = pet.maxHp;
            }
            localStorage.setItem('ar_inventory', JSON.stringify(inventory));
            saveGameData(); openPetDetail(index);
        }

        function openTowerMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🗼 Tháp Vô Tận (Tầng ${towerFloor})</h3><button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button></div><button onclick="startBattle('tower')" class="w-full bg-purple-600 py-3 rounded-xl font-bold text-xs cursor-pointer shadow-lg">⚔️ Thách Đấu Tầng ${towerFloor}</button>`;
        }

        function openArenaMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">⚔️ Đấu Trường PvP</h3><button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button></div><button onclick="startBattle('arena')" class="w-full bg-red-600 py-3 rounded-xl font-bold text-xs cursor-pointer shadow-lg">⚔️ Tìm Trận Đấu</button>`;
        }

        let map, userMarker, activeMarkers = [];
        let userLat = 10.0452, userLng = 105.7469;

        function initMap() {
            if (map) return;
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userLat = position.coords.latitude; userLng = position.coords.longitude;
                    if (map) { map.setView([userLat, userLng], 17); map.invalidateSize(); }
                    if (userMarker) userMarker.setLatLng([userLat, userLng]);
                    spawnMultipleMonsters();
                }, error => { if (map) map.invalidateSize(); }, { enableHighAccuracy: true });
            }
            map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            const userIcon = L.divIcon({ className: 'leaflet-div-icon', html: '<div style="font-size: 28px;">📍</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
            userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);
            spawnMultipleMonsters();
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        function recenterMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userLat = position.coords.latitude; userLng = position.coords.longitude;
                    if (map) { map.setView([userLat, userLng], 17); map.invalidateSize(); }
                    if (userMarker) userMarker.setLatLng([userLat, userLng]);
                });
            } else if (map) { map.setView([userLat, userLng], 17); map.invalidateSize(); }
        }

        function spawnMultipleMonsters() {
            if (!map) return;
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];
            for (let i = 0; i < 6; i++) {
                const baseTemplate = allMonsters[Math.floor(Math.random() * allMonsters.length)];
                let rarity = getRandomRarity();
                let multi = rarity.statMultiplier;
                const monsterData = {
                    ...baseTemplate, rarity: rarity, hearts: 3,
                    hp: Math.floor(baseTemplate.hp * multi), maxHp: Math.floor(baseTemplate.maxHp * multi),
                    atk: Math.floor(baseTemplate.atk * multi),
                    lat: userLat + (Math.random() - 0.5) * 0.003, lng: userLng + (Math.random() - 0.5) * 0.003
                };
                const monsterIcon = L.divIcon({ className: 'leaflet-div-icon', html: `<div style="font-size: 36px;" title="${rarity.badge}">${monsterData.emoji}</div>`, iconSize: [38, 38], iconAnchor: [19, 19] });
                const marker = L.marker([monsterData.lat, monsterData.lng], { icon: monsterIcon }).addTo(map);
                marker.on('click', () => {
                    if (stamina <= 0) { alert('⚡ Hết Năng Lượng!'); return; }
                    currentWildMonster = monsterData; enterARScreen();
                });
                activeMarkers.push(marker);
            }
        }

        let canvas, ctx, isARActive = false;
        let rope = { x: 0, y: 0, vx: 0, vy: 0, flying: false, flightTime: 0 };
        let monsterPos = { x: 0, y: 0, vx: 1.5, vy: 1 };
        let isTugOfWarActive = false, tugProgress = 50, tugTimerInterval = null;
        let ropeShakeTimer = 0;

        function enterARScreen() {
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('ar-screen').classList.remove('hidden');
            isARActive = true; isTugOfWarActive = false;
            document.getElementById('tug-of-war-ui').classList.add('hidden');
            document.getElementById('ar-mon-info').innerHTML = `${currentWildMonster.emoji} ${currentWildMonster.name} <span class="${currentWildMonster.rarity.color}">${currentWildMonster.rarity.badge}</span>`;
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
                document.getElementById('camera-feed').srcObject = stream;
            }).catch(e => {});
            initCanvasGame();
        }

        function exitARScreen() {
            isARActive = false; isTugOfWarActive = false;
            if (tugTimerInterval) clearInterval(tugTimerInterval);
            const videoEl = document.getElementById('camera-feed');
            if (videoEl.srcObject) videoEl.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('ar-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if(map) map.invalidateSize();
        }

        function initCanvasGame() {
            canvas = document.getElementById('gameCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            monsterPos.x = canvas.width / 2; monsterPos.y = canvas.height * 0.3;
            resetRope();
            canvas.onpointerdown = () => {
                if (isTugOfWarActive) {
                    tugProgress = Math.min(100, tugProgress + 12);
                    document.getElementById('tug-progress-bar').style.width = tugProgress + '%';
                    if (tugProgress >= 100) triggerTugWin();
                }
            };
            canvas.onpointerup = (e) => {
                if (isTugOfWarActive || rope.flying) return;
                if (stamina > 0) { stamina--; localStorage.setItem('ar_stamina', stamina); }
                rope.vx = (e.clientX - rope.x) * 0.12; rope.vy = (e.clientY - rope.y) * 0.12;
                rope.flying = true; rope.flightTime = 0;
            };
            requestAnimationFrame(updateCanvasGame);
        }

        function resetRope() { rope.x = canvas.width / 2; rope.y = canvas.height * 0.85; rope.flying = false; rope.flightTime = 0; }

        function updateCanvasGame() {
            if (!isARActive || !ctx || !canvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ropeShakeTimer += 0.2;
            let shakeOffset = isTugOfWarActive ? Math.sin(ropeShakeTimer * 3) * 12 : 0;
            if (!isTugOfWarActive) {
                monsterPos.x += monsterPos.vx;
                if (monsterPos.x < 50 || monsterPos.x > canvas.width - 50) monsterPos.vx *= -1;
            }
            ctx.font = "75px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(currentWildMonster.emoji, monsterPos.x, monsterPos.y + shakeOffset);
            if (rope.flying) {
                rope.x += rope.vx; rope.y += rope.vy; rope.flightTime++;
                ctx.beginPath(); ctx.moveTo(canvas.width / 2, canvas.height * 0.85); ctx.lineTo(rope.x, rope.y);
                ctx.strokeStyle = "#d4a373"; ctx.lineWidth = 4; ctx.stroke();
                if (Math.hypot(rope.x - monsterPos.x, rope.y - monsterPos.y) < 60) {
                    rope.flying = false; startTugOfWarSession();
                } else if (rope.flightTime > 40 || rope.x < 0 || rope.x > canvas.width || rope.y < 0) {
                    resetRope();
                }
            }
            if (isTugOfWarActive) {
                ctx.beginPath(); ctx.moveTo(canvas.width / 2, canvas.height * 0.85); ctx.lineTo(monsterPos.x, monsterPos.y + shakeOffset);
                ctx.strokeStyle = "#eab308"; ctx.lineWidth = 6; ctx.stroke();
                ctx.font = "40px sans-serif"; ctx.fillText("🪢", rope.x, rope.y + shakeOffset);
            }
            requestAnimationFrame(updateCanvasGame);
        }

        function startTugOfWarSession() {
            isTugOfWarActive = true; tugProgress = 50;
            document.getElementById('tug-progress-bar').style.width = '50%';
            document.getElementById('tug-of-war-ui').classList.remove('hidden');
            if (tugTimerInterval) clearInterval(tugTimerInterval);
            tugTimerInterval = setInterval(() => {
                if (!isARActive || !isTugOfWarActive) { clearInterval(tugTimerInterval); return; }
                tugProgress -= 1.5;
                document.getElementById('tug-progress-bar').style.width = Math.max(0, tugProgress) + '%';
                if (tugProgress >= 100) triggerTugWin();
                else if (tugProgress <= 0) {
                    clearInterval(tugTimerInterval); isTugOfWarActive = false;
                    document.getElementById('tug-of-war-ui').classList.add('hidden');
                    exitARScreen();
                }
            }, 50);
        }

        function triggerTugWin() {
            if (!isTugOfWarActive) return;
            isTugOfWarActive = false; clearInterval(tugTimerInterval);
            document.getElementById('tug-of-war-ui').classList.add('hidden');
            exitARScreen();
            let multi = currentWildMonster.rarity.statMultiplier || 1.0;
            let newPet = {
                ...currentWildMonster, level: 1, hearts: 3, gender: Math.random() < 0.5 ? 'Đực' : 'Cái',
                critRate: Math.floor(15 + Math.random() * 20 * multi), dodgeRate: Math.floor(10 + Math.random() * 15 * multi),
                accuracy: Math.floor(85 + Math.random() * 10), blockRate: Math.floor(10 + Math.random() * 20 * multi),
                slowResist: Math.floor(10 + Math.random() * 15), speed: Math.floor(40 + Math.random() * 30 * multi),
                trait: possibleTraits[Math.floor(Math.random() * possibleTraits.length)], hunger: 100, happiness: 100
            };
            if (team.length < 3) { team.push(newPet); saveGameData(); alert(`🎉 Bắt thành công ${newPet.name}! Đã đưa vào Đội.`); }
            else { farm.push(newPet); saveGameData(); alert(`🎉 Đội đầy, đã chuyển ${newPet.name} vào Trại!`); }
            addQuestProgress(1, 1); updateTeamCount(); spawnMultipleMonsters();
        }

        let battleCanvas, battleCtx, battleInterval;
        function startBattle(mode) {
            checkPetSurvival();
            if (team.length === 0) { alert('Đội hình trống!'); return; }
            if (mode === 'boss' && team.length < 3) { alert('⚠️ Boss yêu cầu đủ 3 linh thú!'); return; }
            closeModal();
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            switchGameMusic('battle');
            let activeTeam = mode === 'boss' ? [...team] : [team[0]];
            let teamHpList = activeTeam.map(p => p.hp);
            let teamMaxHpTotal = activeTeam.reduce((sum, p) => sum + p.maxHp, 0);
            let enemy = mode === 'boss' ? { name: `Hắc Long Vương (Lv.${bossLevel})`, emoji: '🐉', hp: 300 + (bossLevel * 100), maxHp: 300 + (bossLevel * 100), atk: 30 + (bossLevel * 8) } :
                        mode === 'tower' ? { name: `Thủ Vệ Tầng ${towerFloor}`, emoji: '👹', hp: 120 + (towerFloor * 25), maxHp: 120 + (towerFloor * 25), atk: 20 + towerFloor * 4 } :
                        { name: 'Đối Thủ PvP', emoji: '🤖', hp: 160, maxHp: 160, atk: 25 };
            let enemyHp = enemy.hp;
            document.getElementById('battle-enemy-name').innerText = enemy.name;
            battleCanvas = document.getElementById('battleCanvas');
            battleCtx = battleCanvas.getContext('2d');
            battleCanvas.width = battleCanvas.clientWidth; battleCanvas.height = battleCanvas.clientHeight;
            let angle = 0, battleStep = 0, state = 'circle';
            battleInterval = setInterval(() => {
                battleCtx.clearRect(0, 0, battleCanvas.width, battleCanvas.height);
                battleStep++;
                // ĐIỀU CHỈNH TỌA ĐỘ TRUNG TÂM SÀN ĐẤU (XUỐNG ĐÚNG VỊ TRÍ ĐẸP TRÊN BACKGROUND)
                let cx = battleCanvas.width / 2, cy = battleCanvas.height * 0.6;
                let myCenterX = cx - 75, myCenterY = cy, enX = cx + 75, enY = cy;

                if (state === 'circle') {
                    angle += 0.08;
                    myCenterX = cx + Math.cos(angle) * 55 - 65; myCenterY = cy + Math.sin(angle) * 25;
                    enX = cx + Math.cos(angle + Math.PI) * 55 + 65; enY = cy + Math.sin(angle + Math.PI) * 25;
                    if (battleStep > 40) { state = 'charge'; battleStep = 0; }
                } else if (state === 'charge') {
                    myCenterX = cx - 30; enX = cx + 30; myCenterY = cy; enY = cy;
                    if (battleStep > 12) {
                        let totalDmg = 0;
                        activeTeam.forEach((pet, i) => { if (teamHpList[i] > 0) totalDmg += Math.floor(pet.atk * (0.7 + Math.random() * 0.3)); });
                        enemyHp -= totalDmg;
                        let enDmg = Math.floor(enemy.atk * (0.7 + Math.random() * 0.3));
                        let targetIdx = teamHpList.findIndex(h => h > 0);
                        if (targetIdx !== -1) { teamHpList[targetIdx] -= enDmg; activeTeam[targetIdx].hp = Math.max(0, teamHpList[targetIdx]); }
                        document.getElementById('battle-log').innerText = `Đội gây -${totalDmg} dmg | Địch phản -${enDmg} dmg!`;
                        state = 'circle'; battleStep = 0;
                    }
                }
                let currentTeamHpTotal = teamHpList.reduce((a, b) => Math.max(0, a) + Math.max(0, b), 0);
                let teamHpPercent = Math.max(0, (currentTeamHpTotal / teamMaxHpTotal) * 100);
                let enemyHpPercent = Math.max(0, (enemyHp / enemy.maxHp) * 100);
                document.getElementById('battle-team-hp-bar').style.width = teamHpPercent + '%';
                document.getElementById('battle-team-hp-text').innerText = `HP: ${currentTeamHpTotal}/${teamMaxHpTotal}`;
                document.getElementById('battle-enemy-hp-bar').style.width = enemyHpPercent + '%';
                document.getElementById('battle-enemy-hp-text').innerText = `HP: ${Math.max(0, enemyHp)}/${enemy.maxHp}`;
                battleCtx.font = "65px sans-serif"; battleCtx.textAlign = "center"; battleCtx.fillText(enemy.emoji, enX, enY);
                activeTeam.forEach((pet, i) => {
                    if (teamHpList[i] > 0) {
                        let posY = myCenterY + (i - 1) * 40;
                        battleCtx.font = "50px sans-serif"; battleCtx.fillText(pet.emoji, myCenterX, posY);
                    }
                });
                let allTeamDead = teamHpList.every(h => h <= 0);
                if (enemyHp <= 0 || allTeamDead) {
                    clearInterval(battleInterval);
                    if (enemyHp <= 0) {
                        let rewardGold = mode === 'boss' ? 700 + (bossLevel * 200) : mode === 'tower' ? 300 + (towerFloor * 50) : 350;
                        playerCoins += rewardGold; saveGameData(); addQuestProgress(2, 1);
                        if (mode === 'tower') { towerFloor++; localStorage.setItem('ar_tower_floor', towerFloor); }
                        else if (mode === 'boss') { bossLevel++; localStorage.setItem('ar_boss_level', bossLevel); }
                        alert(`🏆 Chiến thắng! Nhận +${rewardGold} Vàng!`);
                    } else {
                        activeTeam.forEach(pet => {
                            pet.hearts--;
                            if (pet.hearts <= 0) alert(`💀 Thú ${pet.name} đã tử trận!`);
                            else alert(`💔 Thú ${pet.name} mất 1 ❤️! Còn ${pet.hearts} ❤️.`);
                        });
                        team = team.filter(p => p.hearts > 0); saveGameData();
                        alert('💀 Thất bại!');
                    }
                    exitBattleScreen();
                }
            }, 25);
        }

        function exitBattleScreen() {
            switchGameMusic('map');
            if (battleInterval) clearInterval(battleInterval);
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if (map) map.invalidateSize();
        }

        function updateTeamCount() {
            let countEl = document.getElementById('team-count');
            if (countEl) countEl.innerText = team.length;
        }

        window.onload = () => {
            initMap(); initStaminaSystem(); updateTeamCount();
            setTimeout(() => { if(map) map.invalidateSize(); }, 400);
        };
        window.onresize = () => { if (map) setTimeout(() => map.invalidateSize(), 200); };
    </script>
</body>
</html>
