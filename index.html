<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Monster - Survival & Elemental PvP v2.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        #map { height: 100%; width: 100%; border-radius: 1rem; z-index: 10; }
        .leaflet-control-attribution { display: none !important; }
        @keyframes petBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .pet-animate { animation: petBounce 2s ease-in-out infinite; }
        @keyframes floatText { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }
        .damage-popup { animation: floatText 0.7s ease-out forwards; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- QUẢN LÝ PHIÊN BẢN & AUTO UPDATE -->
    <script>
        const APP_VERSION = '2.9'; 

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }

        async function forceAutoUpdate() {
            try {
                const response = await fetch(window.location.pathname + '?v=' + APP_VERSION + '&t=' + new Date().getTime(), { cache: 'no-store' });
                const text = await response.text();
                const match = text.match(/const APP_VERSION = '([^']+)'/);
                if (match && match[1] && match[1] !== APP_VERSION) {
                    window.location.reload(true);
                }
            } catch (e) {}
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallPromptBanner();
        });

        window.addEventListener('load', () => {
            forceAutoUpdate();
            setTimeout(() => {
                const banner = document.getElementById('pwa-install-banner');
                if (banner) banner.classList.remove('hidden');
            }, 1000);
        });

        function showInstallPromptBanner() {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.classList.remove('hidden');
        }

        function installPWAApp() {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.classList.add('hidden');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => { deferredPrompt = null; });
            } else {
                alert('Mẹo: Bấm menu trình duyệt chọn "Thêm vào màn hình chính" (Add to Home Screen) để cài app!');
            }
        }
    </script>

    <!-- BANNER CÀI ĐẶT APP -->
    <div id="pwa-install-banner" class="hidden absolute top-3 inset-x-3 z-50 bg-amber-600 border border-amber-400 p-3 rounded-2xl shadow-2xl flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-2xl">📱</span>
            <div>
                <div class="font-bold text-xs">Cài đặt AR Monster ra màn hình chính?</div>
                <div class="text-[10px] text-amber-100">Vào game mượt mà như ứng dụng độc lập!</div>
            </div>
        </div>
        <div class="flex gap-1.5">
            <button onclick="installPWAApp()" class="bg-black px-3 py-1.5 rounded-xl font-bold text-xs shadow">Tải ngay</button>
            <button onclick="document.getElementById('pwa-install-banner').classList.add('hidden')" class="bg-amber-900 px-2.5 py-1.5 rounded-xl font-bold text-xs">✕</button>
        </div>
    </div>

    <!-- MÀN HÌNH BẢN ĐỒ GPS & TIỆN ÍCH -->
    <div id="map-screen" class="absolute inset-0 z-20 flex flex-col justify-between bg-zinc-950 p-3">
        <div class="flex justify-between items-center z-30 pt-1">
            <div class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-2">
                <span id="weather-icon" class="text-base">☀️</span>
                <span id="weather-status" class="text-xs font-medium">Trời quang</span>
            </div>
            <div class="flex gap-1 overflow-x-auto py-1">
                <button onclick="openMarketMenu()" class="bg-amber-600/90 px-2.5 py-1 rounded-full border border-amber-400 text-[11px] font-bold shadow">🛒 Chợ</button>
                <button onclick="openArenaMenu()" class="bg-red-600/90 px-2.5 py-1 rounded-full border border-red-400 text-[11px] font-bold shadow">⚔️ Đấu PvP</button>
                <button onclick="openFarmMenu()" class="bg-emerald-600/90 px-2.5 py-1 rounded-full border border-emerald-400 text-[11px] font-bold shadow">🏡 Trại</button>
                <button onclick="openEggsMenu()" class="bg-black/80 px-2.5 py-1 rounded-full border border-white/20 text-[11px] font-bold">🥚(<span id="egg-steps-count">0</span>)</button>
                <button onclick="openTeamMenu()" class="bg-black/80 px-2.5 py-1 rounded-full border border-white/20 text-[11px] font-bold">🎒(<span id="team-count">0</span>/3)</button>
                <button onclick="openPokedexMenu()" class="bg-black/80 px-2 py-1 rounded-full border border-white/20 text-[11px] font-bold">📖</button>
            </div>
        </div>

        <div class="absolute inset-0 pt-16 pb-24 px-3">
            <div id="map" class="shadow-2xl border border-zinc-800"></div>
            <button onclick="recenterMap()" class="absolute bottom-28 right-6 z-30 bg-blue-600 hover:bg-blue-500 text-white p-3.5 rounded-full shadow-2xl border border-blue-400 active:scale-95 transition-transform flex items-center justify-center text-xl" title="Về vị trí của tôi">
                📍

        </div>

        <div class="flex flex-col items-center z-30 pb-2">

            </div>
            <button onclick="spawnMultipleMonsters()" class="w-full max-w-sm bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2.5 rounded-2xl border border-zinc-700 shadow-xl transition-all text-xs">
                🔄 Quét lại khu vực (Tìm thú & Người chơi)
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH MINIGAME CANVAS CAO BỒI BẮT THÚ -->
    <div id="ar-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-900">
        <div class="absolute inset-0 z-0 overflow-hidden">

            <div id="ar-mon-info" class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-yellow-300">
                Mục tiêu: Đang tải...

        </div>

            <div class="text-[11px] text-zinc-300 mt-1 bg-black/60 px-3 py-1 rounded-full border border-white/10">🤠 Vuốt ngón tay hướng lên trên để quăng vòng dây thừng!</div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẤU TRƯỜNG PVP REALTIME -->
    <div id="battle-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-950 p-4">
        <div class="flex justify-between items-center z-20">
            <div id="battle-title-tag" class="bg-red-600/90 px-4 py-1.5 rounded-full font-bold text-xs border border-red-400">⚔️ PVP REALTIME V2.9</div>
            <button onclick="exitBattleScreen()" class="bg-black/80 px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold">Rút lui</button>
        </div>
        <div class="relative flex-1 my-4 bg-gradient-to-b from-amber-950/80 via-zinc-900 to-zinc-950 rounded-2xl border-2 border-amber-500/60 overflow-hidden flex flex-col items-center justify-center shadow-2xl">
            <canvas id="battleCanvas" class="absolute inset-0 w-full h-full"></canvas>
            <div id="damage-popup-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            <div id="battle-log" class="absolute bottom-4 bg-black/90 px-5 py-2.5 rounded-xl text-xs text-yellow-300 font-bold border border-yellow-500/50 text-center max-w-sm shadow-xl">
                Đang chuẩn bị giao tranh...
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY CHUNG -->
    <div id="modal-container" class="hidden absolute inset-0 z-40 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
    <script>
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let farm = JSON.parse(localStorage.getItem('ar_farm') || '[]');
        let pokedex = JSON.parse(localStorage.getItem('ar_pokedex') || '[]');
        let eggSteps = parseInt(localStorage.getItem('ar_egg_steps') || '0');
        let playerCoins = parseInt(localStorage.getItem('ar_coins') || '500');

        let stamina = parseInt(localStorage.getItem('ar_stamina') || '15');
        let lastStaminaTime = parseInt(localStorage.getItem('ar_stamina_time') || Date.now());

        let inventory = JSON.parse(localStorage.getItem('ar_inventory') || JSON.stringify({ food: 5, toy: 5, trainer: 3, meat: 0, stoneKim: 0, stoneMoc: 0, stoneThuy: 0, stoneHoa: 0, stoneTho: 0 }));
        let currentWeather = { name: 'Trời quang', icon: '☀️', effect: 'ATK +10%', buffAtk: 1.1 };

        const elements = [
            { name: 'Kim', icon: '⚔️', color: 'text-yellow-300' },
            { name: 'Mộc', icon: '🌿', color: 'text-emerald-400' },
            { name: 'Thủy', icon: '💧', color: 'text-blue-400' },
            { name: 'Hỏa', icon: '🔥', color: 'text-red-500' },
            { name: 'Thổ', icon: '🪨', color: 'text-amber-600' }
        ];

        function checkElementAdvantage(attackerElem, defenderElem) {
            if (!attackerElem || !defenderElem) return false;
            let rules = { 'Kim': 'Mộc', 'Mộc': 'Thổ', 'Thổ': 'Thủy', 'Thủy': 'Hỏa', 'Hỏa': 'Kim' };
            return rules[attackerElem] === defenderElem;
        }

        const categories = {
            'Gia cầm': [
                { id: 101, name: 'Gà Ta', emoji: '🐔', cp: 120, hp: 60, maxHp: 60, atk: 70, level: 1, rarePrice: 100, attackType: 'melee' },
                { id: 102, name: 'Vịt Cỏ', emoji: '🦆', cp: 110, hp: 55, maxHp: 55, atk: 65, level: 1, rarePrice: 90, attackType: 'magic' },
                { id: 103, name: 'Ngỗng Trắng', emoji: '🦢', cp: 140, hp: 80, maxHp: 80, atk: 85, level: 1, rarePrice: 130, attackType: 'charge' },
                { id: 104, name: 'Ngan Đen', emoji: '🦃', cp: 130, hp: 75, maxHp: 75, atk: 80, level: 1, rarePrice: 120, attackType: 'melee' }
            ],
            'Gia súc': [
                { id: 201, name: 'Chó Vàng', emoji: '🐕', cp: 145, hp: 80, maxHp: 80, atk: 90, level: 1, rarePrice: 150, attackType: 'melee' },
                { id: 202, name: 'Mèo Mướp', emoji: '🐈', cp: 135, hp: 70, maxHp: 70, atk: 95, level: 1, rarePrice: 140, attackType: 'magic' },
                { id: 203, name: 'Heo Ủn Ỉn', emoji: '🐖', cp: 150, hp: 100, maxHp: 100, atk: 75, level: 1, rarePrice: 160, attackType: 'charge' },
                { id: 204, name: 'Bò Sữa', emoji: '🐂', cp: 180, hp: 120, maxHp: 120, atk: 110, level: 1, rarePrice: 200, attackType: 'melee' }
            ],
            'Tự nhiên': [
                { id: 301, name: 'Chuột Nước', emoji: '🐹', cp: 110, hp: 60, maxHp: 60, atk: 65, level: 1, rarePrice: 110, attackType: 'magic' },
                { id: 302, name: 'Chim Lửa', emoji: '🐦', cp: 185, hp: 50, maxHp: 50, atk: 140, level: 1, rarePrice: 250, attackType: 'magic' },
                { id: 303, name: 'Cáo Đỏ', emoji: '🦊', cp: 160, hp: 65, maxHp: 65, atk: 115, level: 1, rarePrice: 180, attackType: 'charge' },
                { id: 304, name: 'Sói Xám', emoji: '🐺', cp: 175, hp: 90, maxHp: 90, atk: 125, level: 1, rarePrice: 220, attackType: 'melee' }
            ],
            'Sách đỏ': [
                { id: 401, name: 'Rồng Nước', emoji: '🐉', cp: 250, hp: 150, maxHp: 150, atk: 180, level: 1, rarePrice: 500, attackType: 'magic' },
                { id: 402, name: 'Phượng Hoàng', emoji: '🦅', cp: 270, hp: 140, maxHp: 140, atk: 195, level: 1, rarePrice: 600, attackType: 'magic' },
                { id: 403, name: 'Kỳ Lân', emoji: '🦄', cp: 260, hp: 160, maxHp: 160, atk: 175, level: 1, rarePrice: 550, attackType: 'charge' }
            ]
        };

        const allMonsters = Object.values(categories).flat();
        let currentWildMonster = null;
        let catchAttempts = 0;

        function saveInventory() { localStorage.setItem('ar_inventory', JSON.stringify(inventory)); }

        // Kiểm tra và loại bỏ thú đã chết (HP hoặc Độ no bằng 0)
        function checkPetSurvival() {
            team = team.filter(p => p.hp > 0 && (p.hunger !== undefined ? p.hunger > 0 : true));
            farm = farm.filter(p => p.hp > 0 && (p.hunger !== undefined ? p.hunger > 0 : true));
            localStorage.setItem('ar_team', JSON.stringify(team));
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            updateTeamCount();
        }

        // --- NĂNG LƯỢNG ---
        function initStaminaSystem() {
            setInterval(() => {
                let now = Date.now();
                let diffSec = Math.floor((now - lastStaminaTime) / 1000);
                let rechargeInterval = 10 * 60;

                if (stamina < 15) {
                    let addedStamina = Math.floor(diffSec / rechargeInterval);
                    if (addedStamina > 0) {
                        stamina = Math.min(15, stamina + addedStamina);
                        lastStaminaTime = now - (diffSec % rechargeInterval) * 1000;
                        localStorage.setItem('ar_stamina', stamina);
                        localStorage.setItem('ar_stamina_time', lastStaminaTime);
                    }
                } else {
                    lastStaminaTime = now;
                    localStorage.setItem('ar_stamina_time', lastStaminaTime);
                }

                let nextRechargeTime = rechargeInterval - (Math.floor((now - lastStaminaTime) / 1000) % rechargeInterval);
                let m = Math.floor(nextRechargeTime / 60);
                let s = nextRechargeTime % 60;
                document.getElementById('stamina-count').innerText = stamina;
                document.getElementById('stamina-timer').innerText = stamina >= 15 ? 'MAX' : `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        // --- THỜI TIẾT & ẤP TRỨNG ---
        function initWeather() {
            const weathers = [
                { name: 'Trời quang', icon: '☀️', effect: 'ATK +10%', buffAtk: 1.1 },
                { name: 'Mưa dông', icon: '🌧️', effect: 'HP +15%', buffAtk: 1.0 },
                { name: 'Sương mù', icon: '🌫️', effect: 'Né tránh', buffAtk: 1.05 },
                { name: 'Nắng gắt', icon: '🔥', effect: 'ATK +20%', buffAtk: 1.2 }
            ];
            currentWeather = weathers[Math.floor(Math.random() * weathers.length)];
            document.getElementById('weather-icon').innerText = currentWeather.icon;
            document.getElementById('weather-status').innerText = currentWeather.name;
        }

        function openEggsMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            const targetSteps = 50;
            let progress = Math.min(100, (eggSteps / targetSteps) * 100);
            let canHatch = eggSteps >= targetSteps;

            content.innerHTML = `
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🥚 Ấp Trứng Linh Thú</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>
            <div class="flex flex-col items-center bg-zinc-800 p-6 rounded-2xl border border-zinc-700 text-center">
                <div class="text-7xl mb-3 animate-pulse">🥚</div>
                <div class="font-bold text-sm mb-1">Trứng Đặc Biệt</div>
                <div class="text-xs text-zinc-400 mb-4">Đi bộ tích lũy bước chân ấp trứng!</div>
                <div class="w-full bg-zinc-900 rounded-full h-4 overflow-hidden border border-zinc-700 mb-2">
                    <div class="bg-amber-500 h-full transition-all" style="width: ${progress}%"></div>
                </div>
                <div class="text-xs font-bold text-yellow-300 mb-4">Tiến độ: ${eggSteps} / ${targetSteps} bước</div>
                <button onclick="hatchEgg()" ${canHatch ? '' : 'disabled'} class="w-full py-3 rounded-xl font-bold text-sm shadow-lg transition-all ${canHatch ? 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer' : 'bg-zinc-700 text-zinc-400 opacity-50 cursor-not-allowed'}">
                    ${canHatch ? '🎉 ẤP NỞ NGAY!' : '🔒 Chưa đủ bước chân'}
                </button>
            </div>`;
        }

        function hatchEgg() {
            if (eggSteps < 50) return;
            eggSteps -= 50;
            localStorage.setItem('ar_egg_steps', eggSteps);
            document.getElementById('egg-steps-count').innerText = eggSteps;

            const basePet = allMonsters[Math.floor(Math.random() * allMonsters.length)];
            const randomElem = elements[Math.floor(Math.random() * elements.length)];
            const hatchedPet = { 
                ...basePet, 
                uniqueId: Date.now(), 
                level: 1, 
                hunger: 80, 
                happiness: 80, 
                element: randomElem.name,
                critRate: Math.floor(1 + Math.random() * 34),     // 1% -> 35%
                dodgeRate: Math.floor(1 + Math.random() * 34),    // 1% -> 35%
                accuracy: Math.floor(1 + Math.random() * 34),     // 1% -> 35%
                attackSpeed: parseFloat((1.0 + Math.random() * 1.0).toFixed(1)), // 1.0/s -> 2.0/s
                buffEffect: null
            };

            if (team.length < 3) {
                team.push(hatchedPet);
                localStorage.setItem('ar_team', JSON.stringify(team));
                updateTeamCount();
                alert(`🎉 Trứng nở ra ${hatchedPet.emoji} ${hatchedPet.name} [Hệ ${hatchedPet.element}] vào đội hình!`);
            } else {
                farm.push(hatchedPet);
                localStorage.setItem('ar_farm', JSON.stringify(farm));
                alert(`🎉 Trứng nở ra ${hatchedPet.emoji} ${hatchedPet.name} [Hệ ${hatchedPet.element}] vào Trang Trại!`);
            }
            closeModal();
        }

        // --- CHỢ ĐEN (BÁN ĐÁ NGŨ HÀNH & VẬT PHẨM) ---
        function openMarketMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            renderMarketContent();
        }

        let marketQtys = { food: 1, toy: 1, trainer: 1, stamina: 1, egg: 1, stoneKim: 1, stoneMoc: 1, stoneThuy: 1, stoneHoa: 1, stoneTho: 1 };

        function renderMarketContent() {
            const content = document.getElementById('modal-content');
            content.innerHTML = `
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🛒 Chợ Đen & Đá Ngũ Hành</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>
            <div class="text-xs text-yellow-400 font-bold mb-3">💰 Vàng hiện có: <span id="market-coins">${playerCoins}</span> 🪙</div>
            <div class="space-y-3 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between border border-amber-500/50">
                    <div><div class="font-bold text-sm text-amber-300">⚡ Năng Lượng (x5) (500🪙)</div><div class="text-[10px] text-zinc-400">Hồi ngay +5 Năng lượng</div></div>
                    <button onclick="buyStaminaBatch(500)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded text-xs font-bold">Mua</button>
                </div>
                <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div><div class="font-bold text-sm">🍖 Thức Ăn (50🪙) | Kho: ${inventory.food}</div></div>
                    <button onclick="buyBatch('food', 50)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded text-xs font-bold">Mua</button>
                </div>
                <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div><div class="font-bold text-sm">🎾 Đồ Chơi (50🪙) | Kho: ${inventory.toy}</div></div>
                    <button onclick="buyBatch('toy', 50)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded text-xs font-bold">Mua</button>
                </div>
                <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div><div class="font-bold text-sm">🏋️ Dụng Cụ Tập (100🪙) | Kho: ${inventory.trainer}</div></div>
                    <button onclick="buyBatch('trainer', 100)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded text-xs font-bold">Mua</button>
                </div>

        function initFarmCanvasAnimation() {
            farmCanvas = document.getElementById('farmCanvas');
            if (!farmCanvas) return;
            farmCtx = farmCanvas.getContext('2d');
            farmCanvas.width = farmCanvas.clientWidth;
            farmCanvas.height = farmCanvas.clientHeight;

            farmPetsState = farm.map((pet, idx) => ({
                ...pet,
                x: Math.random() * (farmCanvas.width - 60) + 30,
                y: Math.random() * (farmCanvas.height - 60) + 30,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.2,
                wobble: Math.random() * Math.PI
            }));

            if (farmAnimInterval) clearInterval(farmAnimInterval);
            farmAnimInterval = setInterval(() => {
                if (!farmCtx || !farmCanvas) return;
                farmCtx.clearRect(0, 0, farmCanvas.width, farmCanvas.height);

                farmCtx.fillStyle = '#064e3b';
                farmCtx.fillRect(0, 0, farmCanvas.width, farmCanvas.height);

                farmPetsState.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.wobble += 0.1;

                    if (p.x < 30 || p.x > farmCanvas.width - 30) p.vx *= -1;
                    if (p.y < 30 || p.y > farmCanvas.height - 30) p.vy *= -1;

                    let bounceY = p.y + Math.sin(p.wobble) * 4;

                    farmCtx.font = "40px sans-serif";
                    farmCtx.textAlign = "center";
                    farmCtx.textBaseline = "middle";
                    farmCtx.fillText(p.emoji, p.x, bounceY);

                    farmCtx.font = "10px sans-serif";
                    farmCtx.fillStyle = "#fde047";
                    farmCtx.fillText(p.name, p.x, bounceY + 26);
                });
            }, 50);
        }

                return;

            inventory[stoneKey]--;
            saveInventory();
            pet.buffEffect = effectDesc;
            localStorage.setItem('ar_team', JSON.stringify(team));
            alert(`✨ Nâng cấp thành công! Thú cưng đã sở hữu hiệu ứng: ${effectDesc}`);
            openPetDetail(index);
        }

        function petAction(index, action) {
            let pet = team[index];
            if (action === 'feed') {
                if (inventory.food <= 0) { alert('Hết Thức ăn!'); return; }
                inventory.food--;
                pet.hunger = Math.min(100, pet.hunger + 25);
                pet.hp = Math.min(pet.maxHp, pet.hp + 20);
            } else if (action === 'play') {
                if (inventory.toy <= 0) { alert('Hết Đồ chơi!'); return; }
                inventory.toy--;
                pet.happiness = Math.min(100, pet.happiness + 30);
            } else if (action === 'train') {
                if (inventory.trainer <= 0) { alert('Hết Dụng cụ tập!'); return; }
                inventory.trainer--;
                pet.level++;
                pet.atk += 12;
                pet.maxHp += 20;
                pet.hp = pet.maxHp;
            }
            saveInventory();
            localStorage.setItem('ar_team', JSON.stringify(team));
            openPetDetail(index);
        }

        function findOnlineMatch() {
            if (team.length === 0) { alert('Đội hình trống!'); closeModal(); return; }
            if (team[0].happiness < 30) { alert(`⚠️ ${team[0].name} đang bất mãn (Hạnh phúc < 30%) và từ chối chiến đấu! Hãy cho chơi đùa trước.`); closeModal(); return; }

            modal.classList.remove('hidden');

            content.innerHTML = `
            <div id="search-match-box" class="flex flex-col items-center py-8 text-center">
                <div class="text-6xl mb-4 animate-spin">🌐</div>

            let timeLeft = 30;

                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);

            // Giả lập tìm người thật xung quanh (xác suất 50% tìm thấy hoặc hết 30s không thấy)
            searchMatchTimeout = setTimeout(() => {
                clearInterval(timerInterval);
                let foundRealPlayer = Math.random() < 0.5; // 50% tìm thấy người thật

                if (!foundRealPlayer) {
                    content.innerHTML = `
                    <div class="flex flex-col items-center py-6 text-center">
                        <div class="text-5xl mb-3">📭</div>
                        <div class="text-base font-bold text-red-400 mb-2">Không có ai xung quanh để tấn công!</div>
                        <div class="text-xs text-zinc-400 mb-4">Không tìm thấy người chơi thật nào trong khu vực bán kính của bạn sau 30 giây.</div>
                        <button onclick="closeModal()" class="bg-zinc-700 px-5 py-2.5 rounded-xl text-xs font-bold">Quay lại</button>
                    </div>`;
                } else {
                    let onlinePeers = [
                        { name: 'Cao Bồi Ken', avatar: '🤠', pet: { name: 'Chó Vàng', emoji: '🐕', cp: 145, hp: 80, maxHp: 80, atk: 90, level: 1, element: 'Kim', critRate: 20, dodgeRate: 15, accuracy: 25, attackSpeed: 1.4, buffEffect: null } },
                        { name: 'Hiệp Sĩ Jane', avatar: '🧝‍♀️', pet: { name: 'Chim Lửa', emoji: '🐦', cp: 185, hp: 50, maxHp: 50, atk: 140, level: 1, element: 'Hỏa', critRate: 25, dodgeRate: 18, accuracy: 20, attackSpeed: 1.6, buffEffect: 'Đốt cháy đối thủ' } }
                    ];
                    let matched = onlinePeers[Math.floor(Math.random() * onlinePeers.length)];
                    closeModal();
                    startCanvasBattle(matched);
                }
            }, 5000); // Test nhanh 5s hoặc đổi thành 30000 cho đúng 30s
        }

        function cancelSearchMatch() {
            if (searchMatchTimeout) clearTimeout(searchMatchTimeout);
            closeModal();
        }

        let battleCanvas, battleCtx, battleInterval;
        let myBattlePet, enemyBattlePet;
        let myHp, enemyHp, myMaxHp, enemyMaxHp;
        let battleState = 'fighting';
        let battleModeTitle = '⚔️ PVP REALTIME';
        let animActionTick = 0;
        let activeOpponentName = '';
        let myBurnTurns = 0, enemyBurnTurns = 0;
        let myStunTurns = 0, enemyStunTurns = 0;

        function startCanvasBattle(opponentObj = null) {
            checkPetSurvival();
            if (team.length === 0) { alert('Đội hình trống!'); closeModal(); return; }
            if (team[0].happiness < 30) { alert(`⚠️ ${team[0].name} đang bất mãn và từ chối chiến đấu!`); closeModal(); return; }

            closeModal();
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');

            myBattlePet = team[0];
            if (!myBattlePet.critRate) myBattlePet.critRate = 15;
            if (!myBattlePet.dodgeRate) myBattlePet.dodgeRate = 10;
            if (!myBattlePet.accuracy) myBattlePet.accuracy = 20;
            if (!myBattlePet.attackSpeed) myBattlePet.attackSpeed = 1.2;

            if (opponentObj && opponentObj.pet) {
                enemyBattlePet = { ...opponentObj.pet };
                activeOpponentName = opponentObj.name;
                battleModeTitle = `⚔️ PVP REALTIME VS [${opponentObj.name.toUpperCase()}]`;
            } else {
                let enemyBase = allMonsters[Math.floor(Math.random() * allMonsters.length)];
                let enemyElem = elements[Math.floor(Math.random() * elements.length)].name;
                enemyBattlePet = { ...enemyBase, level: myBattlePet.level, element: enemyElem, critRate: 15, dodgeRate: 12, accuracy: 20, attackSpeed: 1.2, buffEffect: null };
                activeOpponentName = 'Bot Huấn Luyện';
                battleModeTitle = `⚔️ ĐẤU TRƯỜNG ONLINE`;
            }

            document.getElementById('battle-title-tag').innerText = battleModeTitle;

            myMaxHp = myBattlePet.maxHp;
            myHp = myBattlePet.hp;
            enemyMaxHp = enemyBattlePet.maxHp;
            enemyHp = enemyBattlePet.maxHp;
            battleState = 'fighting';
            animActionTick = 0;
            myBurnTurns = 0; enemyBurnTurns = 0;
            myStunTurns = 0; enemyStunTurns = 0;

            battleCanvas = document.getElementById('battleCanvas');
            battleCtx = battleCanvas.getContext('2d');
            battleCanvas.width = battleCanvas.clientWidth;
            battleCanvas.height = battleCanvas.clientHeight;

            runBattleLoop();
        }

        function exitBattleScreen() {
            clearInterval(battleInterval);
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            map.invalidateSize();
        }

        function showDamagePopup(text, isCrit, x, y) {
            const container = document.getElementById('damage-popup-container');
            if(!container) return;
            const el = document.createElement('div');
            el.className = `absolute text-sm font-black damage-popup ${isCrit ? 'text-yellow-300 text-lg scale-125' : 'text-red-400'}`;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerText = text;
            container.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function runBattleLoop() {
            let animStep = 0;
            battleInterval = setInterval(() => {
                battleCtx.clearRect(0, 0, battleCanvas.width, battleCanvas.height);
                animStep++;
                animActionTick++;

                let grad = battleCtx.createRadialGradient(battleCanvas.width/2, battleCanvas.height/2, 10, battleCanvas.width/2, battleCanvas.height/2, 280);
                grad.addColorStop(0, '#9a3412');
                grad.addColorStop(0.6, '#451a03');
                grad.addColorStop(1, '#09090b');
                battleCtx.fillStyle = grad;
                battleCtx.fillRect(0, 0, battleCanvas.width, battleCanvas.height);

                battleCtx.beginPath();
                battleCtx.strokeStyle = '#fbbf24';
                battleCtx.lineWidth = 4;
                battleCtx.arc(battleCanvas.width/2, battleCanvas.height/2 - 10, 120, 0, Math.PI * 2);
                battleCtx.stroke();

                let myX = 85 + Math.sin(animStep * 0.15) * 15;
                let enemyX = battleCanvas.width - 125 - Math.sin(animStep * 0.15) * 15;
                let centerY = battleCanvas.height / 2 - 15;

                let myElemObj = elements.find(e => e.name === myBattlePet.element) || elements[0];
                let enemyElemObj = elements.find(e => e.name === enemyBattlePet.element) || elements[0];

                // Thú bạn
                battleCtx.font = "80px sans-serif";
                battleCtx.textAlign = "center";
                battleCtx.fillText(myBattlePet.emoji, myX, centerY);

                battleCtx.fillStyle = "#18181b";
                battleCtx.fillRect(25, centerY + 55, 130, 14);
                battleCtx.fillStyle = "#10b981";
                battleCtx.fillRect(25, centerY + 55, 130 * Math.max(0, myHp / myMaxHp), 14);
                battleCtx.font = "10px sans-serif";
                battleCtx.fillStyle = "#fff";
                battleCtx.fillText(`${myBattlePet.name} (${myElemObj.icon}${myBattlePet.element})`, 90, centerY + 50);

                // Thú đối thủ
                battleCtx.font = "80px sans-serif";
                battleCtx.fillText(enemyBattlePet.emoji, enemyX, centerY);

                battleCtx.fillStyle = "#18181b";
                battleCtx.fillRect(battleCanvas.width - 155, centerY + 55, 130, 14);
                battleCtx.fillStyle = "#ef4444";
                battleCtx.fillRect(battleCanvas.width - 155, centerY + 55, 130 * Math.max(0, enemyHp / enemyMaxHp), 14);
                battleCtx.font = "10px sans-serif";
                battleCtx.fillStyle = "#fff";
                battleCtx.fillText(`${enemyBattlePet.name} (${enemyElemObj.icon}${enemyBattlePet.element})`, battleCanvas.width - 90, centerY + 50);

                // Tốc độ đánh quyết định nhịp độ (Tốc đánh ai cao hơn đánh nhiều nhịp hơn)
                let tickInterval = myBattlePet.attackSpeed >= (enemyBattlePet.attackSpeed || 1.2) ? 22 : 28;

                if (battleState === 'fighting' && animActionTick % tickInterval === 0) {
                    // Xử lý hiệu ứng DOT (Đốt cháy / Trúng độc)
                    if (enemyBurnTurns > 0) {
                        enemyHp -= 10;
                        enemyBurnTurns--;
                        showDamagePopup(`-10 (Đốt/Độc)`, false, battleCanvas.width - 130, centerY - 40);
                    }
                    if (myBurnTurns > 0) {
                        myHp -= 10;
                        myBurnTurns--;
                        showDamagePopup(`-10 (Đốt/Độc)`, false, 90, centerY - 40);
                    }

                    // Kiểm tra choáng (Stun)
                    if (myStunTurns > 0) {
                        myStunTurns--;
                        document.getElementById('battle-log').innerText = `${myBattlePet.name} đang bị CHOÁNG không thể đánh!`;
                    } else {
                        // Tính chính xác: Trừ % né tránh của đối thủ
                        let effectiveDodge = Math.max(0, (enemyBattlePet.dodgeRate || 10) - (myBattlePet.accuracy || 20));
                        let enemyDodge = Math.random() * 100 < effectiveDodge;

                        if (enemyDodge) {
                            showDamagePopup(`NÉ TRÁNH!`, false, battleCanvas.width - 130, centerY - 20);
                            document.getElementById('battle-log').innerText = `${enemyBattlePet.name} đã né đòn tấn công!`;
                        } else {
                            let isCrit = Math.random() * 100 < (myBattlePet.critRate || 15);
                            let myHasAdvantage = checkElementAdvantage(myBattlePet.element, enemyBattlePet.element);
                            let dmgMultiplier = isCrit ? 1.5 : 1.0;
                            let myBaseDmg = Math.floor(myBattlePet.atk * 0.4 * dmgMultiplier * currentWeather.buffAtk);
                            if (myHasAdvantage) myBaseDmg = Math.floor(myBaseDmg * 1.35);

                            enemyHp -= myBaseDmg;
                            showDamagePopup(`-${myBaseDmg} HP`, isCrit, battleCanvas.width - 130, centerY - 20);

                            // Kích hoạt hiệu ứng hệ nếu có nâng cấp
                            if (myBattlePet.buffEffect === 'Đốt cháy đối thủ' || myBattlePet.buffEffect === 'Trúng độc đối thủ') {
                                enemyBurnTurns = 3;
                            } else if (myBattlePet.buffEffect === 'Choáng đối thủ' && Math.random() < 0.3) {
                                enemyStunTurns = 1;
                            }

                            let logText = `${myBattlePet.name} gây ${myBaseDmg} DMG!`;
                            if (isCrit) logText += ` (Chí mạng 1.5x!)`;
                            document.getElementById('battle-log').innerText = logText;
                        }
                    }

                    if (enemyHp <= 0 || myHp <= 0) {
                        battleState = enemyHp > 0 ? 'lost' : 'won';
                    }
                }

                if (battleState === 'won' || battleState === 'lost') {
                    clearInterval(battleInterval);

                    let hpLostPercent = Math.max(0, (myMaxHp - Math.max(0, myHp)) / myMaxHp);
                    myBattlePet.hp = Math.max(0, myHp);
                    myBattlePet.hunger = Math.max(0, myBattlePet.hunger - Math.floor(hpLostPercent * 40));
                    myBattlePet.happiness = Math.max(0, myBattlePet.happiness - Math.floor(hpLostPercent * 40));

                    let rewardCoins = battleState === 'won' ? 350 : 0;
                    if (battleState === 'won') {
                        playerCoins += rewardCoins;
                        localStorage.setItem('ar_coins', playerCoins);
                        team[0] = myBattlePet;
                        localStorage.setItem('ar_team', JSON.stringify(team));
                    } else {
                        team.shift(); // Thú hy sinh vĩnh viễn
                        localStorage.setItem('ar_team', JSON.stringify(team));
                        updateTeamCount();
                    }

                    checkPetSurvival();
                    showBattleResultModal(battleState === 'won', rewardCoins, hpLostPercent, myBattlePet.name);
                }
            }, 80);
        }

        // --- BẢN ĐỒ & MULTIPLAYER ---
        let map, userMarker;

        let mockRealPlayers = [

        function spawnMultipleMonsters() {
            activeMarkers.forEach(m => map.removeLayer(m));

        let canvas, ctx;
        let isARActive = false;
        let rope = { x: 0, y: 0, vx: 0, vy: 0, radius: 30, flying: false };
        let monsterPos = { x: 0, y: 0, vx: 2 };
        let touchStart = { x: 0, y: 0 }, touchEnd = { x: 0, y: 0 };

        async function enterARScreen() {
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('ar-screen').classList.remove('hidden');
            isARActive = true;

            let elemObj = elements.find(e => e.name === currentWildMonster.element) || elements[0];
            document.getElementById('ar-mon-info').innerText = `${currentWildMonster.emoji} ${currentWildMonster.name} (${elemObj.icon}${currentWildMonster.element}) - CP ${currentWildMonster.cp}`;

            } catch (e) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });

            if (videoEl.srcObject) videoEl.srcObject.getTracks().forEach(t => t.stop());

            document.getElementById('map-screen').classList.remove('hidden');
            map.invalidateSize();
        }

        function initCanvasGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            monsterPos.x = canvas.width / 2;
            monsterPos.y = canvas.height * 0.35;
            resetRope();

            canvas.onpointerdown = (e) => {
                if (rope.flying) return;
                touchStart.x = e.clientX; touchStart.y = e.clientY;
            };

            canvas.onpointerup = (e) => {
                if (rope.flying) return;
                touchEnd.x = e.clientX; touchEnd.y = e.clientY;
                let dx = touchEnd.x - touchStart.x;
                let dy = touchEnd.y - touchStart.y;

                if (dy < -30) {
                    if (stamina > 0) {
                        stamina--;
                        localStorage.setItem('ar_stamina', stamina);
                        document.getElementById('stamina-count').innerText = stamina;
                    }
                    rope.vx = dx * 0.12;
                    rope.vy = dy * 0.15;
                    rope.flying = true;
                }
            };
            requestAnimationFrame(updateCanvasGame);
        }

        function resetRope() {
            rope.x = canvas.width / 2; rope.y = canvas.height * 0.85;
            rope.vx = 0; rope.vy = 0; rope.flying = false;
        }

        function updateCanvasGame() {
            if (!isARActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            monsterPos.x += monsterPos.vx;
            if (monsterPos.x < 60 || monsterPos.x > canvas.width - 60) monsterPos.vx *= -1;

            ctx.font = "80px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(currentWildMonster.emoji, monsterPos.x, monsterPos.y);

            if (rope.flying) {
                rope.x += rope.vx; rope.y += rope.vy; rope.vy += 0.25;
                ctx.beginPath(); ctx.moveTo(canvas.width / 2, canvas.height * 0.85); ctx.lineTo(rope.x, rope.y);
                ctx.strokeStyle = "#d4a373"; ctx.lineWidth = 4; ctx.stroke();

                let dist = Math.hypot(rope.x - monsterPos.x, rope.y - monsterPos.y);
                if (dist < 65) { rope.flying = false; handleCatchResult(); }
                if (rope.y < 0 || rope.x < 0 || rope.x > canvas.width) { rope.flying = false; handleMissAttempt("Quăng hụt!"); resetRope(); }
            }

            ctx.font = "40px sans-serif";
            ctx.fillText("🪢", rope.x, rope.y);
            requestAnimationFrame(updateCanvasGame);
        }

        function handleCatchResult() {
            let isFailed = Math.random() < 0.50;
            if (isFailed) { handleMissAttempt(`${currentWildMonster.name} giãy giụa thoát!`); resetRope(); }
            else {
                const feedback = document.getElementById('throw-feedback');
                feedback.innerText = `🎉 Bắt thành công ${currentWildMonster.name}!`;
                feedback.style.opacity = '1';
                setTimeout(() => { feedback.style.opacity = '0'; exitARScreen(); promptCatchChoice(currentWildMonster); }, 1000);
            }
        }

        function handleMissAttempt(reasonMsg) {
            catchAttempts++;
            document.getElementById('throw-attempt-count').innerText = `Lượt quăng: ${catchAttempts}/3`;
            const feedback = document.getElementById('throw-feedback');

            if (catchAttempts >= 3) {
                feedback.innerText = `😜 ${currentWildMonster.name} đã chạy mất!`;
                feedback.style.opacity = '1';
                setTimeout(() => { feedback.style.opacity = '0'; exitARScreen(); spawnMultipleMonsters(); }, 2500);
            } else {
                feedback.innerText = `💥 ${reasonMsg}`;
                feedback.style.opacity = '1';
                setTimeout(() => { feedback.style.opacity = '0'; }, 2000);
            }
        }

        function updateTeamCount() { document.getElementById('team-count').innerText = team.length; }

        function openPokedexMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">📖 Sổ Tay Phân Loại</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>`;
            html += `<div class="space-y-4">`;
            for (let [catName, list] of Object.entries(categories)) {
                html += `<div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700"><div class="text-yellow-400 font-bold text-sm mb-2">📁 ${catName}</div><div class="grid grid-cols-4 gap-2">`;
                list.forEach(m => {
                    const caught = pokedex.includes(m.id);
                    html += `<div class="bg-zinc-900 p-2 rounded-lg flex flex-col items-center border ${caught ? 'border-emerald-500/60' : 'border-zinc-800 opacity-40'}"><span class="text-3xl mb-1">${caught ? m.emoji : '❓'}</span><div class="text-[10px] text-center font-bold truncate w-full">${m.name}</div></div>`;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
            content.innerHTML = html;
        }

        window.onload = () => {
            initWeather();
            initMap();
            initStaminaSystem();
            updateTeamCount();
        };
    </script>
</body>
</html>
