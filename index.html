<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Batthu - Realistic Cowboy Catch v9.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; height: 100dvh; width: 100%; overflow: hidden; background: #09090b; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        #map-screen { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100vw; position: absolute; inset: 0; background: #09090b; overflow: hidden; }
        #map-container-wrap { flex: 1 1 0%; position: relative; width: 100%; min-height: 0; overflow: hidden; }
        #map { height: 100% !important; width: 100% !important; position: absolute !important; inset: 0; z-index: 10; background: #18181b; }
        
        .hotspot {
            position: absolute; cursor: pointer; border: none; background: transparent; z-index: 20;
        }
        .hotspot:active { background: rgba(255, 255, 255, 0.15); }

        .leaflet-control-attribution { display: none !important; }
        .leaflet-div-icon { background: transparent !important; border: none !important; }

        .roaming-pet-marker {
            transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1), top 2.5s ease, left 2.5s ease;
            will-change: transform;
            pointer-events: auto !important;
            touch-action: manipulation !important;
            cursor: pointer !important;
            -webkit-tap-highlight-color: transparent;
        }
        .pet-hitbox {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto !important;
            touch-action: manipulation !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes floatText { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-45px) scale(1.2); opacity: 0; } }
        .damage-popup { animation: floatText 0.6s ease-out forwards; }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8)); }
        }
        .swipe-alert-glow { animation: pulseGlow 0.8s infinite ease-in-out; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <div id="youtube-audio-container" style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;">
        <div id="yt-player"></div>
    </div>

    <!-- MÀN HÌNH BẢN ĐỒ GPS & TIỆN ÍCH -->
    <div id="map-screen" class="absolute inset-0 z-20 flex flex-col justify-between bg-zinc-950 p-2 pb-2">
        <div class="z-50 pt-1 pb-1 shrink-0 w-full">
            <div class="flex gap-1.5 overflow-x-auto py-1 w-full no-scrollbar items-center px-0.5">
                <button onclick="openWorldBossMenu()" class="bg-amber-700/90 px-3 py-1.5 rounded-full border border-amber-400 text-xs font-bold shadow cursor-pointer animate-pulse whitespace-nowrap shrink-0">👹 Boss</button>
                <button onclick="openHospitalMenu()" class="bg-cyan-700/90 px-3 py-1.5 rounded-full border border-cyan-400 text-xs font-bold shadow cursor-pointer whitespace-nowrap shrink-0">🏥 Bệnh Viện</button>
                <button onclick="openEggIncubatorMenu()" class="bg-emerald-700/90 px-3 py-1.5 rounded-full border border-emerald-400 text-xs font-bold shadow cursor-pointer whitespace-nowrap shrink-0">🥚 Ấp Trứng (<span id="egg-count-badge">0</span>)</button>
                <button onclick="openQuestMenu()" class="bg-yellow-600/90 px-3 py-1.5 rounded-full border border-yellow-400 text-xs font-bold shadow cursor-pointer whitespace-nowrap shrink-0">📜 NV</button>
                <button onclick="openTowerMenu()" class="bg-purple-600/90 px-3 py-1.5 rounded-full border border-purple-400 text-xs font-bold shadow cursor-pointer whitespace-nowrap shrink-0">🗼 Tháp</button>
                <button onclick="openMarketMenu()" class="bg-amber-600/90 px-3 py-1.5 rounded-full border border-amber-400 text-xs font-bold shadow cursor-pointer whitespace-nowrap shrink-0">🛒 Chợ</button>
                <button onclick="openArenaMenu()" class="bg-red-600/90 px-3 py-1.5 rounded-full border border-red-400 text-xs font-bold shadow cursor-pointer whitespace-nowrap shrink-0">⚔️ PvP</button>
                <button onclick="openFarmMenu()" class="bg-emerald-600/90 px-3 py-1.5 rounded-full border border-emerald-400 text-xs font-bold shadow cursor-pointer whitespace-nowrap shrink-0">🏡 Trại</button>
                <button onclick="openTeamMenu()" class="bg-black/85 px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer whitespace-nowrap shrink-0">🎒(<span id="team-count">0</span>/3)</button>
            </div>
        </div>

        <div id="map-container-wrap" class="my-1 rounded-xl overflow-hidden border border-zinc-800 relative grow">
            <div id="map"></div>

            <div class="absolute top-2.5 left-2.5 z-30 bg-black/80 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/20 flex items-center gap-1.5 shadow-lg pointer-events-none">
                <span id="weather-icon" class="text-xs">☀️</span>
                <span id="weather-status" class="text-[10px] font-medium text-zinc-200">Trời quang</span>
            </div>

            <div class="absolute bottom-3 right-3 z-30 flex items-center gap-2">
                <button onclick="manualTriggerScan()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white p-3 rounded-full shadow-2xl border border-emerald-400 flex items-center justify-center text-lg cursor-pointer transition-transform" title="Quét lại khu vực">
                    🔄
                </button>
                <button onclick="recenterMap()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white p-3 rounded-full shadow-2xl border border-blue-400 flex items-center justify-center text-lg cursor-pointer transition-transform" title="Về vị trí của tôi">
                    📍
                </button>
            </div>
        </div>

        <div class="flex items-center justify-between text-[11px] font-bold text-zinc-200 bg-black/90 px-3.5 py-2 rounded-xl border border-white/15 shadow-lg w-full shrink-0">
            <span class="text-amber-300">⚡ Bắt: <span id="catch-stamina-count">15</span>/15 (<span id="catch-stamina-timer">10:00</span>)</span>
            <span class="text-cyan-300">📡 Quét: <span id="scan-stamina-count">5</span>/5 (<span id="scan-stamina-timer">10:00</span>)</span>
            <span class="text-yellow-400">💰 <span id="coin-count">1500</span>🪙</span>
        </div>
    </div>

    <!-- MÀN HÌNH TRANG TRẠI FULLSCREEN -->
    <div id="fullscreen-farm-screen" class="hidden absolute inset-0 z-40 bg-zinc-950 flex flex-col">
        <button onclick="closeFullscreenFarm()" class="absolute top-3 right-3 z-30 bg-black/70 hover:bg-black text-white px-3 py-1.5 rounded-full font-bold text-xs cursor-pointer border border-white/20 shadow-xl">✕ Thoát</button>
        <div class="relative w-full h-full overflow-hidden">
            <img src="./farm-bg.png" alt="Trang Trai" class="absolute inset-0 w-full h-full object-cover z-0">
            <div onclick="showFarmSection('training')" class="hotspot" style="top: 5%; left: 10%; width: 80%; height: 28%;" title="Khu Luyện Tập"></div>
            <div onclick="showFarmSection('resting')" class="hotspot" style="top: 36%; left: 52%; width: 44%; height: 30%;" title="Khu Hồi Sức"></div>
            <div onclick="showFarmSection('storage')" class="hotspot" style="top: 68%; left: 5%; width: 90%; height: 28%;" title="Kho Trại"></div>
        </div>
    </div>

    <!-- MÀN HÌNH BỆNH VIỆN FULLSCREEN -->
    <div id="hospital-screen" class="hidden absolute inset-0 z-40 bg-zinc-950 flex flex-col">
        <button onclick="closeHospitalMenu()" class="absolute top-3 right-3 z-30 bg-black/70 hover:bg-black text-white px-3 py-1.5 rounded-full font-bold text-xs cursor-pointer border border-white/20 shadow-xl">✕ Đóng</button>
        <div class="relative w-full h-full overflow-hidden">
            <img src="./hospital-bg.png" alt="Bệnh Viện" class="absolute inset-0 w-full h-full object-cover z-0">
            <div onclick="openHospitalActionModal('heal')" class="hotspot" style="top: 23%; left: 5%; width: 45%; height: 35%;" title="Hồi Sức Tim"></div>
            <div onclick="openHospitalActionModal('evolve')" class="hotspot" style="top: 23%; left: 52%; width: 43%; height: 35%;" title="Tiến Hóa Đá"></div>
            <div onclick="openHospitalActionModal('breed')" class="hotspot" style="top: 61%; left: 10%; width: 80%; height: 35%;" title="Lai Giống F1"></div>
        </div>
    </div>

    <!-- MÀN HÌNH THÁP VÔ TẬN FULLSCREEN -->
    <div id="tower-screen" class="hidden absolute inset-0 z-40 bg-zinc-950 flex flex-col">
        <button onclick="closeTowerScreen()" class="absolute top-3 right-3 z-30 bg-black/70 hover:bg-black text-white px-3 py-1.5 rounded-full font-bold text-xs cursor-pointer border border-white/20 shadow-xl">✕ Thoát</button>
        <div class="relative w-full h-full overflow-hidden flex flex-col items-center justify-end pb-12">
            <img src="./tower-bg.png" alt="Tháp Vô Tận" class="absolute inset-0 w-full h-full object-cover z-0">
            <div onclick="startBattle('tower')" class="hotspot flex flex-col items-center justify-center animate-pulse" style="top: 60%; left: 35%; width: 30%; height: 20%;" title="Khiêu chiến Tháp">
                <div class="bg-purple-900/90 text-yellow-300 font-extrabold px-3 py-1.5 rounded-full border-2 border-yellow-400 text-xs shadow-2xl tracking-wider text-center">
                    🗼 TẦNG <span id="tower-gate-floor">1</span><br><span class="text-[9px] text-white">CHẠM ĐỂ ĐẤU</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH MINIGAME BẮT THÚ AR ACTION (V9.9 - MŨI TÊN Ở VỊ TRÍ KHUNG XANH) -->
    <div id="ar-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-900">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        </div>
        <canvas id="gameCanvas" class="absolute inset-0 z-10 touch-none"></canvas>
        <div class="flex justify-between items-center z-20 p-4 pointer-events-auto">
            <button onclick="exitARScreen()" class="bg-black/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">
                ⬅️ Quay lại bản đồ
            </button>
            <div id="ar-mon-info" class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-yellow-300">
                Mục tiêu: Đang tải...
            </div>
        </div>
        
        <!-- VỊ TRÍ MŨI TÊN VUỐT ĐƯỢC DỜI LÊN ĐÚNG VÙNG KHUNG XANH -->
        <div id="floating-swipe-zone" class="hidden absolute left-0 right-0 z-20 flex justify-center pointer-events-none" style="bottom: 22%;">
            <div class="swipe-alert-glow bg-black/85 border-2 border-yellow-400 px-5 py-2.5 rounded-2xl flex items-center gap-2 shadow-2xl backdrop-blur-md">
                <span id="swipe-arrow-icon" class="text-2xl font-black text-amber-300">➡️</span>
                <span id="swipe-instruction-text" class="text-sm font-extrabold text-yellow-300 tracking-wide uppercase">VUỐT SANG PHẢI!</span>
            </div>
        </div>

        <!-- BẢNG TIẾN ĐỘ DƯỚI ĐÁY -->
        <div class="flex flex-col items-center z-20 pb-8 pointer-events-none w-full px-4">
            <div id="tug-of-war-ui" class="hidden flex flex-col items-center w-full max-w-xs bg-black/85 p-3 rounded-2xl border-2 border-amber-500/70 pointer-events-auto mb-2 shadow-2xl">
                <div class="text-[11px] text-zinc-300 mb-1 font-bold">Lực ghìm dây thừng</div>
                <div class="w-full bg-zinc-900 rounded-full h-3.5 overflow-hidden border border-zinc-700 mb-1 relative">
                    <div id="tug-progress-bar" class="bg-gradient-to-r from-red-500 via-yellow-500 to-emerald-400 h-full transition-all duration-75" style="width: 50%"></div>
                </div>
                <div class="text-[10px] text-zinc-400">Vuốt theo mũi tên chỉ dẫn phía trên!</div>
            </div>
            <div id="ar-instruction" class="text-[11px] text-zinc-200 mt-1 bg-black/75 px-3.5 py-1.5 rounded-full border border-white/15 text-center shadow-lg">
                🤠 Chạm hoặc vuốt để quăng dây thừng! (⚡-1)
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẤU TRƯỜNG FULLSCREEN -->
    <div id="battle-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-950">
        <div class="absolute top-3 left-3 right-3 z-30 flex justify-between items-center bg-black/75 backdrop-blur-md p-2.5 rounded-xl border border-white/20 shadow-2xl">
            <div class="flex flex-col w-5/12">
                <div id="battle-team-names" class="text-[11px] font-bold text-emerald-400 truncate">Đội hình của bạn</div>
                <div class="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden mt-1 border border-zinc-700">
                    <div id="battle-team-hp-bar" class="bg-emerald-500 h-full transition-all duration-200" style="width: 100%"></div>
                </div>
                <div id="battle-team-hp-text" class="text-[9px] text-zinc-300 mt-0.5">HP: --/--</div>
            </div>
            <button onclick="exitBattleScreen()" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-lg border border-zinc-600 text-[10px] font-bold cursor-pointer">Rút lui</button>
            <div class="flex flex-col w-5/12 text-right">
                <div id="battle-enemy-name" class="text-[11px] font-bold text-red-400 truncate">Đối thủ</div>
                <div class="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden mt-1 border border-zinc-700">
                    <div id="battle-enemy-hp-bar" class="bg-red-500 h-full transition-all duration-200 ml-auto" style="width: 100%"></div>
                </div>
                <div id="battle-enemy-hp-text" class="text-[9px] text-zinc-300 mt-0.5">HP: --/--</div>
            </div>
        </div>

        <div class="relative w-full h-full overflow-hidden flex flex-col items-center justify-center">
            <img src="./battle-bg.png" alt="Dau Truong" class="absolute inset-0 w-full h-full object-cover z-0">
            <canvas id="battleCanvas" class="absolute inset-0 w-full h-full z-10"></canvas>
            <div id="damage-popup-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
            <div id="battle-log" class="absolute bottom-6 z-20 bg-black/85 px-4 py-2 rounded-xl text-xs text-yellow-300 font-bold border border-yellow-500/50 text-center max-w-sm shadow-xl">
                Đang nạp thanh tốc độ...
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY CHUNG -->
    <div id="modal-container" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto relative"></div>
    </div>

    <!-- SCRIPT CHÍNH -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function safeParse(key, fallback) {
            try {
                let item = localStorage.getItem(key);
                return item ? JSON.parse(item) : fallback;
            } catch(e) {
                return fallback;
            }
        }

        let team = safeParse('ar_team', []);
        let farm = safeParse('ar_farm', []);
        let eggs = safeParse('ar_eggs', []);
        let playerCoins = parseInt(localStorage.getItem('ar_coins') || '1500');
        let towerFloor = parseInt(localStorage.getItem('ar_tower_floor') || '1');
        let bossLevel = parseInt(localStorage.getItem('ar_boss_level') || '1');
        let totalSteps = parseInt(localStorage.getItem('ar_steps') || '0');

        let catchStamina = parseInt(localStorage.getItem('ar_catch_stamina') || '15');
        let lastCatchStaminaTime = parseInt(localStorage.getItem('ar_catch_stamina_time') || Date.now());

        let scanStamina = parseInt(localStorage.getItem('ar_scan_stamina') || '5');
        let lastScanStaminaTime = parseInt(localStorage.getItem('ar_scan_stamina_time') || Date.now());

        let trainingPoles = safeParse('ar_training_poles', [null, null, null, null]);
        let restingPets = safeParse('ar_resting_pets', []);

        let inventory = safeParse('ar_inventory', {
            food: 15, toy: 15, trainer: 10,
            stoneKim: 5, stoneMoc: 5, stoneThuy: 5, stoneHoa: 5, stoneTho: 5
        });

        let dailyQuests = safeParse('ar_quests', [
            { id: 1, title: 'Bắt 3 linh thú bất kỳ', target: 3, progress: 0, reward: 200, claimed: false },
            { id: 2, title: 'Thắng 2 trận đấu trường', target: 2, progress: 0, reward: 300, claimed: false },
            { id: 3, title: 'Cho linh thú ăn 2 lần', target: 2, progress: 0, reward: 150, claimed: false }
        ]);

        const elementCounterMap = {
            'Kim': 'Moc', 'Moc': 'Tho', 'Tho': 'Thuy', 'Thuy': 'Hoa', 'Hoa': 'Kim'
        };
        const elementNames = {
            'Kim': { label: 'Kim ⚔️', color: 'text-yellow-200' },
            'Moc': { label: 'Mộc 🌿', color: 'text-emerald-400' },
            'Tho': { label: 'Thổ 🪨', color: 'text-amber-500' },
            'Thuy': { label: 'Thủy 💧', color: 'text-blue-400' },
            'Hoa': { label: 'Hỏa 🔥', color: 'text-red-400' }
        };

        let ytPlayer = null;
        let isMusicReady = false;
        const LOBBY_YOUTUBE_ID = 'b-FHfiM8ILo';
        const BATTLE_YOUTUBE_ID = '9zMW4nO7CIo';

        function onYouTubeIframeAPIReady() {
            try {
                ytPlayer = new YT.Player('yt-player', {
                    height: '0', width: '0', videoId: LOBBY_YOUTUBE_ID,
                    playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': LOBBY_YOUTUBE_ID, 'controls': 0 },
                    events: { 'onReady': (e) => { isMusicReady = true; e.target.setVolume(50); } }
                });
            } catch(e){}
        }

        let isMusicPlaying = false;
        document.addEventListener('click', () => {
            if (!isMusicPlaying && isMusicReady && ytPlayer && ytPlayer.playVideo) { 
                isMusicPlaying = true; 
                try { ytPlayer.playVideo(); } catch(e){} 
            }
        }, { once: true });

        function switchGameMusic(scene) {
            if (!isMusicReady || !ytPlayer || !ytPlayer.loadVideoById) return;
            try {
                if (scene === 'battle') ytPlayer.loadVideoById(BATTLE_YOUTUBE_ID);
                else if (scene === 'map') ytPlayer.loadVideoById(LOBBY_YOUTUBE_ID);
            } catch(e){}
        }

        const possibleTraits = [
            { name: 'Khả năng Làm choáng', icon: '💫 Choáng', type: 'stun', chance: 20 },
            { name: 'Đòn đánh Trúng độc', icon: '🟢 Độc', type: 'poison', chance: 25 },
            { name: 'Thiêu đốt diện rộng', icon: '🔥 Cháy', type: 'burn', chance: 22 },
            { name: 'Làm chậm đối thủ', icon: '❄️ Chậm', type: 'slow', chance: 25 },
            { name: 'Hộ thân Buff Giáp', icon: '🛡️ Buff', type: 'shield', chance: 30 }
        ];

        const rarities = [
            { name: 'Thường', color: 'text-zinc-300', bg: 'border-zinc-600', badge: '⚪ Trang', rate: 50, statMultiplier: 1.0 },
            { name: 'Hiếm', color: 'text-emerald-400', bg: 'border-emerald-500', badge: '🟢 Xanh', rate: 25, statMultiplier: 1.3 },
            { name: 'Cực Hiếm', color: 'text-yellow-400', bg: 'border-yellow-500', badge: '🟡 Vàng', rate: 15, statMultiplier: 1.6 },
            { name: 'Huyền Thoại', color: 'text-red-500', bg: 'border-red-500', badge: '🔴 Đỏ', rate: 7, statMultiplier: 2.0 },
            { name: 'Thần Thánh', color: 'text-purple-400', bg: 'border-purple-500', badge: '🟣 Tím', rate: 3, statMultiplier: 2.5 }
        ];

        function getRandomRarity() {
            let roll = Math.random() * 100;
            let cumulative = 0;
            for (let r of rarities) {
                cumulative += r.rate;
                if (roll <= cumulative) return r;
            }
            return rarities[0];
        }

        const elementList = ['Kim', 'Moc', 'Thuy', 'Hoa', 'Tho'];
        function sanitizePetsData(petList) {
            if (!Array.isArray(petList)) return [];
            return petList.map(p => {
                if (!p) return null;
                let rarity = p.rarity || getRandomRarity();
                let multi = rarity.statMultiplier || 1.0;
                let element = p.element || elementList[Math.floor(Math.random() * elementList.length)];
                return {
                    ...p,
                    element: element,
                    maxHp: p.maxHp || p.hp || 150,
                    hp: (p.hp !== undefined && p.hp > 0) ? p.hp : (p.maxHp || 150),
                    level: p.level || 1,
                    atk: p.atk || 40,
                    hearts: p.hearts !== undefined ? p.hearts : 3,
                    gender: p.gender || (Math.random() < 0.5 ? 'Đực' : 'Cái'),
                    rarity: rarity,
                    critRate: (p.critRate && p.critRate > 0) ? p.critRate : Math.floor(15 + Math.random() * 20 * multi),
                    dodgeRate: (p.dodgeRate && p.dodgeRate > 0) ? p.dodgeRate : Math.floor(10 + Math.random() * 15 * multi),
                    accuracy: (p.accuracy && p.accuracy > 0) ? p.accuracy : Math.floor(80 + Math.random() * 15),
                    blockRate: (p.blockRate && p.blockRate > 0) ? p.blockRate : Math.floor(10 + Math.random() * 20 * multi),
                    slowResist: (p.slowResist && p.slowResist > 0) ? p.slowResist : Math.floor(10 + Math.random() * 15),
                    speed: (p.speed && p.speed > 0) ? p.speed : Math.floor(40 + Math.random() * 30 * multi),
                    trait: p.trait || possibleTraits[Math.floor(Math.random() * possibleTraits.length)],
                    hunger: p.hunger !== undefined ? p.hunger : 90,
                    happiness: p.happiness !== undefined ? p.happiness : 90
                };
            }).filter(p => p !== null);
        }

        team = sanitizePetsData(team);
        farm = sanitizePetsData(farm);
        restingPets = sanitizePetsData(restingPets);
