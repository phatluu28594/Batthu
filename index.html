<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batthu - Full Feature Master v6.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        #map-screen { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: absolute; inset: 0; background: #09090b; }
        #map-container-wrap { flex: 1; position: relative; width: 100%; min-height: 50vh; }
        #map { height: 100% !important; width: 100% !important; position: absolute !important; inset: 0; z-index: 10; }
        .leaflet-control-attribution { display: none !important; }
        .leaflet-div-icon { background: transparent !important; border: none !important; }
        @keyframes floatText { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-45px) scale(1.2); opacity: 0; } }
        .damage-popup { animation: floatText 0.5s ease-out forwards; }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- KHUNG YOUTUBE PLAYER ẨN -->
    <div id="youtube-audio-container" style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;">
        <div id="yt-player"></div>
    </div>

    <!-- MÀN HÌNH BẢN ĐỒ GPS & TIỆN ÍCH -->
    <div id="map-screen" class="absolute inset-0 z-20 flex flex-col justify-between bg-zinc-950 p-2">
        <div class="flex justify-between items-center z-30 pt-1 pb-1 shrink-0">
            <div class="bg-black/80 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/20 flex items-center gap-1.5">
                <span id="weather-icon" class="text-sm">☀️</span>
                <span id="weather-status" class="text-[11px] font-medium">Trời quang</span>
            </div>
            <div class="flex gap-1 overflow-x-auto py-1">
                <button onclick="openWorldBossMenu()" class="bg-amber-700/90 px-2 py-1 rounded-full border border-amber-400 text-[10px] font-bold shadow cursor-pointer animate-pulse">👹 Boss (<span id="boss-lvl-tag">Lv.1</span>)</button>
                <button onclick="openQuestMenu()" class="bg-yellow-600/90 px-2 py-1 rounded-full border border-yellow-400 text-[10px] font-bold shadow cursor-pointer">📜 Nhiệm Vụ</button>
                <button onclick="openTowerMenu()" class="bg-purple-600/90 px-2 py-1 rounded-full border border-purple-400 text-[10px] font-bold shadow cursor-pointer">🗼 Tháp</button>
                <button onclick="openBreedingMenu()" class="bg-pink-600/90 px-2 py-1 rounded-full border border-pink-400 text-[10px] font-bold shadow cursor-pointer">🧬 Lai Giống</button>
                <button onclick="openMarketMenu()" class="bg-amber-600/90 px-2 py-1 rounded-full border border-amber-400 text-[10px] font-bold shadow cursor-pointer">🛒 Chợ</button>
                <button onclick="openArenaMenu()" class="bg-red-600/90 px-2 py-1 rounded-full border border-red-400 text-[10px] font-bold shadow cursor-pointer">⚔️ PvP</button>
                <button onclick="openFarmMenu()" class="bg-emerald-600/90 px-2 py-1 rounded-full border border-emerald-400 text-[10px] font-bold shadow cursor-pointer">🏡 Trại</button>
                <button onclick="openTeamMenu()" class="bg-black/80 px-2 py-1 rounded-full border border-white/20 text-[10px] font-bold cursor-pointer">🎒(<span id="team-count">0</span>/3)</button>
            </div>
        </div>

        <div id="map-container-wrap" class="my-1 rounded-xl overflow-hidden border border-zinc-800 relative grow">
            <div id="map"></div>
            <button onclick="recenterMap()" class="absolute bottom-6 right-4 z-30 bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-full shadow-2xl border border-blue-400 active:scale-95 transition-transform flex items-center justify-center text-lg cursor-pointer" title="Về vị trí của tôi">
                📍
            </button>
        </div>

        <div class="flex flex-col items-center z-30 pb-1 shrink-0">
            <div id="stamina-info" class="text-[11px] font-bold text-amber-300 bg-black/80 px-3 py-1 rounded-full border border-white/20 mb-1 shadow-lg flex items-center gap-1.5">
                ⚡ Năng lượng: <span id="stamina-count">15</span>/15 (<span id="stamina-timer">10:00</span>)
            </div>
            <button onclick="spawnMultipleMonsters()" class="w-full max-w-xs bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded-xl border border-zinc-700 shadow-xl transition-all text-[11px] cursor-pointer">
                🔄 Quét lại khu vực (GPS & Thú)
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH MINIGAME BẮT THÚ AR & DÂY VÀNG -->
    <div id="ar-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-900">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        </div>
        <canvas id="gameCanvas" class="absolute inset-0 z-10 touch-none"></canvas>
        <div class="flex justify-between items-center z-20 p-4 pointer-events-auto">
            <button onclick="exitARScreen()" class="bg-black/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">
                ⬅️ Quay lại bản đồ
            </button>
            <div id="ar-mon-info" class="bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold text-yellow-300">
                Mục tiêu: Đang tải...
            </div>
        </div>
        <div class="flex flex-col items-center z-20 pb-8 pointer-events-none">
            <div id="tug-of-war-ui" class="hidden flex flex-col items-center w-full max-w-xs bg-black/85 p-3 rounded-2xl border border-amber-500/50 pointer-events-auto mb-2 shadow-2xl">
                <div class="text-xs font-bold text-amber-300 mb-1 animate-pulse">🎣 GIẰNG CO KÉO THÚ! CHẠM LIÊN TỤC!</div>
                <div class="w-full bg-zinc-900 rounded-full h-3 overflow-hidden border border-zinc-700 mb-1 relative">
                    <div id="tug-progress-bar" class="bg-gradient-to-r from-red-500 via-yellow-500 to-emerald-400 h-full transition-all duration-75" style="width: 50%"></div>
                </div>
                <div class="text-[10px] text-zinc-300">Tap liên tay để kéo đầy thanh thừng!</div>
            </div>
            <div id="ar-instruction" class="text-[11px] text-zinc-300 mt-1 bg-black/60 px-3 py-1 rounded-full border border-white/10">🤠 Chạm vào màn hình để quăng vòng dây thừng!</div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẤU TRƯỜNG VÒNG TRÒN LAO VÀO NHAU -->
    <div id="battle-screen" class="hidden absolute inset-0 z-30 flex flex-col justify-between bg-zinc-950 p-4">
        <div class="flex justify-between items-center z-20">
            <div id="battle-title-tag" class="bg-red-600/90 px-4 py-1.5 rounded-full font-bold text-xs border border-red-400">⚔️ ĐẤU TRƯỜNG V6.8</div>
            <button onclick="exitBattleScreen()" class="bg-black/80 px-4 py-1.5 rounded-full border border-white/20 text-xs font-bold cursor-pointer">Rút lui</button>
        </div>
        <div class="relative flex-1 my-4 bg-gradient-to-b from-amber-950/80 via-zinc-900 to-zinc-950 rounded-2xl border-2 border-amber-500/60 overflow-hidden flex flex-col items-center justify-center shadow-2xl">
            <canvas id="battleCanvas" class="absolute inset-0 w-full h-full"></canvas>
            <div id="damage-popup-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            <div id="battle-log" class="absolute bottom-4 bg-black/90 px-5 py-2.5 rounded-xl text-xs text-yellow-300 font-bold border border-yellow-500/50 text-center max-w-sm shadow-xl">
                Đang giao chiến...
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY CHUNG -->
    <div id="modal-container" class="hidden absolute inset-0 z-40 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto relative"></div>
    </div>

    <!-- YOUTUBE IFRAME API SCRIPT -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let farm = JSON.parse(localStorage.getItem('ar_farm') || '[]');
        let playerCoins = parseInt(localStorage.getItem('ar_coins') || '1500');
        let towerFloor = parseInt(localStorage.getItem('ar_tower_floor') || '1');
        let bossLevel = parseInt(localStorage.getItem('ar_boss_level') || '1');
        let stamina = parseInt(localStorage.getItem('ar_stamina') || '15');
        let lastStaminaTime = parseInt(localStorage.getItem('ar_stamina_time') || Date.now());

        let inventory = JSON.parse(localStorage.getItem('ar_inventory') || JSON.stringify({
            food: 15, toy: 15, trainer: 10,
            stoneKim: 5, stoneMoc: 5, stoneThuy: 5, stoneHoa: 5, stoneTho: 5
        }));

        let dailyQuests = JSON.parse(localStorage.getItem('ar_quests') || JSON.stringify([
            { id: 1, title: 'Bắt 3 linh thú bất kỳ', target: 3, progress: 0, reward: 200, claimed: false },
            { id: 2, title: 'Thắng 2 trận đấu trường', target: 2, progress: 0, reward: 300, claimed: false },
            { id: 3, title: 'Cho linh thú ăn 2 lần', target: 2, progress: 0, reward: 150, claimed: false }
        ]));

        let ytPlayer = null;
        let isMusicReady = false;
        const LOBBY_YOUTUBE_ID = 'jfKfPfyJRdk';
        const BATTLE_YOUTUBE_ID = '5qap5aO4i9A';

        function onYouTubeIframeAPIReady() {
            try {
                ytPlayer = new YT.Player('yt-player', {
                    height: '0', width: '0', videoId: LOBBY_YOUTUBE_ID,
                    playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': LOBBY_YOUTUBE_ID, 'controls': 0 },
                    events: { 'onReady': (e) => { isMusicReady = true; e.target.setVolume(50); e.target.playVideo(); } }
                });
            } catch(e){}
        }

        let isMusicPlaying = false;
        document.addEventListener('click', () => {
            if (!isMusicPlaying && isMusicReady && ytPlayer) { isMusicPlaying = true; ytPlayer.playVideo(); }
        }, { once: true });

        function switchGameMusic(scene) {
            if (!isMusicReady || !ytPlayer) return;
            if (scene === 'battle') ytPlayer.loadVideoById(BATTLE_YOUTUBE_ID);
            else if (scene === 'map') ytPlayer.loadVideoById(LOBBY_YOUTUBE_ID);
        }

        const possibleTraits = [
            { name: 'Khả năng Làm choáng', icon: '💫', type: 'stun', chance: 20 },
            { name: 'Đòn đánh Trúng độc', icon: '🟢', type: 'poison', chance: 25 },
            { name: 'Thiêu đốt diện rộng', icon: '🔥', type: 'burn', chance: 22 },
            { name: 'Làm chậm đối thủ', icon: '❄️', type: 'slow', chance: 25 },
            { name: 'Hộ thân Buff Giáp', icon: '🛡️', type: 'shield', chance: 30 }
        ];

        // 🌟 HỆ THỐNG PHẨM CHẤT & ĐỘ HIẾM LINH THÚ (Trang, Xanh, Vàng, Đỏ, Tím)
        const rarities = [
            { name: 'Thường', color: 'text-zinc-300', bg: 'border-zinc-600', badge: '⚪ Trang', rate: 50, statMultiplier: 1.0 },
            { name: 'Hiếm', color: 'text-emerald-400', bg: 'border-emerald-500', badge: '🟢 Xanh', rate: 25, statMultiplier: 1.3 },
            { name: 'Cực Hiếm', color: 'text-yellow-400', bg: 'border-yellow-500', badge: '🟡 Vàng', rate: 15, statMultiplier: 1.6 },
            { name: 'Huyền Thoại', color: 'text-red-500', bg: 'border-red-500', badge: '🔴 Đỏ', rate: 7, statMultiplier: 2.0 },
            { name: 'Thần Thánh', color: 'text-purple-400', bg: 'border-purple-500', badge: '🟣 Tím', rate: 3, statMultiplier: 2.5 }
        ];

        function getRandomRarity() {
            let roll = Math.random() * 100;
            let cumulative = 0;
            for (let r of rarities) {
                cumulative += r.rate;
                if (roll <= cumulative) return r;
            }
            return rarities[0];
        }

        function sanitizePetsData(petList) {
            return petList.map(p => {
                let rarity = p.rarity || getRandomRarity();
                return {
                    ...p,
                    maxHp: p.maxHp || p.hp || 150,
                    hp: (p.hp !== undefined && p.hp > 0) ? p.hp : (p.maxHp || 150),
                    level: p.level || 1,
                    atk: p.atk || 40,
                    gender: p.gender || (Math.random() < 0.5 ? 'Đực' : 'Cái'),
                    rarity: rarity,
                    critRate: p.critRate ?? 0,
                    dodgeRate: p.dodgeRate ?? 0,
                    accuracy: p.accuracy ?? 0,
                    blockRate: p.blockRate ?? 0,
                    slowResist: p.slowResist ?? 0,
                    speed: p.speed ?? 0,
                    trait: p.trait || possibleTraits[Math.floor(Math.random() * possibleTraits.length)],
                    hunger: p.hunger !== undefined ? p.hunger : 90,
                    happiness: p.happiness !== undefined ? p.happiness : 90
                };
            });
        }
        team = sanitizePetsData(team);
        farm = sanitizePetsData(farm);

        const allMonsters = [
            { id: 101, name: 'Gà Ta', emoji: '🐔', hp: 100, maxHp: 100, atk: 35 },
            { id: 102, name: 'Vịt Cỏ', emoji: '🦆', hp: 90, maxHp: 90, atk: 30 },
            { id: 201, name: 'Chó Vàng', emoji: '🐕', hp: 120, maxHp: 120, atk: 45 },
            { id: 202, name: 'Mèo Mướp', emoji: '🐈', hp: 110, maxHp: 110, atk: 42 },
            { id: 203, name: 'Heo Ủn Ỉn', emoji: '🐖', hp: 140, maxHp: 140, atk: 38 },
            { id: 302, name: 'Chim Lửa', emoji: '🐦', hp: 100, maxHp: 100, atk: 55 },
            { id: 401, name: 'Rồng Nước', emoji: '🐉', hp: 180, maxHp: 180, atk: 65 }
        ];

        let currentWildMonster = null;

        function saveInventory() { localStorage.setItem('ar_inventory', JSON.stringify(inventory)); }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }

        function checkPetSurvival() {
            team = team.filter(p => p.hp > 0 && p.hunger > 0);
            farm = farm.filter(p => p.hp > 0 && p.hunger > 0);
            localStorage.setItem('ar_team', JSON.stringify(team));
            localStorage.setItem('ar_farm', JSON.stringify(farm));
            updateTeamCount();
        }

        // ⚡ HỆ THỐNG NĂNG LƯỢNG & ĐẾM NGƯỢC THỜI GIAN
        function initStaminaSystem() {
            setInterval(() => {
                let now = Date.now();
                let diffSec = Math.floor((now - lastStaminaTime) / 1000);
                let coolDownTime = 600; // 10 phút = 600 giây
                let remainingSec = Math.max(0, coolDownTime - diffSec);

                if (stamina < 15) {
                    if (diffSec >= coolDownTime) {
                        stamina = Math.min(15, stamina + 1);
                        lastStaminaTime = now;
                        localStorage.setItem('ar_stamina', stamina);
                        localStorage.setItem('ar_stamina_time', lastStaminaTime);
                        remainingSec = coolDownTime;
                    }
                } else {
                    lastStaminaTime = now;
                }

                let minStr = String(Math.floor(remainingSec / 60)).padStart(2, '0');
                let secStr = String(remainingSec % 60).padStart(2, '0');
                
                let countEl = document.getElementById('stamina-count');
                let timerEl = document.getElementById('stamina-timer');
                if (countEl) countEl.innerText = stamina;
                if (timerEl) timerEl.innerText = stamina >= 15 ? 'MAX' : `${minStr}:${secStr}`;
            }, 1000);
            let bossTag = document.getElementById('boss-lvl-tag');
            if (bossTag) bossTag.innerText = `Lv.${bossLevel}`;
        }

        // 👹 BOSS THẾ GIỚI
        function openWorldBossMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let canFight = team.length === 3;
            let currentBossHp = 300 + (bossLevel * 100);
            let currentBossAtk = 30 + (bossLevel * 8);

            content.innerHTML = `
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-amber-400">👹 Hắc Long Vương (Cấp ${bossLevel})</h3>
                <button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button>
            </div>
            <div class="flex flex-col items-center bg-zinc-800 p-4 rounded-2xl border border-amber-500/40 mb-4 text-center">
                <div class="text-6xl mb-2">🐉🔥</div>
                <div class="font-bold text-base text-yellow-300">Sức mạnh Boss gia tăng theo cấp độ</div>
                <div class="text-xs text-zinc-300 mt-1">HP: ${currentBossHp} | ATK: ${currentBossAtk}</div>
                <div class="text-xs text-amber-300 font-bold mt-2">Yêu cầu: Đội hình đủ 3 linh thú xuất trận! (${team.length}/3)</div>
            </div>
            ${canFight ? `<button onclick="startBattle('boss')" class="w-full bg-amber-600 hover:bg-amber-500 py-3 rounded-xl font-bold text-xs cursor-pointer shadow-lg">⚔️ Xuất Trận 3 Linh Thú Đánh Boss</button>` : `<div class="text-center text-xs text-red-400 font-bold bg-red-950/50 p-3 rounded-xl border border-red-500/50">⚠️ Đội hình chưa đủ 3 linh thú!</div>`}`;
        }

        // 📜 NHIỆM VỤ HẰNG NGÀY
        function openQuestMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-yellow-300">📜 Nhiệm Vụ Hằng Ngày</h3>
                <button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button>
            </div>
            <div class="space-y-3 max-h-80 overflow-y-auto">`;

            dailyQuests.forEach((q, idx) => {
                let isCompleted = q.progress >= q.target;
                let btnHtml = q.claimed ? `<span class="text-xs text-zinc-500 font-bold">Đã nhận</span>` :
                    isCompleted ? `<button onclick="claimQuest(${idx})" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-xs font-bold cursor-pointer">Nhận Thưởng</button>` :
                    `<span class="text-xs text-zinc-400">${q.progress}/${q.target}</span>`;

                html += `
                <div class="bg-zinc-800 p-3 rounded-xl border border-zinc-700 flex items-center justify-between">
                    <div>
                        <div class="font-bold text-xs text-yellow-200">${q.title}</div>
                        <div class="text-[10px] text-zinc-400 mt-0.5">Phần thưởng: ${q.reward} 🪙</div>
                    </div>
                    <div>${btnHtml}</div>
                </div>`;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        function claimQuest(idx) {
            let q = dailyQuests[idx];
            if (q.claimed || q.progress < q.target) return;
            q.claimed = true;
            playerCoins += q.reward;
            localStorage.setItem('ar_coins', playerCoins);
            localStorage.setItem('ar_quests', JSON.stringify(dailyQuests));
            alert(`🎉 Nhận thành công ${q.reward} Vàng!`);
            openQuestMenu();
        }

        function addQuestProgress(questId, amount = 1) {
            let q = dailyQuests.find(item => item.id === questId);
            if (q && !q.claimed) {
                q.progress = Math.min(q.target, q.progress + amount);
                localStorage.setItem('ar_quests', JSON.stringify(dailyQuests));
            }
        }

        // 🛒 CHỢ ĐEN ĐẦY ĐỦ VẬT PHẨM & ĐÁ NGŨ HÀNH
        function openMarketMenu() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-amber-300">🛒 Chợ Đen & Vật Phẩm</h3>
                <button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button>
            </div>
            <div class="text-xs text-yellow-400 font-bold mb-3">💰 Vàng hiện có: <span id="market-coins">${playerCoins}</span> 🪙</div>
            <div class="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-amber-500/50">
                    <div class="text-xs">⚡ Năng Lượng x5 (500🪙)</div>
                    <button onclick="buyShopItem('stamina', 500, 5)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div class="text-xs">🍖 Thức Ăn (50🪙) [Kho: ${inventory.food}]</div>
                    <button onclick="buyShopItem('food', 50, 1)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div class="text-xs">🎾 Đồ Chơi (50🪙) [Kho: ${inventory.toy}]</div>
                    <button onclick="buyShopItem('toy', 50, 1)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="bg-zinc-800 p-2.5 rounded-xl flex items-center justify-between border border-zinc-700">
                    <div class="text-xs">🏋️ Dụng Cụ Tập (100🪙) [Kho: ${inventory.trainer}]</div>
                    <button onclick="buyShopItem('trainer', 100, 1)" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-xs font-bold cursor-pointer">Mua</button>
                </div>
                <div class="text-xs font-bold text-yellow-400 mt-2">💎 Đá Ngũ Hành Cường Hóa (150🪙 / viên)</div>

            if (itemKey === 'stamina') { stamina = Math.min(15, stamina + qty); localStorage.setItem('ar_stamina', stamina); document.getElementById('stamina-count').innerText = stamina; }
            else { inventory[itemKey] = (inventory[itemKey] || 0) + qty; saveInventory(); }

        // 🧬 TRUNG TÂM LAI GIỐNG (2 CON CÙNG LOÀI, KHÁC GIỚI TÍNH)

        function openSelectBreedingParent(slotNum) {
            const content = document.getElementById('modal-content');

            let allPetsPool = [...team, ...farm];
            if (allPetsPool.length === 0) {
                html += `<div class="text-center text-xs text-zinc-400 py-6">Không có linh thú nào!</div>`;
            } else {
                html += `<div class="space-y-2 max-h-60 overflow-y-auto">`;
                allPetsPool.forEach((pet, idx) => {
                    html += `
                    <div onclick="selectParent(${slotNum}, ${idx})" class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between border border-zinc-700 cursor-pointer">

        function selectParent(slotNum, idx) {
            let allPetsPool = [...team, ...farm];
            let pet = allPetsPool[idx];
            if (slotNum === 1) {
                breedingSlots.parent1 = pet;
            } else {
                if (!breedingSlots.parent1) { alert('⚠️ Vui lòng chọn Thú 1 trước!'); return; }
                if (breedingSlots.parent1.emoji !== pet.emoji) { alert('⚠️ Hai linh thú phải cùng loài (cùng Emoji)!'); return; }
                if (breedingSlots.parent1.gender === pet.gender) { alert('⚠️ Hai linh thú phải khác giới tính (Đực & Cái)!'); return; }
                breedingSlots.parent2 = pet;
            }
            openBreedingMenu();
        }

        function executeBreeding() {
            if (!breedingSlots.parent1 || !breedingSlots.parent2) { alert('Chọn đủ 2 thú!'); return; }
            if (playerCoins < 300) { alert('Không đủ vàng!'); return; }

            playerCoins -= 300; localStorage.setItem('ar_coins', playerCoins);
            let template = breedingSlots.parent1;
            let randomTrait = possibleTraits[Math.floor(Math.random() * possibleTraits.length)];
            let newRarity = getRandomRarity();
            let childPet = {
                ...template, name: `F1_${template.name}`, level: 1,
                gender: Math.random() < 0.5 ? 'Đực' : 'Cái', rarity: newRarity, trait: randomTrait,
                hp: Math.floor((template.maxHp + 40) * newRarity.statMultiplier),
                maxHp: Math.floor((template.maxHp + 40) * newRarity.statMultiplier),
                atk: Math.floor((template.atk + 20) * newRarity.statMultiplier),
                hunger: 100, happiness: 100
            };

            farm.push(childPet); localStorage.setItem('ar_farm', JSON.stringify(farm));
            breedingSlots = { parent1: null, parent2: null };
            alert(`🧬 Lai giống thành công! Nhận linh thú phẩm chất ${newRarity.badge} (${childPet.name}) đưa vào Trại.`);
            openFarmMenu();
        }

        function petAction(index, action) {
            let pet = team[index];
            if (action === 'feed') {
                if (inventory.food <= 0) { alert('Hết thức ăn!'); return; }
                inventory.food--; pet.hunger = Math.min(100, pet.hunger + 30); pet.hp = Math.min(pet.maxHp, pet.hp + 25);
                addQuestProgress(3, 1);
            } else if (action === 'play') {
                if (inventory.toy <= 0) { alert('Hết đồ chơi!'); return; }
                inventory.toy--; pet.happiness = Math.min(100, pet.happiness + 35);
            } else if (action === 'train') {
                if (inventory.trainer <= 0) { alert('Hết dụng cụ!'); return; }
                inventory.trainer--; pet.level++; pet.atk += 10; pet.maxHp += 20; pet.hp = pet.maxHp;
            }
            saveInventory(); localStorage.setItem('ar_team', JSON.stringify(team));
            openPetDetail(index);
        }

        function openTowerMenu() {
            checkPetSurvival();
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🗼 Tháp Vô Tận (Tầng ${towerFloor})</h3><button onclick="closeModal()" class="bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-bold text-sm cursor-pointer border border-zinc-600">✕</button></div>

            content.innerHTML = `

            <button onclick="startBattle('arena')" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold text-xs cursor-pointer shadow-lg">⚔️ Tìm Trận Đấu Thường</button>`;
        }

        // 🌍 GPS & BẢN ĐỒ LEAFLET
        let map, userMarker, activeMarkers = [];
        let userLat = 10.0452, userLng = 105.7469;

        function initMap() {
            if (map) return;
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    if (map) map.setView([userLat, userLng], 17);
                    if (userMarker) userMarker.setLatLng([userLat, userLng]);
                    spawnMultipleMonsters();
                }, error => {}, { enableHighAccuracy: true });
            }

            map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            const userIcon = L.divIcon({
                className: 'leaflet-div-icon',
                html: '<div style="font-size: 28px; filter: drop-shadow(0 0 8px rgba(59,130,246,0.8));">📍</div>',
                iconSize: [30, 30], iconAnchor: [15, 15]
            });
            userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);
            spawnMultipleMonsters();
        }

        function recenterMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    if (map) map.setView([userLat, userLng], 17);
                    if (userMarker) userMarker.setLatLng([userLat, userLng]);
                });
            } else if (map) { map.setView([userLat, userLng], 17); }
        }

        function spawnMultipleMonsters() {
            if (!map) return;
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            for (let i = 0; i < 6; i++) {
                const baseTemplate = allMonsters[Math.floor(Math.random() * allMonsters.length)];
                let rarity = getRandomRarity();
                const monsterData = {
                    ...baseTemplate, rarity: rarity,
                    hp: Math.floor(baseTemplate.hp * rarity.statMultiplier),
                    maxHp: Math.floor(baseTemplate.maxHp * rarity.statMultiplier),
                    atk: Math.floor(baseTemplate.atk * rarity.statMultiplier),
                    lat: userLat + (Math.random() - 0.5) * 0.003,
                    lng: userLng + (Math.random() - 0.5) * 0.003
                };
                
                const monsterIcon = L.divIcon({
                    className: 'leaflet-div-icon',
                    html: `<div style="font-size: 36px; filter: drop-shadow(0 0 8px gold);" title="${rarity.badge}">${monsterData.emoji}</div>`,
                    iconSize: [38, 38], iconAnchor: [19, 19]
                });

                const marker = L.marker([monsterData.lat, monsterData.lng], { icon: monsterIcon }).addTo(map);
                marker.on('click', () => {
                    if (stamina <= 0) { alert('⚡ Hết Năng Lượng!'); return; }
                    currentWildMonster = monsterData;
                    enterARScreen();
                });
                activeMarkers.push(marker);
            }
        }

        // 🎮 MINIGAME BẮT THÚ AR & FIX LỖI KẸT DÂY THỪNG
        let canvas, ctx, isARActive = false;
        let rope = { x: 0, y: 0, vx: 0, vy: 0, flying: false, flightTime: 0 };
        let monsterPos = { x: 0, y: 0, vx: 1.5, vy: 1 };
        let isTugOfWarActive = false, tugProgress = 50, tugTimerInterval = null;
        let ropeShakeTimer = 0;

        function enterARScreen() {
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('ar-screen').classList.remove('hidden');
            isARActive = true; isTugOfWarActive = false;
            document.getElementById('tug-of-war-ui').classList.add('hidden');
            document.getElementById('ar-mon-info').innerHTML = `${currentWildMonster.emoji} ${currentWildMonster.name} <span class="${currentWildMonster.rarity.color}">${currentWildMonster.rarity.badge}</span>`;

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
                document.getElementById('camera-feed').srcObject = stream;
            }).catch(e => {});
            initCanvasGame();
        }

        function exitARScreen() {
            isARActive = false; isTugOfWarActive = false;
            if (tugTimerInterval) clearInterval(tugTimerInterval);
            const videoEl = document.getElementById('camera-feed');
            if (videoEl.srcObject) videoEl.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('ar-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if(map) map.invalidateSize();
        }

        function initCanvasGame() {
            canvas = document.getElementById('gameCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;

            monsterPos.x = canvas.width / 2; monsterPos.y = canvas.height * 0.3;
            resetRope();

            canvas.onpointerdown = () => {
                if (isTugOfWarActive) {
                    tugProgress = Math.min(100, tugProgress + 12);
                    document.getElementById('tug-progress-bar').style.width = tugProgress + '%';
                    if (tugProgress >= 100) triggerTugWin();
                }
            };

            canvas.onpointerup = (e) => {
                if (isTugOfWarActive || rope.flying) return;
                if (stamina > 0) { stamina--; localStorage.setItem('ar_stamina', stamina); }
                rope.vx = (e.clientX - rope.x) * 0.12;
                rope.vy = (e.clientY - rope.y) * 0.12;
                rope.flying = true;
                rope.flightTime = 0;
            };
            requestAnimationFrame(updateCanvasGame);
        }

        function resetRope() { rope.x = canvas.width / 2; rope.y = canvas.height * 0.85; rope.flying = false; rope.flightTime = 0; }

        function updateCanvasGame() {
            if (!isARActive || !ctx || !canvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ropeShakeTimer += 0.2;
            let shakeOffset = isTugOfWarActive ? Math.sin(ropeShakeTimer * 3) * 12 : 0;

            if (!isTugOfWarActive) {
                monsterPos.x += monsterPos.vx;
                if (monsterPos.x < 50 || monsterPos.x > canvas.width - 50) monsterPos.vx *= -1;
            }

            ctx.font = "75px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(currentWildMonster.emoji, monsterPos.x, monsterPos.y + shakeOffset);

            if (rope.flying) {
                rope.x += rope.vx; rope.y += rope.vy;
                rope.flightTime++;
                ctx.beginPath(); ctx.moveTo(canvas.width / 2, canvas.height * 0.85); ctx.lineTo(rope.x, rope.y);
                ctx.strokeStyle = "#d4a373"; ctx.lineWidth = 4; ctx.stroke();

                if (Math.hypot(rope.x - monsterPos.x, rope.y - monsterPos.y) < 60) {
                    rope.flying = false; startTugOfWarSession();
                } else if (rope.flightTime > 40 || rope.x < 0 || rope.x > canvas.width || rope.y < 0) {
                    resetRope();
                }
            }

            if (isTugOfWarActive) {
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, canvas.height * 0.85);
                ctx.lineTo(monsterPos.x, monsterPos.y + shakeOffset);
                ctx.strokeStyle = "#eab308";
                ctx.lineWidth = 6 + Math.sin(ropeShakeTimer * 5) * 2;
                ctx.stroke();
                ctx.font = "40px sans-serif";
                ctx.fillText("🪢", rope.x, rope.y + shakeOffset);
            }
            requestAnimationFrame(updateCanvasGame);
        }

        function startTugOfWarSession() {
            isTugOfWarActive = true; tugProgress = 50;
            document.getElementById('tug-progress-bar').style.width = '50%';
            document.getElementById('tug-of-war-ui').classList.remove('hidden');

            if (tugTimerInterval) clearInterval(tugTimerInterval);
            tugTimerInterval = setInterval(() => {
                if (!isARActive || !isTugOfWarActive) { clearInterval(tugTimerInterval); return; }
                tugProgress -= 1.5;
                document.getElementById('tug-progress-bar').style.width = Math.max(0, tugProgress) + '%';
                if (tugProgress >= 100) triggerTugWin();
                else if (tugProgress <= 0) {
                    clearInterval(tugTimerInterval); isTugOfWarActive = false;
                    document.getElementById('tug-of-war-ui').classList.add('hidden');
                    exitARScreen();
                }
            }, 50);
        }

        function triggerTugWin() {
            if (!isTugOfWarActive) return;
            isTugOfWarActive = false; clearInterval(tugTimerInterval);
            document.getElementById('tug-of-war-ui').classList.add('hidden');
            exitARScreen();

            let newPet = {
                ...currentWildMonster,
                level: 1,
                gender: Math.random() < 0.5 ? 'Đực' : 'Cái',
                trait: possibleTraits[Math.floor(Math.random() * possibleTraits.length)],
                hunger: 100,
                happiness: 100
            };

            if (team.length < 3) {
                team.push(newPet);
                localStorage.setItem('ar_team', JSON.stringify(team));
                alert(`🎉 Bắt thành công ${newPet.name} (${newPet.rarity.badge})! Đã đưa vào Đội Hình.`);
            } else {
                farm.push(newPet);
                localStorage.setItem('ar_farm', JSON.stringify(farm));
                alert(`🎉 Đội hình đầy, đã chuyển ${newPet.name} (${newPet.rarity.badge}) vào Trang Trại!`);
            }
            addQuestProgress(1, 1);
            updateTeamCount(); spawnMultipleMonsters();
        }

        // ⚔️ ĐẤU TRƯỜNG & BOSS: VÒNG TRÒN XOAY, LAO VÀO NHAU & 3 QUÁI ĐÁNH 1
        let battleCanvas, battleCtx, battleInterval;
        function startBattle(mode) {
            checkPetSurvival();
            if (team.length === 0) { alert('Đội hình trống!'); return; }
            if (mode === 'boss' && team.length < 3) { alert('⚠️ Boss yêu cầu đủ 3 linh thú trong đội hình!'); return; }
            closeModal();
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            switchGameMusic('battle');

            let activeTeam = mode === 'boss' ? [...team] : [team[0]];
            let teamHpList = activeTeam.map(p => p.hp);

            let enemy = mode === 'boss' ? { name: `Hắc Long Vương (Lv.${bossLevel})`, emoji: '🐉', hp: 300 + (bossLevel * 100), maxHp: 300 + (bossLevel * 100), atk: 30 + (bossLevel * 8) } :
                        mode === 'tower' ? { name: `Thủ Vệ Tầng ${towerFloor}`, emoji: '👹', hp: 120 + (towerFloor * 25), maxHp: 120 + (towerFloor * 25), atk: 20 + towerFloor * 4 } :
                        { name: 'Đối Thủ PvP', emoji: '🤖', hp: 160, maxHp: 160, atk: 25 };

            let enemyHp = enemy.hp;

            battleCanvas = document.getElementById('battleCanvas');
            battleCtx = battleCanvas.getContext('2d');
            battleCanvas.width = battleCanvas.clientWidth; battleCanvas.height = battleCanvas.clientHeight;

            let angle = 0;
            let battleStep = 0;
            let state = 'circle'; // 'circle' xoay vòng tròn -> 'charge' lao vào nhau

            battleInterval = setInterval(() => {
                battleCtx.clearRect(0, 0, battleCanvas.width, battleCanvas.height);
                battleStep++;
                let cx = battleCanvas.width / 2, cy = battleCanvas.height / 2;

                let myCenterX = cx - 90, myCenterY = cy;
                let enX = cx + 90, enY = cy;

                if (state === 'circle') {
                    angle += 0.08;
                    // Hiệu ứng di chuyển vòng tròn trước khi lao vào
                    myCenterX = cx + Math.cos(angle) * 70 - 70;
                    myCenterY = cy + Math.sin(angle) * 35;
                    enX = cx + Math.cos(angle + Math.PI) * 70 + 70;
                    enY = cy + Math.sin(angle + Math.PI) * 35;

                    if (battleStep > 40) { state = 'charge'; battleStep = 0; }
                } else if (state === 'charge') {
                    // Lao thẳng vào giữa đấu trường
                    myCenterX = cx - 35;
                    enX = cx + 35;
                    myCenterY = cy;
                    enY = cy;

                    if (battleStep > 12) {
                        let totalDmg = 0;
                        activeTeam.forEach((pet, i) => {
                            if (teamHpList[i] > 0) {
                                totalDmg += Math.floor(pet.atk * (0.7 + Math.random() * 0.3));
                            }
                        });
                        enemyHp -= totalDmg;

                        let enDmg = Math.floor(enemy.atk * (0.7 + Math.random() * 0.3));
                        let targetIdx = teamHpList.findIndex(h => h > 0);
                        if (targetIdx !== -1) {
                            teamHpList[targetIdx] -= enDmg;
                            activeTeam[targetIdx].hp = Math.max(0, teamHpList[targetIdx]);
                        }

                        document.getElementById('battle-log').innerText = `Đội hình tấn công gây ${totalDmg} dmg | ${enemy.name} phản công ${enDmg} dmg!`;
                        state = 'circle'; battleStep = 0;
                    }
                }

                // Vẽ Boss (hoặc đối thủ) ở bên phải
                battleCtx.font = "70px sans-serif"; battleCtx.textAlign = "center";
                battleCtx.fillText(enemy.emoji, enX, enY);
                battleCtx.fillStyle = 'red'; battleCtx.fillRect(enX - 30, enY - 50, 60, 8);
                battleCtx.fillStyle = 'emerald'; battleCtx.fillRect(enX - 30, enY - 50, (Math.max(0, enemyHp) / enemy.maxHp) * 60, 8);

                // Vẽ các linh thú bên mình
                activeTeam.forEach((pet, i) => {
                    if (teamHpList[i] > 0) {
                        let posY = myCenterY + (i - 1) * 45;
                        battleCtx.font = "55px sans-serif";
                        battleCtx.fillText(pet.emoji, myCenterX, posY);
                        battleCtx.fillStyle = 'red'; battleCtx.fillRect(myCenterX - 25, posY - 45, 50, 6);
                        battleCtx.fillStyle = 'emerald'; battleCtx.fillRect(myCenterX - 25, posY - 45, (Math.max(0, teamHpList[i]) / pet.maxHp) * 50, 6);
                    }
                });

                let allTeamDead = teamHpList.every(h => h <= 0);

                if (enemyHp <= 0 || allTeamDead) {
                    clearInterval(battleInterval);
                    if (enemyHp <= 0) {
                        let rewardGold = mode === 'boss' ? 700 + (bossLevel * 200) : mode === 'tower' ? 300 + (towerFloor * 50) : 350;
                        playerCoins += rewardGold; localStorage.setItem('ar_coins', playerCoins);
                        addQuestProgress(2, 1);
                        if (mode === 'tower') {
                            towerFloor++;
                            localStorage.setItem('ar_tower_floor', towerFloor);
                        } else if (mode === 'boss') {
                            bossLevel++;
                            localStorage.setItem('ar_boss_level', bossLevel);
                            let bossTag = document.getElementById('boss-lvl-tag');
                            if (bossTag) bossTag.innerText = `Lv.${bossLevel}`;
                        }
                        alert(`🏆 Chiến thắng vinh quang! Nhận +${rewardGold} Vàng${mode === 'boss' ? ` & Hắc Long Vương tăng cấp (Lv.${bossLevel})!` : ''}`);
                    } else {
                        alert('💀 Thất bại! Cả đội hình đã gục ngã.');
                    }
                    exitBattleScreen();
                }
            }, 25);
        }

        function exitBattleScreen() {
            switchGameMusic('map');
            if (battleInterval) clearInterval(battleInterval);
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            if (map) map.invalidateSize();
        }

        function updateTeamCount() {
            let countEl = document.getElementById('team-count');
            if (countEl) countEl.innerText = team.length;
        }

        window.onload = () => {
            initMap(); initStaminaSystem(); updateTeamCount();
            setTimeout(() => { if(map) map.invalidateSize(); }, 400);
        };
        window.onresize = () => { if (map) setTimeout(() => map.invalidateSize(), 200); };
    </script>
