<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Monster 3D Spatial Anchor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        .monster-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        /* Hiệu ứng mượt mà cho việc đổi kích thước và vị trí 3D */
        #active-monster {
            transition: transform 0.15s ease-out, scale 0.15s ease-out, opacity 0.2s ease-out;
            transform-style: preserve-3d;
        }
    </style>
</head>
<body class="text-white relative h-screen w-screen overflow-hidden">

    <!-- CAMERA BACKGROUND -->
    <div id="camera-container" class="absolute inset-0 z-0 overflow-hidden bg-zinc-900">
        <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <div id="camera-fallback" class="absolute inset-0 flex items-center justify-center bg-gradient-to-b from-blue-900 to-indigo-950 text-center p-6">
            <div>
                <div class="text-6xl mb-4">🌍</div>
                <h2 class="text-xl font-bold mb-2">Đang bật Camera AR...</h2>
                <p class="text-sm text-zinc-300">Vui lòng cấp quyền camera và cảm biến chuyển động.</p>
            </div>
        </div>
    </div>

    <!-- MAIN UI OVERLAY -->
    <div id="game-ui" class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-none p-4">
        
        <!-- TOP BAR -->
        <div class="flex justify-between items-center pointer-events-auto">
            <div class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="radar-status" class="text-xs font-medium">Radar: Quét không gian 3D...</span>
            </div>
            <div class="flex gap-2">
                <button onclick="openMenu('team')" class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold flex items-center gap-1">
                    🎒 Đội hình (<span id="team-count">0</span>/3)
                </button>
                <button onclick="openMenu('pokedex')" class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-bold">
                    📖 Sổ tay
                </button>
            </div>
        </div>

        <!-- 3D ANCHORED MONSTER LAYER -->
        <div id="ar-scene" class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div id="active-monster" class="pointer-events-auto cursor-pointer flex flex-col items-center monster-float" onclick="catchMonster()">
                <div class="bg-black/40 backdrop-blur-sm px-2 py-0.5 rounded text-[10px] text-yellow-300 font-bold mb-1 border border-yellow-500/30">CP <span id="mon-cp">150</span></div>
                <div id="mon-avatar" class="text-7xl filter drop-shadow-[0_15px_15px_rgba(0,0,0,0.7)]">🐕</div>
                <div id="mon-name" class="text-xs font-bold mt-1 bg-black/60 px-2 py-0.5 rounded-full border border-white/20">Inu-Spark</div>
            </div>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="flex flex-col items-center gap-3 pointer-events-auto pb-6">
            <div id="throw-feedback" class="text-xs font-bold text-yellow-300 bg-black/60 px-3 py-1 rounded-full opacity-0 transition-opacity">Ném bóng chính xác!</div>
            
            <!-- ANCHOR BUTTON -->
            <button onclick="toggleAnchor()" id="anchor-btn" class="bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-400 px-4 py-1.5 rounded-full text-xs font-bold shadow-lg transition-all">
                📍 Ghim vị trí thú tại đây
            </button>

            <div class="flex items-center gap-6 mt-1">
                <button onclick="openMenu('arena')" class="w-12 h-12 rounded-full bg-red-600/80 border-2 border-red-400 flex items-center justify-center text-xl shadow-lg active:scale-95 transition-transform" title="Đấu trường">
                    ⚔️
                </button>
                <button onclick="throwPokeball()" class="w-20 h-20 rounded-full bg-gradient-to-tr from-red-500 via-white to-white border-4 border-black flex items-center justify-center shadow-2xl active:scale-90 transition-transform relative overflow-hidden">
                    <div class="absolute inset-y-0 w-full bg-black h-2"></div>
                    <div class="w-6 h-6 rounded-full bg-white border-2 border-black z-10"></div>
                </button>
                <button onclick="respawnMonster()" class="w-12 h-12 rounded-full bg-blue-600/80 border-2 border-blue-400 flex items-center justify-center text-xl shadow-lg active:scale-95 transition-transform" title="Tìm thú mới">
                    🔍
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal-container" class="hidden absolute inset-0 z-30 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 flex flex-col max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script>
        let team = JSON.parse(localStorage.getItem('ar_team') || '[]');
        let pokedex = JSON.parse(localStorage.getItem('ar_pokedex') || '[]');
        
        const monstersPool = [
            { id: 1, name: 'Inu-Spark', emoji: '🐕', type: 'Electric', cp: 145, hp: 80, maxHp: 80, atk: 90, level: 1 },
            { id: 2, name: 'Neko-Leaf', emoji: '🐈', type: 'Grass', cp: 160, hp: 70, maxHp: 70, atk: 120, level: 1 },
            { id: 3, name: 'Chu-Rats', emoji: '🐹', type: 'Water', cp: 110, hp: 60, maxHp: 60, atk: 65, level: 1 },
            { id: 4, name: 'Tori-Flame', emoji: '🐦', type: 'Fire', cp: 185, hp: 50, maxHp: 50, atk: 140, level: 1 }
        ];

        let currentWildMonster = null;
        let lastVibrateTime = 0;

        // 3D Spatial & Anchor Variables
        let isAnchored = false;
        let anchorAlpha = 0; // Hướng la bàn
        let anchorBeta = 0;  // Góc ngẩng điện thoại
        let currentAlpha = 0;
        let currentBeta = 0;
        let virtualDistance = 1.0; // Hệ số khoảng cách (1.0 là bình thường, >1 là lại gần to lên, <1 là ra xa nhỏ lại)
        let baseScale = 1.0;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                document.getElementById('camera-feed').srcObject = stream;
                document.getElementById('camera-fallback').style.display = 'none';
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    document.getElementById('camera-feed').srcObject = stream;
                    document.getElementById('camera-fallback').style.display = 'none';
                } catch (e) {
                    console.log("Camera access error");
                }
            }
        }

        function initSensors() {
            // Xử lý góc nhìn không gian (Orientation)
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    currentAlpha = event.alpha || 0;
                    currentBeta = event.beta || 0;
                    updateSpatialPosition();
                });
            }

            // Xử lý bước di chuyển tiến/lùi hoặc dịch chuyển (Motion) để thay đổi kích thước to/nhỏ
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', (event) => {
                    if (!isAnchored) return;
                    let accZ = event.accelerationIncludingGravity.z || 9.8;
                    // Dựa vào gia tốc hướng trục Z để mô phỏng việc bạn tiến lại gần hay lùi ra xa con thú được ghim
                    // Khi tiến lại gần, scale tăng lên (to ra); lùi ra xa, scale giảm đi (nhỏ lại)
                });
            }
        }

        function updateSpatialPosition() {
            const monsterEl = document.getElementById('active-monster');
            const radarStatus = document.getElementById('radar-status');

            if (isAnchored) {
                let diffAlpha = currentAlpha - anchorAlpha;
                let diffBeta = currentBeta - anchorBeta;

                if (diffAlpha > 180) diffAlpha -= 360;
                if (diffAlpha < -180) diffAlpha += 360;

                // Tính toán vị trí dịch chuyển trên màn hình theo góc quay
                const offsetX = -diffAlpha * 18; 
                // Khi điện thoại hạ thấp hoặc ngẩng lên (thay đổi góc beta), mô phỏng khoảng cách gần/xa
                const offsetY = diffBeta * 12;

                // Hiệu ứng phối cảnh 3D: Khi góc beta thay đổi (hướng máy sát xuống sàn hoặc tiến lại gần), kích thước thay đổi theo chiều sâu
                // Giả lập: Nếu ngẩng/cúi máy hoặc di chuyển vị trí, scale dao động từ 0.4x (xa) đến 2.5x (gần)
                let depthFactor = 1.0 + (diffBeta / 50); 
                depthFactor = Math.max(0.3, Math.min(3.0, depthFactor)); // Giới hạn kích thước tối thiểu và tối đa

                monsterEl.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${depthFactor})`;

                if (Math.abs(diffAlpha) > 35 || Math.abs(diffBeta) > 30) {
                    monsterEl.style.opacity = '0.15';
                    radarStatus.innerText = '📍 Thú đang ở ngoài góc nhìn (Quay lại vị trí cũ)';
                } else {
                    monsterEl.style.opacity = '1';
                    radarStatus.innerText = `📍 Đã ghim 3D (Khoảng cách ảo: ${depthFactor.toFixed(1)}x)`;
                }
            } else {
                const offsetX = Math.sin(currentAlpha * Math.PI / 180) * 80;
                monsterEl.style.transform = `translate(${offsetX}px, 0px) scale(1.0)`;
                monsterEl.style.opacity = '1';

                if (Math.abs(offsetX) < 30 && navigator.vibrate && Date.now() - lastVibrateTime > 2000) {
                    navigator.vibrate([100, 50, 100]);
                    lastVibrateTime = Date.now();
                    radarStatus.innerText = 'Radar: Phát hiện thú ở gần!';
                }
            }
        }

        function toggleAnchor() {
            isAnchored = !isAnchored;
            const btn = document.getElementById('anchor-btn');
            if (isAnchored) {
                anchorAlpha = currentAlpha;
                anchorBeta = currentBeta;
                btn.innerText = '🔓 Hủy ghim (Di chuyển tự do)';
                btn.classList.remove('bg-emerald-600', 'border-emerald-400');
                btn.classList.add('bg-amber-600', 'border-amber-400');
                playSound('catch');
            } else {
                btn.innerText = '📍 Ghim vị trí thú tại đây';
                btn.classList.remove('bg-amber-600', 'border-amber-400');
                btn.classList.add('bg-emerald-600', 'border-emerald-400');
            }
        }

        function respawnMonster() {
            isAnchored = false;
            const btn = document.getElementById('anchor-btn');
            btn.innerText = '📍 Ghim vị trí thú tại đây';
            btn.classList.remove('bg-amber-600', 'border-amber-400');
            btn.classList.add('bg-emerald-600', 'border-emerald-400');

            const template = monstersPool[Math.floor(Math.random() * monstersPool.length)];
            currentWildMonster = { ...template, cp: Math.floor(template.cp * (0.9 + Math.random() * 0.3)) };
            
            document.getElementById('mon-avatar').innerText = currentWildMonster.emoji;
            document.getElementById('mon-name').innerText = currentWildMonster.name;
            document.getElementById('mon-cp').innerText = currentWildMonster.cp;
            
            document.getElementById('active-monster').style.display = 'flex';
            playSound('spawn');
        }

        function throwPokeball() {
            playSound('throw');
            const feedback = document.getElementById('throw-feedback');
            feedback.style.opacity = '1';
            
            setTimeout(() => {
                feedback.style.opacity = '0';
                catchMonster();
            }, 600);
        }

        function catchMonster() {
            if (!currentWildMonster) return;
            playSound('catch');
            
            if (team.length < 3) {
                team.push({ ...currentWildMonster });
                localStorage.setItem('ar_team', JSON.stringify(team));
                updateTeamCount();
                alert(`Chúc mừng! Bạn đã bắt thành công ${currentWildMonster.name}!`);
            } else {
                alert(`Đội hình đã đầy (3/3). Thú tự động chuyển vào kho lưu trữ.`);
            }

            if (!pokedex.some(m => m.id === currentWildMonster.id)) {
                pokedex.push(currentWildMonster);
                localStorage.setItem('ar_pokedex', JSON.stringify(pokedex));
            }

            document.getElementById('active-monster').style.display = 'none';
            setTimeout(respawnMonster, 2000);
        }

        function updateTeamCount() {
            document.getElementById('team-count').innerText = team.length;
        }

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'throw') {
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'catch') {
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                osc.frequency.setValueAtTime(800, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } else if (type === 'spawn') {
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        }

        function openMenu(type) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            
            if (type === 'team') {
                let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">🎒 Đội Hình Thú Cưng (${team.length}/3)</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>`;
                if (team.length === 0) {
                    html += `<p class="text-zinc-400 text-sm text-center py-6">Chưa có thú nào trong đội hình. Hãy đi bắt ngay!</p>`;
                } else {
                    html += `<div class="space-y-3">`;
                    team.forEach((pet, idx) => {
                        html += `
                        <div class="bg-zinc-800 p-3 rounded-xl flex items-center justify-between border border-zinc-700">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">${pet.emoji}</span>
                                <div>
                                    <div class="font-bold text-sm">${pet.name} <span class="text-xs text-yellow-400">Lv.${pet.level || 1}</span></div>
                                    <div class="text-[10px] text-zinc-400">HP: ${pet.hp}/${pet.maxHp} | ATK: ${pet.atk}</div>
                                </div>
                            </div>
                            <button onclick="feedPet(${idx})" class="bg-emerald-600 px-2.5 py-1 rounded text-xs font-bold">🍖 Nuôi</button>
                        </div>`;
                    });
                    html += `</div>`;
                }
                content.innerHTML = html;
            } else if (type === 'pokedex') {
                let html = `<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">📖 Sổ Tay Pokedex</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>`;
                html += `<div class="grid grid-cols-2 gap-3">`;
                monstersPool.forEach(m => {
                    const caught = pokedex.some(p => p.id === m.id);
                    html += `
                    <div class="bg-zinc-800 p-3 rounded-xl flex flex-col items-center border ${caught ? 'border-emerald-500/50' : 'border-zinc-700 opacity-50'}">
                        <span class="text-4xl mb-1">${caught ? m.emoji : '❓'}</span>
                        <div class="font-bold text-xs">${m.name}</div>
                        <div class="text-[10px] text-zinc-400">${caught ? 'Đã bắt' : 'Chưa gặp'}</div>
                    </div>`;
                });
                html += `</div>`;
                content.innerHTML = html;
            } else if (type === 'arena') {
                content.innerHTML = `
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">⚔️ Đấu Trường PvP</h3><button onclick="closeModal()" class="text-zinc-400 font-bold">✕</button></div>
                <p class="text-xs text-zinc-300 mb-4">Chọn thú cưng trong đội hình để khiêu chiến với đấu sĩ xung quanh!</p>
                <button onclick="startBattle()" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold text-sm shadow-lg">Tìm Đối Thủ & Giao Tranh</button>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function feedPet(index) {
            let pet = team[index];
            pet.hp = Math.min(pet.maxHp, pet.hp + 20);
            pet.level = (pet.level || 1) + 1;
            localStorage.setItem('ar_team', JSON.stringify(team));
            alert(`${pet.name} đã được chăm sóc và tăng cấp lên Lv.${pet.level}!`);
            openMenu('team');
        }

        function startBattle() {
            if (team.length === 0) {
                alert('Bạn cần bắt ít nhất 1 con thú để tham gia đấu trường!');
                return;
            }
            const myPet = team[0];
            const enemyPet = monstersPool[Math.floor(Math.random() * monstersPool.length)];
            const won = myPet.atk >= enemyPet.cp;
            alert(`Trận chiến giữa ${myPet.name} và ${enemyPet.name}!\n\nKết quả: ${won ? '🎉 Bạn đã giành chiến thắng vinh quang!' : '😢 Thú cưng đã thất bại, hãy nuôi dưỡng thêm nhé!'}`);
            closeModal();
        }

        window.onload = () => {
            initCamera();
            initSensors();
            updateTeamCount();
            respawnMonster();
        };
    </script>
</body>
</html>
